version: '3.8'

services:
  osh-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osh-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../../../osh-leaf.crt:/etc/caddy/osh-leaf.crt
      - ../../../osh-leaf.key:/etc/caddy/osh-leaf.key
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - proxy-data:/data
      - proxy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  proxy-data:
  proxy-config:
