name: Generate AI Integration Issues for Jules

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: 'Previous Upstream Tag (e.g., 3.0.0)'
        required: true
        default: '3.0.0'
      new_version:
        description: 'New Upstream Tag (e.g., v3.1.0)'
        required: true
        default: 'v3.1.0'

jobs:
  compare-and-ticket:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      TARGET_REPO: "tyronechrisharris/OSCAR"

    steps:
      - name: 1. Checkout Parent Repository (Full History)
        uses: actions/checkout@v4
        with:
          repository: Botts-Innovative-Research/osh-oakridge-buildnode
          fetch-depth: 0 
          submodules: recursive

      - name: 2. Generate Upstream Diffs and Open Issues
        run: |
          mkdir -p $GITHUB_WORKSPACE/jules_issues
          OLD_TAG="${{ github.event.inputs.old_version }}"
          NEW_TAG="${{ github.event.inputs.new_version }}"
          
          echo "Isolating upstream changes between $OLD_TAG and $NEW_TAG..."
          
          git config --file .gitmodules --get-regexp path | awk '{ print $2 }' | while read -r sub_path; do
            echo "Processing submodule: $sub_path"
            
            OLD_HASH=$(git ls-tree $OLD_TAG "$sub_path" 2>/dev/null | awk '{print $3}')
            NEW_HASH=$(git ls-tree $NEW_TAG "$sub_path" 2>/dev/null | awk '{print $3}')
            
            if [ -z "$OLD_HASH" ] || [ -z "$NEW_HASH" ]; then
              echo "  -> Submodule missing in one of the tags. Skipping."
              continue
            fi
            
            if [ "$OLD_HASH" = "$NEW_HASH" ]; then
              echo "  -> No upstream changes detected in $sub_path. Skipping."
              continue
            fi
            
            SUB_NAME=$(basename "$sub_path")
            cd "$sub_path"
            
            git fetch --all --tags
            
            BODY_FILE="$GITHUB_WORKSPACE/jules_issues/${SUB_NAME}-issue.md"
            PATCH_FILE="$GITHUB_WORKSPACE/jules_issues/${SUB_NAME}-upgrade.patch"
            
            # Generate the patch file STRICTLY representing upstream 3.0 -> 3.1
            git diff $OLD_HASH $NEW_HASH > $PATCH_FILE
            
            # --- JULES SYSTEM PROMPT INJECTION ---
            echo "@Jules, we need to integrate upstream logic changes into our \`OSCAR\` repository." > $BODY_FILE
            echo "" >> $BODY_FILE
            echo "Attached below is a patch file representing the exact changes made upstream between versions **$OLD_TAG** and **$NEW_TAG** for the \`$sub_path\` module." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "### 🛑 CRITICAL CONSTRAINTS & ARCHITECTURE" >> $BODY_FILE
            echo "Our codebase in \`OSCAR\` has diverged significantly from upstream to support international deployments and hardened environments. Do not blindly apply or copy-paste this patch." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "- **Internationalization (i18n):** We rely heavily on custom string replacements for localization. New upstream strings must be mapped to this structure." >> $BODY_FILE
            echo "- **Deployment & Security Strategy:** Any integrated code must strictly align with our existing containerized deployment model and secure routing network architecture. **You MUST reference \`SECURITY_ARCHITECTURE.md\` and \`SYSTEM_ARCHITECTURE.md\` for exact context.** Do not introduce dependencies, configurations, or logic that compromise isolated services, bypass existing security protocols, or break our deployment orchestration." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "### Your Task: The Integration Plan" >> $BODY_FILE
            echo "Please execute the following reasoning steps and reply with a recommendation:" >> $BODY_FILE
            echo "1. **Analyze the Blueprint:** Read the attached upstream patch file to understand the logical intent of the updates (e.g., bug fixes, new features, data flow changes)." >> $BODY_FILE
            echo "2. **Analyze Our Codebase:** Examine the current state of our files located in the flat \`$sub_path\` directory of this repository." >> $BODY_FILE
            echo "3. **Draft the Plan:** Reply to this issue explaining how we can weave the new upstream logic into our customized codebase. Specifically highlight how you will handle i18n conversions and ensure the new logic respects our documented security boundaries." >> $BODY_FILE
            echo "4. **Documentation Updates:** Outline any necessary documentation updates required by these code changes, ensuring they strictly adhere to the guidelines established in \`AI_CONTRIBUTING_RULES.md\`." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "Wait for my approval on your Integration Plan before writing the final code or opening a Pull Request." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "---" >> $BODY_FILE
            echo "### Upstream Changed Files Overview:" >> $BODY_FILE
            echo "\`\`\`text" >> $BODY_FILE
            git diff --name-status $OLD_HASH $NEW_HASH >> $BODY_FILE
            echo "\`\`\`" >> $BODY_FILE
            echo "" >> $BODY_FILE
            
            # Size Check
            FILE_SIZE=$(wc -c < "$PATCH_FILE")
            if [ $FILE_SIZE -gt 60000 ]; then
              echo "⚠️ **Note:** The upstream patch file is attached to the GitHub Actions workflow run artifacts because it is too large to embed in this text box." >> $BODY_FILE
            else
              echo "<details><summary><b>Click to expand upstream .patch file ($OLD_TAG -> $NEW_TAG)</b></summary>" >> $BODY_FILE
              echo "" >> $BODY_FILE
              echo "\`\`\`diff" >> $BODY_FILE
              cat $PATCH_FILE >> $BODY_FILE
              echo "\`\`\`" >> $BODY_FILE
              echo "</details>" >> $BODY_FILE
            fi
            
            cd - > /dev/null
            
            echo "Creating GitHub Issue for $SUB_NAME..."
            gh issue create \
              --repo $TARGET_REPO \
              --title "🧠 AI Integration: Map Upstream $NEW_TAG logic to $SUB_NAME" \
              --body-file $BODY_FILE \
              --label "enhancement" \
              --label "needs-triage"
              
          done

      - name: 3. Upload Upstream Patch Files as Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upstream-deltas-${{ github.event.inputs.old_version }}-to-${{ github.event.inputs.new_version }}
          path: jules_issues/*-upgrade.patch
