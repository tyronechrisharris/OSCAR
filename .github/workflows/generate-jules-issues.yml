name: Generate AI Integration Issues for Jules

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: 'Previous Release Tag (e.g., 3.0.0)'
        required: true
        default: '3.0.0'
      new_version:
        description: 'New Release Tag (e.g., v3.1.0)'
        required: true
        default: 'v3.1.0'

jobs:
  compare-and-ticket:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      TARGET_REPO: "tyronechrisharris/oscar-flat"

    steps:
      - name: 1. Checkout Parent Repository (Full History)
        uses: actions/checkout@v4
        with:
          repository: Botts-Innovative-Research/osh-oakridge-buildnode
          fetch-depth: 0 
          submodules: recursive
          token: ${{ secrets.SYNC_PAT }}

      - name: 2. Generate Diffs and Open Issues
        run: |
          mkdir -p $GITHUB_WORKSPACE/jules_issues
          OLD_TAG="${{ github.event.inputs.old_version }}"
          NEW_TAG="${{ github.event.inputs.new_version }}"
          
          echo "Comparing $OLD_TAG to $NEW_TAG..."
          
          git config --file .gitmodules --get-regexp path | awk '{ print $2 }' | while read -r sub_path; do
            echo "Processing submodule: $sub_path"
            
            OLD_HASH=$(git ls-tree $OLD_TAG "$sub_path" 2>/dev/null | awk '{print $3}')
            NEW_HASH=$(git ls-tree $NEW_TAG "$sub_path" 2>/dev/null | awk '{print $3}')
            
            if [ -z "$OLD_HASH" ] || [ -z "$NEW_HASH" ]; then
              echo "  -> Submodule missing in one of the tags. Skipping."
              continue
            fi
            
            if [ "$OLD_HASH" = "$NEW_HASH" ]; then
              echo "  -> No changes detected in $sub_path. Skipping."
              continue
            fi
            
            SUB_NAME=$(basename "$sub_path")
            cd "$sub_path"
            
            git fetch --all --tags
            
            BODY_FILE="$GITHUB_WORKSPACE/jules_issues/${SUB_NAME}-issue.md"
            PATCH_FILE="$GITHUB_WORKSPACE/jules_issues/${SUB_NAME}-upgrade.patch"
            
            git diff $OLD_HASH $NEW_HASH > $PATCH_FILE
            
            # --- JULES SYSTEM PROMPT INJECTION ---
            echo "@Jules, we need to integrate upstream updates from $OLD_TAG to $NEW_TAG into our flat \`$sub_path\` directory." > $BODY_FILE
            echo "Our codebase has significantly diverged from upstream due to the introduction of Internationalization (i18n) and strict security upgrades." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "### 🛑 PHASE 1: DO NOT WRITE CODE YET" >> $BODY_FILE
            echo "This is an analysis task. Do not attempt to blindly apply the attached patch file, as it will overwrite our i18n string replacements and security logic." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "**Your Instructions:**" >> $BODY_FILE
            echo "1. Review the attached diff to understand the logical intent of the upstream changes (e.g., bug fixes, new features, logic optimizations)." >> $BODY_FILE
            echo "2. Analyze the current state of our files in the \`$sub_path\` directory." >> $BODY_FILE
            echo "3. Reply to this issue with a detailed **Integration Plan**. For each changed file, explain:" >> $BODY_FILE
            echo "   - What the upstream change is doing conceptually." >> $BODY_FILE
            echo "   - How we can achieve that same logical outcome while preserving our existing i18n structure and security measures." >> $BODY_FILE
            echo "   - Identify any hardcoded strings in the upstream patch that will need to be converted to our i18n format." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "Wait for my approval on your Integration Plan before proceeding to Phase 2." >> $BODY_FILE
            echo "" >> $BODY_FILE
            echo "---" >> $BODY_FILE
            echo "### Changed Files:" >> $BODY_FILE
            echo "\`\`\`text" >> $BODY_FILE
            git diff --name-status $OLD_HASH $NEW_HASH >> $BODY_FILE
            echo "\`\`\`" >> $BODY_FILE
            echo "" >> $BODY_FILE
            
            # Size Check for GitHub Issue limits
            FILE_SIZE=$(wc -c < "$PATCH_FILE")
            if [ $FILE_SIZE -gt 60000 ]; then
              echo "⚠️ **Note:** The patch file for this update is too large to embed in the issue body. The raw \`.patch\` file has been attached to the GitHub Actions workflow run artifacts." >> $BODY_FILE
            else
              echo "<details><summary><b>Click to expand .patch file</b></summary>" >> $BODY_FILE
              echo "" >> $BODY_FILE
              echo "\`\`\`diff" >> $BODY_FILE
              cat $PATCH_FILE >> $BODY_FILE
              echo "\`\`\`" >> $BODY_FILE
              echo "</details>" >> $BODY_FILE
            fi
            
            cd - > /dev/null
            
            echo "Creating GitHub Issue for $SUB_NAME..."
            gh issue create \
              --repo $TARGET_REPO \
              --title "🚀 Upstream Sync: Analyze $SUB_NAME ($NEW_TAG)" \
              --body-file $BODY_FILE \
              --label "enhancement"
              
          done

      - name: 3. Upload Patch Files as Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jules-patches-${{ github.event.inputs.old_version }}-to-${{ github.event.inputs.new_version }}
          path: jules_issues/*-upgrade.patch
