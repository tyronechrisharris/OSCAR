name: Automated Build and Versioned Releases
on:
  pull_request:
    types:
      - closed
    # Removed the 'branches' filter so this triggers on PRs to ANY branch
  workflow_dispatch: # Enables manual trigger (defaults to the branch selected in the GitHub UI)

permissions:
  contents: write

jobs:
  build-and-release:
    # Runs if a PR is merged OR if triggered manually
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Explicitly check out the branch the PR merged into, or the branch selected manually
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build project
        run: |
          chmod +x ./build-all.sh
          ./build-all.sh

      - name: Determine Version and Rename Artifact
        id: date
        run: |
          # Get current date in M-DD-YYYY format
          CURRENT_DATE=$(date +'%-m-%d-%Y')
          BASE_NAME="oscar_$CURRENT_DATE"
          
          # Check for existing tags matching today's date
          EXISTING_TAGS=$(git tag -l "${BASE_NAME}*" | sort -V)
          
          if [ -z "$EXISTING_TAGS" ]; then
            FINAL_NAME="$BASE_NAME"
          else
            # Get the last tag
            LAST_TAG=$(echo "$EXISTING_TAGS" | sort -V | tail -n 1)
            
            if [[ "$LAST_TAG" == *_*_* ]]; then
              # Extract the suffix character and increment it
              SUFFIX=${LAST_TAG##*_}
              NEXT_SUFFIX=$(echo "$SUFFIX" | tr 'A-Y' 'B-Z')
              FINAL_NAME="${BASE_NAME}_${NEXT_SUFFIX}"
            else
              # First build of the day exists, append '_B'
              FINAL_NAME="${BASE_NAME}_B"
            fi
          fi
          
          echo "Determined version: $FINAL_NAME"
          echo "date=$CURRENT_DATE" >> $GITHUB_OUTPUT
          echo "tag_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          
          # Rename the artifact
          mv build/distributions/oscar-3.0.0.zip "build/distributions/${FINAL_NAME}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Ensures the release and tag are attached to the correct branch, not the default branch
          target_commitish: ${{ github.event.pull_request.base.ref || github.ref_name }}
          tag_name: ${{ steps.date.outputs.tag_name }}
          files: build/distributions/${{ steps.date.outputs.tag_name }}.zip
          body: |
            ## Release Snapshot: ${{ github.event.pull_request.title || 'Manual Trigger' }}
            **Branch:** ${{ github.event.pull_request.base.ref || github.ref_name }}
            **Merged from PR:** #${{ github.event.pull_request.number || 'N/A' }}
            **Summary:** ${{ github.event.pull_request.body || 'Manually triggered build for testing.' }}
            **Build Date:** ${{ steps.date.outputs.date }}
