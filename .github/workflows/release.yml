name: Release OSCAR Stack

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (latest or dev)'
        required: true
        type: choice
        options:
          - latest
          - dev
        default: 'dev'
      suffix:
        description: 'Optional suffix to append to release name (e.g., v3.0.0-beta)'
        required: false
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    # Run if it's a manual trigger OR if a PR was merged into main
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build the project
        run: |
          chmod +x ./build-all.sh
          ./build-all.sh
          echo "Contents of build/distributions:"
          ls -lah build/distributions || true

      - name: Generate Incremental Date Tag
        id: generate_tag
        run: |
          TODAY=$(date +'%Y%m%d')
          LATEST_TAG=$(git tag -l "${TODAY}*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            SUFFIX="a"
          else
            LAST_CHAR="${LATEST_TAG: -1}"
            SUFFIX=$(echo "$LAST_CHAR" | tr 'a-y' 'b-z')
          fi

          NEW_TAG="${TODAY}${SUFFIX}"
          echo "Calculated new tag: $NEW_TAG"
          echo "IMAGE_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Determine Release Details
        id: release_info
        env:
          INPUT_TYPE: ${{ inputs.release_type }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
          INPUT_NOTES: ${{ inputs.notes }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EOF_DELIM=$(cat /proc/sys/kernel/random/uuid)
          TAG_NAME="${{ env.IMAGE_TAG }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${INPUT_TYPE}" = "latest" ]; then
              if [ -n "${INPUT_SUFFIX}" ]; then
                CLEAN_SUFFIX=$(echo "${INPUT_SUFFIX}" | tr -dc '[:alnum:]_.-')
                TAG_NAME="${TAG_NAME}_${CLEAN_SUFFIX}"
              fi
              echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
              echo "RELEASE_NAME=Manual Production Release ${TAG_NAME}" >> $GITHUB_ENV
              echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            else
              TAG_NAME="${TAG_NAME}_dev"
              if [ -n "${INPUT_SUFFIX}" ]; then
                CLEAN_SUFFIX=$(echo "${INPUT_SUFFIX}" | tr -dc '[:alnum:]_.-')
                TAG_NAME="${TAG_NAME}_${CLEAN_SUFFIX}"
              fi
              echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
              echo "RELEASE_NAME=Manual Dev Release ${TAG_NAME}" >> $GITHUB_ENV
              echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            fi

            echo "RELEASE_NOTES<<${EOF_DELIM}" >> $GITHUB_ENV
            echo "${INPUT_NOTES}" >> $GITHUB_ENV
            echo "${EOF_DELIM}" >> $GITHUB_ENV
          else
            # Automated release from merged PR
            echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Auto-Release ${TAG_NAME}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV

            echo "RELEASE_NOTES<<${EOF_DELIM}" >> $GITHUB_ENV
            echo "Automated release from merged PR #${{ github.event.pull_request.number }}. Updates:" >> $GITHUB_ENV
            echo "${PR_BODY}" >> $GITHUB_ENV
            echo "${EOF_DELIM}" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push Docker Images
        run: |
          DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"

          shopt -s nullglob
          ZIPS=(build/distributions/*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No release zip found in build/distributions"
            echo "Debug listing:"
            find build -maxdepth 3 -type f | sort || true
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"
          echo "Extracting $ZIP_FILE for Docker build context..."

          # Extract the zip to a temporary folder
          unzip -q "$ZIP_FILE" -d ./docker_temp

          # Move ALL contents from the extracted wrapper folder directly to the workspace root
          EXTRACTED_DIR=$(find ./docker_temp -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$EXTRACTED_DIR" ]; then
            cp -r "$EXTRACTED_DIR"/* ./
          else
            cp -r ./docker_temp/* ./
          fi
          rm -rf ./docker_temp

          # CRITICAL FIX: Forcefully whitelist the necessary folders in .dockerignore
          if [ -f .dockerignore ]; then
            echo "" >> .dockerignore
            echo "!osh-node-oscar/" >> .dockerignore
            echo "!osh-node-oscar/**" >> .dockerignore
            echo "!postgis/" >> .dockerignore
            echo "!postgis/**" >> .dockerignore
            echo "Forcefully whitelisted directories in .dockerignore"
          fi

          if [ "${{ env.IS_PRERELEASE }}" = "false" ]; then
            # Production Release (Manual or Merged PR)
            echo "Building and pushing Production images with tags: latest and ${{ env.TAG_NAME }}"
            BACKEND_TAGS="-t ${DOCKER_USER}/osh-backend:latest -t ${DOCKER_USER}/osh-backend:${{ env.TAG_NAME }}"
            POSTGIS_TAGS="-t ${DOCKER_USER}/postgis:latest -t ${DOCKER_USER}/postgis:${{ env.TAG_NAME }}"
          else
            # Dev Release
            echo "Building and pushing Dev images with tag: ${{ env.TAG_NAME }}"
            BACKEND_TAGS="-t ${DOCKER_USER}/osh-backend:${{ env.TAG_NAME }}"
            POSTGIS_TAGS="-t ${DOCKER_USER}/postgis:${{ env.TAG_NAME }}"
          fi

          # OSH Backend
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            ${BACKEND_TAGS} \
            -f Dockerfile.osh .

          # PostGIS
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            ${POSTGIS_TAGS} \
            -f ./postgis/Dockerfile ./postgis

      - name: Prepare Release Environment File
        run: |
          # The extraction process above might have brought in its own .env.template
          # Ensure we are using the one from the build context and updating it.
          if [ -f .env.template ]; then
            cp .env.template .env
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${{ env.TAG_NAME }}/" .env
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${{ env.TAG_NAME }}/" .env.template
          else
            echo "WARNING: .env.template not found after extraction. Falling back to simple .env creation."
            echo "IMAGE_TAG=${{ env.TAG_NAME }}" > .env
          fi

      - name: Prepare Artifacts
        run: |
          # 1. Create a lightweight oscar.zip containing only deployment scripts and configs
          mkdir oscar_bundle
          cp dist/release/launch-*.sh oscar_bundle/
          cp dist/release/launch-*.bat oscar_bundle/
          cp dist/release/stop-*.sh oscar_bundle/
          cp dist/release/stop-*.bat oscar_bundle/
          cp dist/release/reset-node.sh oscar_bundle/
          cp docker-compose.yml oscar_bundle/
          cp .env oscar_bundle/
          cp .env.template oscar_bundle/

          # Ensure all shell scripts are executable
          chmod +x oscar_bundle/*.sh

          # Create the small zip
          zip -j oscar.zip oscar_bundle/*

          # 2. Handle the main release artifact (the full stack zip)
          cd build/distributions
          # The artifact is named oscar-<version>.zip or osh-node-oscar-<version>.zip.
          # We rename it to the release tag version format required.
          ORIGINAL_ZIP=$(ls oscar-*.zip 2>/dev/null | grep -v "^oscar.zip$" | head -n 1 || true)
          if [ -n "$ORIGINAL_ZIP" ]; then
            mv "$ORIGINAL_ZIP" "${TAG_NAME}.zip"
          else
            echo "No artifact found matching oscar-*.zip"
            ALT_ZIP=$(ls osh-node-oscar-*.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ALT_ZIP" ]; then
              mv "$ALT_ZIP" "${TAG_NAME}.zip"
            else
              echo "No artifact found at all."
              ls -l
              # Force workflow to fail if artifact not found
              sh -c 'exit 1'
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            build/distributions/${{ env.TAG_NAME }}.zip
            oscar.zip
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
