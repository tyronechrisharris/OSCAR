name: Release OSCAR Stack

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., oscar_3-15-2024_A)'
        required: true
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    # Run if it's a manual trigger or if a PR was merged into main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build the project
        run: |
          chmod +x ./build-all.sh
          ./build-all.sh

      - name: Determine Release Details
        id: release_info
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${INPUT_VERSION}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Release ${INPUT_VERSION}" >> $GITHUB_ENV

            echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
            echo "${INPUT_NOTES}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            # Automated release from PR
            DATE_STR=$(date +'%-m-%d-%Y')
            BASE_TAG="oscar_${DATE_STR}"
            
            # Find the next available letter suffix (A, B, C...)
            SUFFIX="A"
            for letter in {A..Z}; do
              if ! gh release view "${BASE_TAG}_${letter}" >/dev/null 2>&1; then
                SUFFIX="${letter}"
                break
              fi
            done

            TAG_NAME="${BASE_TAG}_${SUFFIX}"
            echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Auto-Release ${TAG_NAME}" >> $GITHUB_ENV

            echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
            echo "${PR_BODY}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Prepare Artifacts
        run: |
          cd build/distributions
          # The README indicates the artifact is named osh-node-oscar-<version>.zip.
          # We rename it to the release tag version format required: oscar_M-DD-YYYY_A.zip
          ORIGINAL_ZIP=$(ls osh-node-oscar-*.zip | head -n 1)
          if [ -n "$ORIGINAL_ZIP" ]; then
            mv "$ORIGINAL_ZIP" "${TAG_NAME}.zip"
          else
            echo "No artifact found matching osh-node-oscar-*.zip"
            # It might be named oscar-*.zip instead, let's check
            ALT_ZIP=$(ls oscar-*.zip | head -n 1 || true)
            if [ -n "$ALT_ZIP" ]; then
              mv "$ALT_ZIP" "${TAG_NAME}.zip"
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          files: build/distributions/${{ env.TAG_NAME }}.zip
