name: Deploy and Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Automated Build and Versioned Releases"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Latest Release Artifact
        uses: robinraju/release-downloader@v1.10
        with:
          latest: true
          fileName: 'oscar_*.zip'
          out-file-path: 'build/distributions/'

      - name: Unzip Release Artifact
        run: |
          mkdir -p deployment
          unzip build/distributions/oscar_*.zip -d deployment

      - name: Launch Program
        run: |
          cd deployment/*/
          chmod +x launch-all.sh
          # Run the launch script in the background
          ./launch-all.sh > launch_output.log 2>&1 &

          # Wait for the program to fully start up.
          echo "Waiting for OSH node to start (up to 3 minutes)..."
          for i in {1..36}; do
            if curl -s -f -k -L https://localhost/ > /dev/null && curl -s -f -L http://localhost:8282/sensorhub/admin > /dev/null; then
              echo "OSH Node is up!"
              break
            fi
            sleep 5
            if [ $i -eq 36 ]; then
              echo "Timeout waiting for OSH node."
              exit 1
            fi
          done

      - name: Basic Tests
        run: |
          echo "Running basic test to ensure main UI is reachable..."
          curl -s -f -L http://localhost:8282/sensorhub/admin > /dev/null
          echo "Main UI reachable on port 8282."
          echo "Running basic test to ensure proxy is reachable..."
          curl -s -f -k -L https://localhost/ > /dev/null
          echo "Proxy reachable on port 443."

      - name: Export Container Logs
        if: always()
        run: |
          echo "Collecting Docker container logs..."
          docker ps -a
          APP_DIR=$(ls -d deployment/*/ 2>/dev/null || true)
          if [ -n "$APP_DIR" ]; then
            mkdir -p "${APP_DIR}/container_logs"
            for container in $(docker ps -aq); do
              container_name=$(docker inspect --format '{{.Name}}' $container | sed 's/\///')
              echo "Exporting logs for container $container_name..."
              docker logs $container > "${APP_DIR}/container_logs/${container_name}.log" 2>&1
            done
          else
            echo "Deployment directory not found. Skipping log export to artifact."
            # Fallback to stdout if directory doesn't exist so we still see them in GH Actions UI
            for container in $(docker ps -aq); do
              echo "Logs for $container:"
              docker logs $container
            done
          fi

      - name: Dump OSH Node Logs
        if: always()
        run: |
          echo "Collecting OSH Node logs..."
          # The application directory where launch-all.sh is executed
          APP_DIR=$(ls -d deployment/*/)

          if [ -f "${APP_DIR}/launch_output.log" ]; then
            echo "============================================="
            echo "launch_output.log:"
            echo "============================================="
            cat "${APP_DIR}/launch_output.log"
          fi

          if [ -d "${APP_DIR}/logs" ]; then
            for logfile in "${APP_DIR}/logs"/*; do
              echo "============================================="
              echo "Log file: $logfile"
              echo "============================================="
              cat "$logfile"
            done
          fi

      - name: Upload Logs as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: |
            deployment/*/launch_output.log
            deployment/*/logs/
            deployment/*/container_logs/
