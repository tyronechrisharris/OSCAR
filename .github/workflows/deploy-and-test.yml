name: Deploy and Test OSCAR Stack
on:
  push:
    branches:
      - 'feature/add-caddy-proxy-dual-mode-tls-*'
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build project
        run: |
          chmod +x ./build-all.sh
          ./build-all.sh

      - name: Extract Distribution
        run: |
          mkdir -p deploy
          unzip build/distributions/oscar-3.0.0.zip -d deploy
          # Historical release ZIP structure puts everything in a subfolder oscar-3.0.0/
          # but we want to run from that root
          mv deploy/oscar-3.0.0/* deploy/
          rmdir deploy/oscar-3.0.0/

      - name: Deploy Stack
        run: |
          cd deploy
          chmod +x launch-all.sh
          # Set mandatory env vars for headless CI
          export DEPLOYMENT_PROFILE=federated
          export DOMAIN=localhost
          ./launch-all.sh

      - name: Run Smoke Tests
        run: |
          # Wait a bit for services to settle beyond internal healthchecks
          sleep 30
          # Verify Caddy is responsive on 80/443 (insecurely since it might be self-signed/localhost)
          curl -v http://localhost || exit 1
          curl -vk https://localhost || exit 1
          # Verify OSH is NOT accessible on 8282 from host
          if curl -s --max-time 5 http://localhost:8282; then
            echo "Security violation: OSH port 8282 is accessible from host!"
            exit 1
          else
            echo "Success: OSH port 8282 is isolated."
          fi

      - name: Capture Logs on Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs
