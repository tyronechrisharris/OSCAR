name: Dispatch AI Updates to OSCAR Submodules

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-and-distribute:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      BRANCH_NAME: jules-sync-${{ github.run_id }}
      PR_TITLE: "${{ github.event.pull_request.title || 'Automated Sync: Updates from OSCAR' }}"
      PR_BODY: "${{ github.event.pull_request.body || 'These changes were generated and verified in the flattened workspace.' }}"
      ORIGINAL_PR_URL: "${{ github.event.pull_request.html_url || 'Manual Workflow Dispatch' }}"

    steps:
      - name: 1. Prepare Base PR Body and Tracking Files
        run: |
          echo "$PR_BODY" > $GITHUB_WORKSPACE/base_body.txt
          echo "" >> $GITHUB_WORKSPACE/base_body.txt
          echo "---" >> $GITHUB_WORKSPACE/base_body.txt
          echo "### 🔄 Auto-Distributed via Sync" >> $GITHUB_WORKSPACE/base_body.txt
          echo "**Original Flat Repo PR:** $ORIGINAL_PR_URL" >> $GITHUB_WORKSPACE/base_body.txt
          
          touch $GITHUB_WORKSPACE/raw_urls.txt
          touch $GITHUB_WORKSPACE/bullet_urls.txt

      - name: 2. Checkout the Flat Repository
        uses: actions/checkout@v4
        with:
          path: oscar_flat

      - name: 3. Checkout the Parent Master Repository
        uses: actions/checkout@v4
        with:
          repository: tyronechrisharris/osh-oakridge-buildnode
          path: oscar_master
          submodules: recursive
          token: ${{ secrets.SYNC_PAT }}

      - name: 4. Sync Files from Flat to Master
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.gitmodules' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            oscar_flat/ oscar_master/

      - name: 5. Configure Git User Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 6. Process Submodules and Create PRs
        run: |
          declare -A submodules=(
            ["include/osh-addons"]="tyronechrisharris/osh-addons|opensensorhub/osh-addons|master"
            ["include/osh-core"]="tyronechrisharris/osh-core|earocorn/osh-core|master"
            ["include/osh-oakridge-modules"]="tyronechrisharris/osh-oakridge-modules|Botts-Innovative-Research/osh-oakridge-modules|main"
            ["web/oscar-viewer"]="tyronechrisharris/oscar-viewer|Botts-Innovative-Research/oscar-viewer|main"
          )

          for path in "${!submodules[@]}"; do
            echo "Checking submodule: $path"
            IFS='|' read -r FORK_REPO UPSTREAM_REPO BASE_BRANCH <<< "${submodules[$path]}"
            cd $GITHUB_WORKSPACE/oscar_master/$path
            
            if [[ -n $(git status -s) ]]; then
              echo "Changes detected in $path. Processing..."
              
              git checkout -b $BRANCH_NAME
              git add .
              git commit -m "Auto-sync updates: $PR_TITLE"
              git push https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/$FORK_REPO.git $BRANCH_NAME
              
              NEW_PR_URL=$(gh pr create \
                --repo $UPSTREAM_REPO \
                --title "$PR_TITLE" \
                --body-file $GITHUB_WORKSPACE/base_body.txt \
                --head tyronechrisharris:$BRANCH_NAME \
                --base $BASE_BRANCH)
              
              echo "Created PR: $NEW_PR_URL"
              
              echo "$NEW_PR_URL" >> $GITHUB_WORKSPACE/raw_urls.txt
              echo "- $NEW_PR_URL" >> $GITHUB_WORKSPACE/bullet_urls.txt
            else
              echo "No changes in $path. Skipping."
            fi
          done

      - name: 7. Process Parent Repository Pointers
        run: |
          echo "Checking parent repository for updated submodules..."
          cd $GITHUB_WORKSPACE/oscar_master
          
          if [[ -n $(git status -s) ]]; then
            echo "Submodule pointers modified. Creating parent PR..."
            
            git checkout -b $BRANCH_NAME
            git add .
            git commit -m "Update submodule pointers: $PR_TITLE"
            git push https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/tyronechrisharris/osh-oakridge-buildnode.git $BRANCH_NAME
            
            NEW_PR_URL=$(gh pr create \
              --repo Botts-Innovative-Research/osh-oakridge-buildnode \
              --title "Update OSCAR submodule pointers for: $PR_TITLE" \
              --body-file $GITHUB_WORKSPACE/base_body.txt \
              --head tyronechrisharris:$BRANCH_NAME \
              --base main)
              
            echo "$NEW_PR_URL" >> $GITHUB_WORKSPACE/raw_urls.txt
            echo "- $NEW_PR_URL" >> $GITHUB_WORKSPACE/bullet_urls.txt
          else
            echo "No submodule pointers changed in parent repo."
          fi

      - name: 8. The 2nd Pass - Cross-Link All Generated PRs
        run: |
          if [ -s $GITHUB_WORKSPACE/raw_urls.txt ]; then
            echo "Cross-linking all generated Pull Requests..."
            
            echo "" >> $GITHUB_WORKSPACE/base_body.txt
            echo "### 🔗 Related Updates in this Sync:" >> $GITHUB_WORKSPACE/base_body.txt
            cat $GITHUB_WORKSPACE/bullet_urls.txt >> $GITHUB_WORKSPACE/base_body.txt
            
            cat $GITHUB_WORKSPACE/raw_urls.txt | while read url; do
              echo "Updating body for: $url"
              gh pr edit $url --body-file $GITHUB_WORKSPACE/base_body.txt
            done
            
            echo "✅ All PRs successfully cross-linked!"
          else
            echo "No PRs were created during this run. Skipping cross-link step."
          fi
