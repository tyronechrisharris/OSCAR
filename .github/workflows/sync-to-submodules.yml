name: Dispatch AI Updates to OSCAR Submodules

# Trigger the action whenever code is pushed (or a PR is merged) into the main branch
on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions tab

jobs:
  sync-and-distribute:
    runs-on: ubuntu-latest
    env:
      # Use a Personal Access Token to authenticate across different repositories
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      BRANCH_NAME: jules-sync-${{ github.run_id }}

    steps:
      - name: 1. Checkout the Flat Repository
        uses: actions/checkout@v4
        with:
          path: oscar_flat

      - name: 2. Checkout the Parent Master Repository
        uses: actions/checkout@v4
        with:
          repository: tyronechrisharris/osh-oakridge-buildnode
          path: oscar_master
          submodules: recursive
          token: ${{ secrets.SYNC_PAT }}

      - name: 3. Sync Files from Flat to Master
        run: |
          # Use rsync to distribute the flattened files into the submodule structure
          # Excluding Git metadata and build configurations to protect the master structure
          rsync -av \
            --exclude='.git/' \
            --exclude='.gitmodules' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            oscar_flat/ oscar_master/

      - name: 4. Configure Git User Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 5. Process Submodules and Create PRs (DRY RUN)
        run: |
          declare -A submodules=(
            ["include/osh-addons"]="tyronechrisharris/osh-addons|earocorn/osh-addons"
            ["include/osh-core"]="tyronechrisharris/osh-core|earocorn/osh-core"
            ["include/osh-oakridge-modules"]="tyronechrisharris/osh-oakridge-modules|Botts-Innovative-Research/osh-oakridge-modules"
            ["web/oscar-viewer"]="tyronechrisharris/oscar-viewer|Botts-Innovative-Research/oscar-viewer"
          )

          for path in "${!submodules[@]}"; do
            echo "----------------------------------------"
            echo "Checking submodule: $path"
            IFS='|' read -r FORK_REPO UPSTREAM_REPO <<< "${submodules[$path]}"
            cd $GITHUB_WORKSPACE/oscar_master/$path
            
            if [[ -n $(git status -s) ]]; then
              echo "✅ Changes detected in $path. Processing..."
              
              # DRY RUN: Print the actions instead of doing them
              git checkout -b $BRANCH_NAME
              git add .
              git commit -m "Auto-sync Jules updates from oscar-flat" || true
              
              echo "🚀 DRY RUN: Would push to -> $FORK_REPO (Branch: $BRANCH_NAME)"
              # git push https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/$FORK_REPO.git $BRANCH_NAME
              
              echo "📬 DRY RUN: Would open PR against -> $UPSTREAM_REPO"
              # gh pr create --repo $UPSTREAM_REPO --title "Automated AI Sync" --head tyronechrisharris:$BRANCH_NAME --base main
            else
              echo "⏸️ No changes in $path. Skipping."
            fi
          done

      - name: 6. Process Parent Repository Pointers (DRY RUN)
        run: |
          echo "----------------------------------------"
          echo "Checking parent repository for updated submodules..."
          cd $GITHUB_WORKSPACE/oscar_master
          
          if [[ -n $(git status -s) ]]; then
            echo "✅ Submodule pointers modified. Creating parent PR..."
            
            git checkout -b $BRANCH_NAME
            git add .
            git commit -m "Update submodule pointers from auto-sync" || true
            
            echo "🚀 DRY RUN: Would push parent repo to -> tyronechrisharris/osh-oakridge-buildnode"
            # git push https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/tyronechrisharris/osh-oakridge-buildnode.git $BRANCH_NAME
            
            echo "📬 DRY RUN: Would open PR against -> Botts-Innovative-Research/osh-oakridge-buildnode"
            # gh pr create --repo Botts-Innovative-Research/osh-oakridge-buildnode --title "Update OSCAR submodule pointers" --head tyronechrisharris:$BRANCH_NAME --base main
          else
            echo "⏸️ No submodule pointers changed in parent repo."
          fi
