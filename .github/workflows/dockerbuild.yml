name: Automated Build and Versioned Releases docker
on:
  pull_request:
    types:
      - closed
  workflow_dispatch: # Enables manual trigger

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      # NEW STEP: Sanitize Windows Formatting Gremlins
      - name: Sanitize Cross-Platform Files (Remove BOM & CRLF)
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix
          
          # dos2unix automatically converts CRLF to LF AND strips the UTF-8 BOM
          echo "Sanitizing Caddyfile..."
          find . -type f -name "Caddyfile" -exec dos2unix {} +
          
          echo "Sanitizing shell scripts..."
          find . -type f -name "*.sh" -exec dos2unix {} +
          
          echo "Sanitizing template files..."
          find . -type f -name "*.template" -exec dos2unix {} +

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # MODIFIED STEP: Ensure a Clean Build Environment
      - name: Build project
        run: |
          # Make sure all scripts are executable
          chmod +x ./build-all.sh
          find . -type f -name "*.sh" -exec chmod +x {} +
          
          # Force a clean build to prevent zipping stale binaries
          # (Assuming your build script uses Gradle wrapper under the hood)
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean
          fi
          
          ./build-all.sh

      - name: Determine Version and Rename Artifact
        id: date
        run: |
          CURRENT_DATE=$(date +'%-m-%d-%Y')
          BASE_NAME="oscar_$CURRENT_DATE"
          
          EXISTING_TAGS=$(git tag -l "${BASE_NAME}*" | sort -V)
          
          if [ -z "$EXISTING_TAGS" ]; then
            FINAL_NAME="$BASE_NAME"
          else
            LAST_TAG=$(echo "$EXISTING_TAGS" | sort -V | tail -n 1)
            
            if [[ "$LAST_TAG" == *_*_* ]]; then
              SUFFIX=${LAST_TAG##*_}
              NEXT_SUFFIX=$(echo "$SUFFIX" | tr 'A-Y' 'B-Z')
              FINAL_NAME="${BASE_NAME}_${NEXT_SUFFIX}"
            else
              FINAL_NAME="${BASE_NAME}_B"
            fi
          fi
          
          echo "Determined version: $FINAL_NAME"
          echo "date=$CURRENT_DATE" >> $GITHUB_OUTPUT
          echo "tag_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          
          mv build/distributions/oscar-3.0.0.zip "build/distributions/${FINAL_NAME}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.event.pull_request.base.ref || github.ref_name }}
          tag_name: ${{ steps.date.outputs.tag_name }}
          files: build/distributions/${{ steps.date.outputs.tag_name }}.zip
          body: |
            ## OSCAR Containerized Release Snapshot: ${{ github.event.pull_request.title || 'Manual Trigger' }}
            **Branch:** ${{ github.event.pull_request.base.ref || github.ref_name }}
            **Merged from PR:** #${{ github.event.pull_request.number || 'N/A' }}
            **Summary:** ${{ github.event.pull_request.body || 'Manually triggered build for testing.' }}
            **Build Date:** ${{ steps.date.outputs.date }}

            ### Deployment Instructions:
            1. Download and extract the `${{ steps.date.outputs.tag_name }}.zip` file.
            2. Follow the instructions in `README.md` for launching the unified Docker Compose stack.
