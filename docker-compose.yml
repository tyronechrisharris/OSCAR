services:
  init-secrets:
    image: eclipse-temurin:21-jre-alpine
    container_name: oscar-init-secrets
    volumes:
      - oscar_secrets:/secrets
    command: >
      /bin/sh -c "
      apk add --no-cache openssl;
      if [ ! -f /secrets/.db_password ]; then
        echo 'Generating new database password...';
        openssl rand -base64 32 > /secrets/.db_password;
      fi;
      if [ ! -f /secrets/.app_secrets ]; then
        echo 'Generating new keystore and truststore password...';
        openssl rand -base64 32 > /secrets/.app_secrets;

        echo 'Creating secure truststore.jks with generated password...';
        cp $$JAVA_HOME/lib/security/cacerts /secrets/truststore.jks;
        chmod 644 /secrets/truststore.jks;

        NEW_PASS=$$(cat /secrets/.app_secrets);
        keytool -storepasswd -new $$NEW_PASS -keystore /secrets/truststore.jks -storepass changeit;
      fi;

      if [ ! -f /secrets/server.crt ]; then
        echo 'Generating new self-signed certificate for PostGIS...';
        openssl req -new -x509 -days 3650 -nodes -text -out /secrets/server.crt -keyout /secrets/server.key -subj "/CN=oscar-postgis";
        chmod 600 /secrets/server.key;
        chown 999:999 /secrets/server.key /secrets/server.crt;
      fi;
      "

  osh-postgis:
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    image: harristc825/oscar-postgis:${OSCAR_VERSION:-latest}
    container_name: oscar-postgis-container
    command: >
      -c ssl=on
      -c ssl_cert_file=/secrets/server.crt
      -c ssl_key_file=/secrets/server.key
    environment:
      - POSTGRES_DB=gis
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/secrets/.db_password
      - POSTGRES_SHARED_BUFFERS=${DB_SHARED_BUFFERS:-128MB}
      - POSTGRES_EFFECTIVE_CACHE_SIZE=${DB_EFFECTIVE_CACHE_SIZE:-512MB}
      - POSTGRES_WORK_MEM=${DB_WORK_MEM:-4MB}
      - POSTGRES_MAX_WAL_SIZE=${DB_MAX_WAL_SIZE:-1GB}
      - POSTGRES_MAX_CONNECTIONS=${DB_MAX_CONNECTIONS:-50}
      - POSTGRES_MAINTENANCE_WORK_MEM=${DB_MAINTENANCE_WORK_MEM:-64MB}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - oscar_secrets:/secrets:ro
    networks:
      - osh-internal
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-1G}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis"]
      interval: 10s
      timeout: 5s
      retries: 5

  osh-backend:
    image: harristc825/oscar-backend:${OSCAR_VERSION:-latest}
    container_name: oscar-backend-container
    environment:
      - DB_HOST=${DB_HOST:-osh-postgis}
      - POSTGRES_PASSWORD_FILE=/secrets/.db_password
      - KEYSTORE=/app/config/osh-keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - TRUSTSTORE=/secrets/truststore.jks
      - TRUSTSTORE_TYPE=JKS
      - SHOW_CMD=true
      # CRITICAL FIX 1: Forces backend to use the shared secrets volume
      - KEYSTORE_PASSWORD_FILE=/secrets/.app_secrets
      - TRUSTSTORE_PASSWORD_FILE=/secrets/.app_secrets
      - JAVA_OPTS=-Xmx${BACKEND_MEM_LIMIT:-2G} -Xms${BACKEND_MEM_LIMIT:-2G} -DsocksProxyHost=tailscale -DsocksProxyPort=1055
    volumes:
      - ./osh-node-oscar/config:/app/config
      - ./osh-node-oscar/db:/app/db
      - ./osh-node-oscar/files:/app/files
      - oscar_secrets:/secrets:ro
    networks:
      - osh-internal
    depends_on:
      osh-postgis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-2G}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8282:8282"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:8282/sensorhub/api | grep -q 'HTTP/1.1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: oscar-mediamtx
    network_mode: "host"
    environment:
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: oscar-tailscale
    hostname: ${NODE_NAME:-oscar-server}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_ROUTES=${TS_ROUTES:-}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKS5_SERVER=:1055
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    ports:
      - "127.0.0.1:80:80"
      - "443:443"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/sock:/var/run/tailscale
    networks:
      - osh-internal
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  osh-proxy:
    image: caddy:latest
    container_name: oscar-proxy
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started
      osh-backend:
        condition: service_healthy
    environment:
      - TAILSCALE_DOMAIN=${TAILSCALE_DOMAIN:-invalid.local}
      - TAILSCALE_IP=${TAILSCALE_IP:-127.0.0.1}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./tailscale/sock:/var/run/tailscale:ro
      # CRITICAL FIX 2: Appends /config to the host path so Caddy finds the certs
      - ./osh-node-oscar/config:/etc/caddy/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - sh
      - -c
      - |
        cat << EOF > /etc/caddy/Caddyfile
        http://localhost {
            reverse_proxy http://osh-backend:8282
        }
        https://localhost, 127.0.0.1 {
            reverse_proxy http://osh-backend:8282
            tls /etc/caddy/certs/osh-leaf.crt /etc/caddy/certs/osh-leaf.key
        }
        ${TAILSCALE_DOMAIN} {
            reverse_proxy http://osh-backend:8282
            tls {
                get_certificate tailscale
            }
        }
        EOF
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

networks:
  osh-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  oscar_secrets:
