services:
  init-secrets:
    image: eclipse-temurin:21.0.6_7-jre-alpine
    container_name: oscar-init-secrets
    volumes:
      - oscar_secrets:/secrets
      - mtx_secrets:/mtx-secrets
    command: >
      /bin/sh -c '
      apk add --no-cache openssl;
      if [ ! -f /secrets/.db_password ]; then
        echo "Generating new database password...";
        openssl rand -base64 32 > /secrets/.db_password;
      fi;
      if [ ! -f /secrets/.app_secrets ]; then
        echo "Generating new keystore and truststore password...";
        openssl rand -base64 32 > /secrets/.app_secrets;

        NEW_PASS=$$(cat /secrets/.app_secrets);

        echo "Generating PEM Root CA...";
        openssl req -x509 -nodes -newkey rsa:2048 -keyout /secrets/ca.key -out /secrets/ca.pem -days 7300 -subj "/CN=OSCAR Root CA";

        echo "Generating PEM Server Certificate...";
        openssl req -nodes -newkey rsa:2048 -keyout /secrets/server.key -out /secrets/server.csr -subj "/CN=localhost";
        openssl x509 -req -in /secrets/server.csr -CA /secrets/ca.pem -CAkey /secrets/ca.key -CAcreateserial -out /secrets/server.pem -days 3650;

        echo "Creating secure truststore.jks with generated password and Root CA...";
        cp $$JAVA_HOME/lib/security/cacerts /secrets/truststore.jks;
        chmod 644 /secrets/truststore.jks;
        keytool -storepasswd -new $$NEW_PASS -keystore /secrets/truststore.jks -storepass changeit;
        keytool -import -trustcacerts -alias oscar-root -file /secrets/ca.pem -keystore /secrets/truststore.jks -storepass $$NEW_PASS -noprompt;

        echo "Creating PKCS12 keystore with Server Certificate...";
        openssl pkcs12 -export -out /secrets/osh-keystore.p12 -inkey /secrets/server.key -in /secrets/server.pem -certfile /secrets/ca.pem -name "jetty" -password pass:$$NEW_PASS;
      fi;

      if [ ! -f /secrets/db-server.crt ]; then
        echo "Generating new self-signed certificate for PostGIS...";
        openssl req -new -x509 -days 3650 -nodes -text -out /secrets/db-server.crt -keyout /secrets/db-server.key -subj "/CN=oscar-postgis";
        chmod 600 /secrets/db-server.key;
        chown 999:999 /secrets/db-server.key /secrets/db-server.crt;
      fi;

      if [ ! -f /mtx-secrets/mediamtx.yml ]; then
        echo "Generating secure MediaMTX configuration in segmented volume...";
        PASS=$$(openssl rand -hex 16);
        USER="oscar-admin";
        echo $$PASS > /mtx-secrets/.mediamtx_api_pass;
        echo $$USER > /mtx-secrets/.mediamtx_api_user;

        echo "# MediaMTX Configuration for OSCAR (Auto-Generated)" > /mtx-secrets/mediamtx.yml;
        echo "api: true" >> /mtx-secrets/mediamtx.yml;
        echo "apiAddress: :9997" >> /mtx-secrets/mediamtx.yml;
        echo "writeQueueSize: 1024" >> /mtx-secrets/mediamtx.yml;
        echo "" >> /mtx-secrets/mediamtx.yml;
        echo "authMethod: internal" >> /mtx-secrets/mediamtx.yml;
        echo "authInternalUsers:" >> /mtx-secrets/mediamtx.yml;
        echo "- user: $$USER" >> /mtx-secrets/mediamtx.yml;
        echo "  pass: $$PASS" >> /mtx-secrets/mediamtx.yml;
        echo "  permissions:" >> /mtx-secrets/mediamtx.yml;
        echo "  - action: api" >> /mtx-secrets/mediamtx.yml;
        echo "  - action: read" >> /mtx-secrets/mediamtx.yml;
        echo "  - action: publish" >> /mtx-secrets/mediamtx.yml;
        echo "" >> /mtx-secrets/mediamtx.yml;
        echo "# Protocols (Optimized for high density)" >> /mtx-secrets/mediamtx.yml;
        echo "rtmp: false" >> /mtx-secrets/mediamtx.yml;
        echo "hls: false" >> /mtx-secrets/mediamtx.yml;
        echo "webrtc: false" >> /mtx-secrets/mediamtx.yml;
        echo "srt: false" >> /mtx-secrets/mediamtx.yml;
        echo "" >> /mtx-secrets/mediamtx.yml;
        echo "pathDefaults:" >> /mtx-secrets/mediamtx.yml;
        echo "  source: publisher" >> /mtx-secrets/mediamtx.yml;
        echo "" >> /mtx-secrets/mediamtx.yml;
        echo "# Path Settings" >> /mtx-secrets/mediamtx.yml;
        echo "paths:" >> /mtx-secrets/mediamtx.yml;
        echo "  all_others:" >> /mtx-secrets/mediamtx.yml;
      fi;
      '

  osh-postgis:
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    image: tyronechrisharris/postgis:${IMAGE_TAG:-latest}
    container_name: oscar-postgis-container
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/secrets/db-server.crt"
      - "-c"
      - "ssl_key_file=/secrets/db-server.key"
    environment:
      - POSTGRES_DB=gis
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/secrets/.db_password
      - POSTGRES_SHARED_BUFFERS=${DB_SHARED_BUFFERS:-128MB}
      - POSTGRES_EFFECTIVE_CACHE_SIZE=${DB_EFFECTIVE_CACHE_SIZE:-512MB}
      - POSTGRES_WORK_MEM=${DB_WORK_MEM:-4MB}
      - POSTGRES_MAX_WAL_SIZE=${DB_MAX_WAL_SIZE:-1GB}
      - POSTGRES_MAX_CONNECTIONS=${DB_MAX_CONNECTIONS:-50}
      - POSTGRES_MAINTENANCE_WORK_MEM=${DB_MAINTENANCE_WORK_MEM:-64MB}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - oscar_secrets:/secrets:ro
    networks:
      - osh-internal
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-1G}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "gis"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  osh-backend:
    image: tyronechrisharris/osh-backend:${IMAGE_TAG:-latest}
    container_name: oscar-backend-container
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=${DB_HOST:-osh-postgis}
      - POSTGRES_PASSWORD_FILE=/secrets/.db_password
      - KEYSTORE=/secrets/osh-keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - TRUSTSTORE=/secrets/truststore.jks
      - TRUSTSTORE_TYPE=JKS
      - SHOW_CMD=true
      - KEYSTORE_PASSWORD_FILE=/secrets/.app_secrets
      - TRUSTSTORE_PASSWORD_FILE=/secrets/.app_secrets
      - MEDIAMTX_API_USER=${MEDIAMTX_API_USER:-}
      - MEDIAMTX_API_PASS=${MEDIAMTX_API_PASS:-}
      - MEDIAMTX_API_USER_FILE=/mtx_secrets/.mediamtx_api_user
      - MEDIAMTX_API_PASS_FILE=/mtx_secrets/.mediamtx_api_pass
      - MEDIAMTX_IP=${MEDIAMTX_IP:-host.docker.internal}
      - JAVA_OPTS=-Xmx${BACKEND_JVM_HEAP:-2G} -Xms${BACKEND_JVM_HEAP:-2G} ${PROXY_OPTS:-} -DsocksNonProxyHosts=localhost|127.*|10.*|172.*|192.168.*|host.docker.internal -Dhttp.nonProxyHosts=localhost|127.*|10.*|172.*|192.168.*|host.docker.internal
    volumes:
      - ./osh-node-oscar/config:/app/config
      - ./osh-node-oscar/db:/app/db
      - ./osh-node-oscar/files:/app/files
      - ./dist/config/standard/logback.xml:/app/hivemq-config/logback.xml:ro
      - oscar_secrets:/secrets:ro
      - mtx_secrets:/mtx_secrets:ro
    networks:
      - osh-internal
    depends_on:
      osh-postgis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-2.5G}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8282:8282"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8282/sensorhub/api"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  mediamtx:
    image: bluenviron/mediamtx:1.17.1
    container_name: oscar-mediamtx
    network_mode: "host"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    volumes:
      - mtx_secrets:/etc/mediamtx:ro
    command: ["/etc/mediamtx/mediamtx.yml"]
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:v1.96.5
    container_name: oscar-tailscale
    hostname: ${NODE_NAME:-oscar-server}
    profiles: ["mesh"]
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_ROUTES=${TS_ROUTES:-}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKS5_SERVER=:1055
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/sock:/var/run/tailscale
    networks:
      - osh-internal
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  osh-proxy-mesh:
    image: caddy:2.9.1
    container_name: oscar-proxy
    profiles: ["mesh"]
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started
      osh-backend:
        condition: service_healthy
    environment:
      - TAILSCALE_DOMAIN=${TAILSCALE_DOMAIN:-invalid.local}
      - TAILSCALE_IP=${TAILSCALE_IP:-127.0.0.1}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./tailscale/sock:/var/run/tailscale:ro
      - oscar_secrets:/etc/caddy/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - /bin/sh
      - -c
      - |
        echo ":80 {" > /etc/caddy/Caddyfile
        echo "    @not_lan {" >> /etc/caddy/Caddyfile
        echo "        not remote_ip private_ranges 127.0.0.1 ::1" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "    abort @not_lan" >> /etc/caddy/Caddyfile
        echo "    reverse_proxy http://osh-backend:8282 {" >> /etc/caddy/Caddyfile
        echo "        flush_interval -1" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "}" >> /etc/caddy/Caddyfile
        echo ":443 {" >> /etc/caddy/Caddyfile
        echo "    @not_lan {" >> /etc/caddy/Caddyfile
        echo "        not remote_ip private_ranges 127.0.0.1 ::1" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "    abort @not_lan" >> /etc/caddy/Caddyfile
        echo "    reverse_proxy http://osh-backend:8282 {" >> /etc/caddy/Caddyfile
        echo "        flush_interval -1" >> /etc/caddy/Caddyfile
        echo "        header_down Location http:// https://" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "    tls /etc/caddy/certs/server.pem /etc/caddy/certs/server.key" >> /etc/caddy/Caddyfile
        echo "}" >> /etc/caddy/Caddyfile
        echo "$$TAILSCALE_DOMAIN {" >> /etc/caddy/Caddyfile
        echo "    reverse_proxy http://osh-backend:8282 {" >> /etc/caddy/Caddyfile
        echo "        flush_interval -1" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "    tls {" >> /etc/caddy/Caddyfile
        echo "        get_certificate tailscale" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "}" >> /etc/caddy/Caddyfile
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

  osh-proxy-lan:
    image: caddy:2.9.1
    container_name: oscar-proxy-lan
    profiles: ["lan-only"]
    networks:
      - osh-internal
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      osh-backend:
        condition: service_healthy
    environment:
      - TAILSCALE_DOMAIN=${TAILSCALE_DOMAIN:-invalid.local}
      - TAILSCALE_IP=${TAILSCALE_IP:-127.0.0.1}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - oscar_secrets:/etc/caddy/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - /bin/sh
      - -c
      - |
        echo ":80 {" > /etc/caddy/Caddyfile
        echo "    @not_lan {" >> /etc/caddy/Caddyfile
        echo "        not remote_ip private_ranges 127.0.0.1 ::1" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "    abort @not_lan" >> /etc/caddy/Caddyfile
        echo "    reverse_proxy http://osh-backend:8282 {" >> /etc/caddy/Caddyfile
        echo "        flush_interval -1" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "}" >> /etc/caddy/Caddyfile
        echo ":443 {" >> /etc/caddy/Caddyfile
        echo "    @not_lan {" >> /etc/caddy/Caddyfile
        echo "        not remote_ip private_ranges 127.0.0.1 ::1" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "    abort @not_lan" >> /etc/caddy/Caddyfile
        echo "    reverse_proxy http://osh-backend:8282 {" >> /etc/caddy/Caddyfile
        echo "        flush_interval -1" >> /etc/caddy/Caddyfile
        echo "        header_down Location http:// https://" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "    tls /etc/caddy/certs/server.pem /etc/caddy/certs/server.key" >> /etc/caddy/Caddyfile
        echo "}" >> /etc/caddy/Caddyfile
        echo "$$TAILSCALE_DOMAIN {" >> /etc/caddy/Caddyfile
        echo "    reverse_proxy http://osh-backend:8282 {" >> /etc/caddy/Caddyfile
        echo "        flush_interval -1" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "    tls {" >> /etc/caddy/Caddyfile
        echo "        get_certificate tailscale" >> /etc/caddy/Caddyfile
        echo "    }" >> /etc/caddy/Caddyfile
        echo "}" >> /etc/caddy/Caddyfile
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

networks:
  osh-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  oscar_secrets:
  mtx_secrets:
