<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <style>
    .box { fill: #f9f9f9; stroke: #333; stroke-width: 2; }
    .sensor { fill: #e1f5fe; stroke: #01579b; }
    .core { fill: #fff3e0; stroke: #e65100; }
    .db { fill: #e8f5e9; stroke: #1b5e20; }
    .ui { fill: #f3e5f5; stroke: #4a148c; }
    .proxy { fill: #e0f2f1; stroke: #00796b; }
    .ext { fill: #fafafa; stroke: #616161; stroke-dasharray: 5,5; }
    text { font-family: Arial, sans-serif; font-size: 14px; }
    .title { font-weight: bold; font-size: 16px; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>

  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- External Sensors -->
  <rect x="30" y="50" width="180" height="80" rx="10" class="sensor" />
  <text x="40" y="75" class="title">Radiation Portal Monitors</text>
  <text x="40" y="95">(RPMs: G/N Alarms)</text>
  <text x="40" y="115">Protocol: TCP/UDP/CSV</text>

  <rect x="30" y="150" width="180" height="80" rx="10" class="sensor" />
  <text x="40" y="175" class="title">IP Cameras</text>
  <text x="40" y="195">(Video/MJPEG/RTSP)</text>
  <text x="40" y="215">Protocol: HTTP/RTSP</text>

  <!-- OSH Backend -->
  <rect x="250" y="50" width="220" height="400" rx="10" class="core" />
  <text x="260" y="75" class="title">OSH Backend (Java)</text>

  <rect x="270" y="100" width="180" height="60" rx="5" fill="#fff" stroke="#e65100" />
  <text x="280" y="125">Sensor Drivers</text>
  <text x="280" y="145">(Aspect, Rapiscan, etc.)</text>

  <rect x="270" y="180" width="180" height="60" rx="5" fill="#fff" stroke="#e65100" />
  <text x="280" y="205">Processing Modules</text>
  <text x="280" y="225">(FFmpeg, Lane Logic)</text>

  <rect x="270" y="260" width="180" height="100" rx="5" fill="#fff" stroke="#e65100" />
  <text x="280" y="285" style="font-weight:bold">OGC Services Layer</text>
  <text x="280" y="305">- SOS (Observations)</text>
  <text x="280" y="325">- SPS (Control)</text>
  <text x="280" y="345">- WebSockets (Live)</text>

  <rect x="270" y="380" width="180" height="50" rx="5" fill="#fff" stroke="#e65100" />
  <text x="280" y="410">Auth (Bifurcated)</text>

  <!-- PostGIS Database -->
  <rect x="30" y="350" width="180" height="100" rx="10" class="db" />
  <text x="40" y="375" class="title">PostGIS Database</text>
  <text x="40" y="395">Persistent Storage</text>
  <text x="40" y="415">G/N Alarms, Events</text>
  <text x="40" y="435">TLS + SCRAM-SHA-256</text>

  <!-- Reverse Proxy -->
  <rect x="520" y="150" width="200" height="200" rx="10" class="proxy" />
  <text x="530" y="175" class="title">Reverse Proxy (Caddy)</text>
  <text x="530" y="200">TLS Termination</text>
  <text x="530" y="220">- Federated (Tailscale)</text>
  <text x="530" y="240">- Offline (Local Certs)</text>
  <text x="530" y="270">Headers: X-Forwarded-For</text>
  <text x="530" y="290">Headers: X-Forwarded-Proto</text>

  <!-- Client Interfaces -->
  <rect x="780" y="50" width="180" height="80" rx="10" class="ui" />
  <text x="790" y="75" class="title">Admin UI (Vaadin)</text>
  <text x="790" y="95">Config, User Mgmt</text>
  <text x="790" y="115">Auth: TOTP/Session</text>

  <rect x="780" y="150" width="180" height="80" rx="10" class="ui" />
  <text x="790" y="175" class="title">OSCAR Viewer (React)</text>
  <text x="790" y="195">Live Maps, Alarms</text>
  <text x="790" y="215">Auth: TOTP/Session</text>

  <rect x="780" y="250" width="180" height="80" rx="10" class="ui" />
  <text x="790" y="275" class="title">MQTT Proxy</text>
  <text x="790" y="295">HiveMQ Extension</text>
  <text x="790" y="315">Auth: API Key</text>

  <!-- Federated Nodes -->
  <rect x="780" y="370" width="180" height="80" rx="10" class="ext" />
  <text x="790" y="395" class="title">Federated Nodes</text>
  <text x="790" y="415">Remote Polling</text>
  <text x="790" y="435">Auth: API Key / Tailscale</text>

  <!-- Arrows -->
  <!-- Sensors to Drivers -->
  <path d="M 210 90 L 250 90" class="arrow" />
  <path d="M 210 190 L 270 150" class="arrow" />

  <!-- Drivers to Processing -->
  <path d="M 360 160 L 360 180" class="arrow" />

  <!-- Processing to OGC -->
  <path d="M 360 240 L 360 260" class="arrow" />

  <!-- OGC to DB -->
  <path d="M 250 310 L 230 310 L 210 350" class="arrow" />

  <!-- DB to OGC (History queries) -->
  <path d="M 120 350 L 120 330 L 270 330" class="arrow" />

  <!-- Backend to Proxy -->
  <path d="M 470 280 L 520 250" class="arrow" />

  <!-- Proxy to Clients -->
  <path d="M 720 200 L 780 90" class="arrow" />
  <path d="M 720 250 L 780 190" class="arrow" />
  <path d="M 720 300 L 780 290" class="arrow" />
  <path d="M 720 350 L 780 410" class="arrow" />

</svg>
