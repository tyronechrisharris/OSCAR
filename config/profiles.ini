[Edge_AllInOne]
# Lightweight profile for remote nodes (DB + App + Proxy)
DB_MAX_CONNECTIONS=50
DB_SHARED_BUFFERS=128MB
DB_EFFECTIVE_CACHE_SIZE=1GB
DB_MAINTENANCE_WORK_MEM=64MB
DB_WAL_BUFFERS=4MB
DB_WORK_MEM=4MB
DB_MAX_WAL_SIZE=1GB
DB_MEM_LIMIT=1G
BACKEND_MEM_LIMIT=2G

[Hub_SingleServer]
# 16GB Shared Hardware (DB + App + Proxy)
DB_MAX_CONNECTIONS=100
DB_SHARED_BUFFERS=4GB
DB_EFFECTIVE_CACHE_SIZE=8GB
DB_MAINTENANCE_WORK_MEM=512MB
DB_WAL_BUFFERS=16MB
DB_WORK_MEM=16MB
DB_MAX_WAL_SIZE=4GB
DB_MEM_LIMIT=6G
BACKEND_MEM_LIMIT=8G

[Hub_Distributed_App]
# 16GB Dedicated App Server (App + Proxy ONLY. DB_HOST points to remote DB)
# Database variables omitted as container is not run here
BACKEND_MEM_LIMIT=14G

[Hub_Distributed_DB]
# 16GB Dedicated DB Server (PostGIS ONLY)
DB_MAX_CONNECTIONS=200
DB_SHARED_BUFFERS=4GB
DB_EFFECTIVE_CACHE_SIZE=12GB
DB_MAINTENANCE_WORK_MEM=1GB
DB_WAL_BUFFERS=16MB
DB_WORK_MEM=32MB
DB_MAX_WAL_SIZE=8GB
DB_MEM_LIMIT=14G