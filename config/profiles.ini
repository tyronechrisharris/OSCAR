[EdgeNode]
# Default lightweight profile
DB_MAX_CONNECTIONS=50
DB_SHARED_BUFFERS=128MB
DB_EFFECTIVE_CACHE_SIZE=1GB
DB_MAINTENANCE_WORK_MEM=64MB
DB_WAL_BUFFERS=4MB
DB_WORK_MEM=4MB
DB_MAX_WAL_SIZE=1GB
DB_CHECKPOINT_TIMEOUT=5min
DB_MEM_LIMIT=1G
BACKEND_MEM_LIMIT=2G

[CentralHub]
# 16GB Shared Hardware (DB + Java Backend)
DB_MAX_CONNECTIONS=100
DB_SHARED_BUFFERS=4GB
DB_EFFECTIVE_CACHE_SIZE=8GB
DB_MAINTENANCE_WORK_MEM=512MB
DB_WAL_BUFFERS=16MB
DB_WORK_MEM=16MB
DB_MAX_WAL_SIZE=4GB
DB_CHECKPOINT_TIMEOUT=15min
DB_MEM_LIMIT=6G
BACKEND_MEM_LIMIT=8G

[DedicatedDB]
# 16GB Dedicated Hardware (Database Only)
DB_MAX_CONNECTIONS=200
DB_SHARED_BUFFERS=4GB
DB_EFFECTIVE_CACHE_SIZE=12GB
DB_MAINTENANCE_WORK_MEM=1GB
DB_WAL_BUFFERS=16MB
DB_WORK_MEM=32MB
DB_MAX_WAL_SIZE=8GB
DB_CHECKPOINT_TIMEOUT=30min
DB_MEM_LIMIT=14G
BACKEND_MEM_LIMIT=0G
# (Backend runs on a separate machine)