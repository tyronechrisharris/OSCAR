description = 'RS-350 Occupancy Data Process'
ext.details = 'RS-350 Occupancy data processing and daily file heartbeat'
version = '1.0.0'

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    implementation project(':sensorhub-utils-rad')
    implementation project(':sensorhub-driver-videocam')
}

// add info to OSGi manifest
osgi {
    manifest {
        attributes('Bundle-Vendor': 'Botts Innovative Research, Inc.')
        attributes('Bundle-Activator': 'com.botts.impl.process.occupancy.rs350.Activator')
    }
}
