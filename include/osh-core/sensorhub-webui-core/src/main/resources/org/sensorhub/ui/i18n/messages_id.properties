Authentication\ Method=Metode Otentikasi
Method\ used\ to\ authenticate\ users\ on\ this\ server=Metode yang digunakan untuk mengautentikasi pengguna di server ini
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.keyStore\"\ system\ property.\=Jalur ke penyimpanan kunci yang berisi sertifikat dan pasangan kunci yang akan disajikan server ini kepada klien ketika diakses melalui HTTPS. Jika nilai ini kosong, secara default akan menggunakan nilai properti sistem \"javax.net.ssl.keyStore\".
Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=Alias \u200b\u200buntuk pasangan kunci publik/pribadi dalam penyimpanan kunci yang akan digunakan untuk mengidentifikasi server ini.
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStore\"\ system\ property.\=Jalur ke penyimpanan kepercayaan TLS yang digunakan saat autentikasi klien diperlukan. Diabaikan jika otentikasi sertifikat klien tidak digunakan. Sertifikat dalam file ini menunjuk otoritas penandatanganan sertifikat klien yang akan dipercaya. Jika nilai ini kosong, secara default akan menggunakan nilai properti sistem \"javax.net.ssl.trustStore\".
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStorePassword\"\ system\ property.\=Kata sandi untuk toko kepercayaan. Diabaikan jika otentikasi sertifikat klien tidak digunakan. Jika nilai ini kosong, secara default akan menggunakan nilai properti sistem \"javax.net.ssl.trustStorePassword\".
