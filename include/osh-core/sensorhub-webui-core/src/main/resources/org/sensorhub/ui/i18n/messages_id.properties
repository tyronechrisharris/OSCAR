Filtered\ view\ to\ select\ systems\ exposed\ as\ read-only\ through\ this\ service=Tampilan yang difilter untuk memilih sistem yang diekspos sebagai hanya-baca melalui layanan ini
Filtered\ view\ to\ select\ systems/datastreams\ to\ register\ with\ Connected\ Systems=Tampilan yang difilter untuk memilih sistem/aliran data yang akan didaftarkan ke Sistem Terhubung
Filtered\ view\ to\ select\ systems/datastreams\ to\ register\ with\ remote\ SOS=Tampilan yang difilter untuk memilih sistem/aliran data yang akan didaftarkan dengan SOS jarak jauh
Fixed\ system\ location\ in\ EPSG\ 4979\ (WGS84)\ coordinate\ system=Memperbaiki lokasi sistem dalam sistem koordinat EPSG 4979 (WGS84).
For\ each\ connection\ or\ reconnection\ attempt,\ the\ client\ will\ wait\ for\ the\ remote\ side\ to\ respond\ until\ this\ timeout\ expires\ (in\ ms)=Untuk setiap upaya koneksi atau koneksi ulang, klien akan menunggu sisi jarak jauh merespons hingga batas waktu ini berakhir (dalam ms)
Heading\ (or\ yaw)\ angle\ about\ Z\ axis\ in\ degrees=Sudut arah (atau yaw) terhadap sumbu Z dalam derajat
How\ long\ the\ client\ will\ wait\ after\ connection\ is\ lost\ before\ it\ will\ attempt\ to\ reconnect\ (in\ ms)=Berapa lama klien akan menunggu setelah koneksi terputus sebelum mencoba menyambung kembali (dalam ms)
ID\ Generator=Pembuat ID
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.=ID modul database yang digunakan untuk menyimpan data yang diterima oleh layanan ini. Jika tidak ada yang disediakan, sistem baru yang didaftarkan melalui layanan ini akan tersedia di hub, namun tanpa jaminan persistensi saat restart.
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID modul database yang digunakan untuk menyimpan data yang diterima oleh layanan ini. Jika tidak ada yang disediakan, sistem baru yang didaftarkan melalui layanan ini akan tersedia di hub, namun tanpa jaminan persistensi saat restart. Hanya observasi terbaru dari setiap aliran data yang akan tersedia dan observasi lama akan dibuang
Individual\ configuration\ of\ sensors\ in\ the\ array\ (will\ override\ common\ configuration)=Konfigurasi individual sensor dalam array (akan mengesampingkan konfigurasi umum)
List\ of\ observed\ properties\ URI\ to\ make\ available\ as\ outputs=Daftar properti yang diamati URI untuk dijadikan output
Mapping\ of\ custom\ formats\ mime-types\ to\ custom\ serializer\ classes=Pemetaan tipe mime format khusus ke kelas serializer khusus
Mappings\ used\ by\ CURIE\ to\ URI\ resolver=Pemetaan yang digunakan oleh CURIE ke penyelesai URI
Max\ Limit=Batas Maks
Max\ Observations\ Returned=Pengamatan Maks Dikembalikan
Max\ Records\ Returned=Catatan Maks Dikembalikan
Max\ delay\ between\ auto-commit\ execution,\ in\ seconds.\ 0\ to\ disable\ time-based\ auto-commit=Penundaan maksimum antara eksekusi penerapan otomatis, dalam hitungan detik. 0 untuk menonaktifkan komitmen otomatis berbasis waktu
Maximum\ age\ of\ data\ to\ be\ kept\ in\ storage\ (in\ seconds)=Usia maksimum data untuk disimpan dalam penyimpanan (dalam detik)
Maximum\ number\ of\ FoI\ IDs\ listed\ in\ capabilities=Jumlah maksimum ID FoI yang tercantum dalam kemampuan
Maximum\ number\ of\ observations\ returned\ \ by\ a\ historical\ GetObservation\ request\ (for\ each\ selected\ offering)=Jumlah maksimum pengamatan yang dihasilkan oleh permintaan GetObservation historis (untuk setiap penawaran yang dipilih)
Maximum\ number\ of\ records\ in\ upload\ queue\ (used\ to\ compensate\ for\ variable\ bandwidth)=Jumlah maksimum rekaman dalam antrean unggahan (digunakan untuk mengkompensasi bandwidth variabel)
Maximum\ number\ of\ resources\ returned\ in\ a\ single\ page=Jumlah maksimum sumber daya yang dikembalikan dalam satu halaman
Maximum\ number\ of\ result\ records\ returned\ by\ a\ historical\ GetResult\ request=Jumlah maksimum rekaman hasil yang dikembalikan oleh permintaan GetResult historis
Maximum\ number\ of\ stream\ errors\ before\ we\ try\ to\ reconnect\ to\ remote\ server=Jumlah kesalahan streaming maksimum sebelum kami mencoba menyambung kembali ke server jarak jauh
Memory\ cache\ size\ for\ page\ chunks,\ in\ KB=Ukuran cache memori untuk potongan halaman, dalam KB
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ procedures/sensors\ registered\ through\ this\ service.\ Only\ sensors\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadata grup sistem yang akan dibuat berisi semua prosedur/sensor yang didaftarkan melalui layanan ini. Hanya sensor dalam grup ini yang dapat dimodifikasi oleh layanan ini
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ systems\ registered\ through\ this\ service.\ Only\ systems\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadata grup sistem yang akan dibuat berisi semua sistem yang didaftarkan melalui layanan ini. Hanya sistem dalam grup ini yang dapat dimodifikasi oleh layanan ini
Method\ used\ to\ generate\ new\ resource\ IDs=Metode yang digunakan untuk menghasilkan ID sumber daya baru
Minimum\ fillrate\ above\ which\ auto\ compact\ operations\ may\ be\ triggered=Laju pengisian minimum di atas mana operasi pemadatan otomatis dapat dipicu
Minimum\ period\ between\ database\ commits\ (in\ ms)=Periode minimum antara penerapan basis data (dalam ms)
Names\ of\ datastreams\ whose\ data\ will\ be\ hidden\ from\ the\ SOS.\ If\ this\ is\ null,\ all\ streams\ produced\ by\ the\ procedure\ are\ exposed=Nama aliran data yang datanya akan disembunyikan dari SOS. Jika ini nol, semua aliran yang dihasilkan oleh prosedur akan diekspos
Observed\ Properties=Properti yang Diamati
Offering\ URI\ as\ exposed\ in\ capabilities.\ (if\ null,\ the\ procedure\ UID\ is\ used)=Menawarkan URI seperti yang diungkapkan dalam kemampuan. (jika null, prosedur UID digunakan)
Offering\ description\ (if\ null,\ it\ will\ be\ auto-generated)=Deskripsi penawaran (jika null, maka akan dibuat secara otomatis)
Offering\ name\ (if\ null,\ the\ procedure\ name\ is\ used)=Nama penawaran (jika null, nama prosedur yang digunakan)
Orientation\ as\ Euler\ angles\ in\ NED\ coordinate\ reference\ frame.\nOrder\ of\ rotations\ is\ z-y\u2019-x"\ (in\ rotating\ frame)\ or\ x-y-z\ (in\ fixed\ frame)=Orientasi sebagai sudut Euler dalam kerangka acuan koordinat NED.\nUrutan rotasinya adalah z-y\u2019-x" (dalam bingkai berputar) atau x-y-z (dalam bingkai tetap)
Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Kata sandi untuk penyimpanan kunci (dan untuk pasangan kunci di dalam penyimpanan kunci). Jika nilai ini kosong, secara default akan menggunakan nilai properti sistem "javax.net.ssl.keyStorePassword". Nilai ini dapat menggunakan ekspresi ekspansi variabel dalam bentuk "$${name}" (untuk variabel lingkungan dan properti sistem) atau "$${file;/path/to/file}" (untuk konten file rahasia).
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Kata sandi untuk toko kepercayaan. Diabaikan jika otentikasi sertifikat klien tidak digunakan. Jika nilai ini kosong, secara default akan menggunakan nilai properti sistem "javax.net.ssl.trustStorePassword". Nilai ini dapat menggunakan ekspresi ekspansi variabel dalam bentuk "$${name}" (untuk variabel lingkungan dan properti sistem) atau "$${file;/path/to/file}" (untuk konten file rahasia).
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=Jalur titik akhir layanan relatif terhadap URL konteks (misalnya http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Jalur ke penyimpanan kunci yang berisi sertifikat dan pasangan kunci yang akan disajikan server ini kepada klien ketika diakses melalui HTTPS. Jika nilai ini kosong, secara default akan menggunakan nilai properti sistem "javax.net.ssl.keyStore". Nilai ini dapat menggunakan ekspresi ekspansi variabel dalam bentuk "$${name}" (untuk variabel lingkungan dan properti sistem) atau "$${file;/path/to/file}" (untuk konten file rahasia).
Path\ to\ database\ file=Jalur ke file database
Path\ to\ external\ config\ file\ (in\ Jetty\ IOC\ XML\ format)=Jalur ke file konfigurasi eksternal (dalam format Jetty IOC XML)
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Jalur ke penyimpanan kepercayaan TLS yang digunakan saat autentikasi klien diperlukan. Diabaikan jika otentikasi sertifikat klien tidak digunakan. Sertifikat dalam file ini menunjuk otoritas penandatanganan sertifikat klien yang akan dipercaya. Jika nilai ini kosong, secara default akan menggunakan nilai properti sistem "javax.net.ssl.trustStore". Nilai ini dapat menggunakan ekspresi ekspansi variabel dalam bentuk "$${name}" (untuk variabel lingkungan dan properti sistem) atau "$${file;/path/to/file}" (untuk konten file rahasia).
Port\ number\ to\ connect\ to\ on\ remote\ host\ (0\ to\ automatically\ select\ a\ port)=Nomor port untuk dihubungkan pada host jarak jauh (0 untuk memilih port secara otomatis)
SOS\ Endpoint=Titik Akhir SOS
SOS\ endpoint\ to\ fetch\ data\ from=Titik akhir SOS untuk mengambil data
SOS\ endpoint\ where\ the\ requests\ are\ sent=Titik akhir SOS tempat permintaan dikirim
SPS\ Endpoint=Titik Akhir SPS
SPS\ endpoint\ to\ send\ commands\ to=Titik akhir SPS untuk mengirim perintah
Security\ related\ options=Opsi terkait keamanan
Sensor\ UID=UID Sensor
Set\ if\ WebSocket\ protocol\ should\ be\ used\ to\ get\ streaming\ data\ from\ SOS=Tetapkan apakah protokol WebSocket harus digunakan untuk mendapatkan data streaming dari SOS
Set\ if\ offering\ is\ enabled,\ unset\ if\ disabled=Setel jika penawaran diaktifkan, tidak disetel jika dinonaktifkan
Set\ if\ websockets\ protocol\ should\ be\ used\ to\ send\ commands\ to\ SPS=Tetapkan apakah protokol websockets harus digunakan untuk mengirim perintah ke SPS
Set\ to\ compact\ the\ database\ file\ when\ the\ database\ module\ is\ stopped\ or\ restarted=Atur untuk memadatkan file database ketika modul database dihentikan atau dimulai ulang
Set\ to\ compress\ underlying\ file\ storage=Atur untuk mengompresi penyimpanan file yang mendasarinya
Set\ to\ display\ MVStore\ debug\ info\ when\ database\ is\ closed\ (only\ if\ DEBUG\ log\ is\ also\ enabled)=Atur untuk menampilkan info debug MVStore ketika database ditutup (hanya jika log DEBUG juga diaktifkan)
Set\ to\ enable\ spatial\ indexing\ of\ individual\ observations\ sampling\ locations\ (when\ provided)=Ditetapkan untuk mengaktifkan pengindeksan spasial lokasi pengambilan sampel pengamatan individu (bila disediakan)
Set\ to\ open\ the\ database\ as\ read-only=Atur untuk membuka database sebagai hanya-baca
Set\ to\ true\ to\ enable\ transactional\ operation\ support=Setel ke true untuk mengaktifkan dukungan operasi transaksional
Size\ of\ the\ auto-commit\ write\ buffer,\ in\ KB=Ukuran buffer tulis komit otomatis, dalam KB
TCP\ port\ where\ server\ will\ listen\ for\ secure\ HTTP\ (HTTPS)\ connections\ (use\ 0\ to\ disable\ HTTPS).=Port TCP tempat server akan mendengarkan koneksi HTTP (HTTPS) yang aman (gunakan 0 untuk menonaktifkan HTTPS).
TCP\ port\ where\ server\ will\ listen\ for\ unsecure\ HTTP\ connections\ (use\ 0\ to\ disable\ HTTP).=Port TCP tempat server akan mendengarkan koneksi HTTP yang tidak aman (gunakan 0 untuk menonaktifkan HTTP).
Time-out\ after\ which\ real-time\ requests\ are\ disabled\ if\ no\ more\ measurements\ are\ received\ (in\ seconds).\ Real-time\ is\ reactivated\ as\ soon\ as\ new\ records\ start\ being\ received\ again=Batas waktu habis setelah permintaan waktu nyata dinonaktifkan jika tidak ada lagi pengukuran yang diterima (dalam hitungan detik). Real-time diaktifkan kembali segera setelah catatan baru mulai diterima kembali
Time-out\ period\ after\ which\ a\ template\ ID\ reserved\ using\ InsertResultTemplate\ will\ expire\ if\ not\ used\ in\ InsertResult\ requests\ (in\ seconds)=Periode batas waktu setelah ID templat yang dicadangkan menggunakan InsertResultTemplate akan kedaluwarsa jika tidak digunakan dalam permintaan InsertResult (dalam hitungan detik)
Timeout\ after\ which\ data\ is\ released\ to\ the\ caller\ if\ at\ least\ one\ byte\ was\ received\ (in\ ms)=Batas waktu setelah data dilepaskan ke pemanggil jika setidaknya satu byte diterima (dalam ms)
URI\ Prefix\ Map=Peta Awalan URI
Unique\ ID\ (full\ URN\ or\ only\ suffix)\ to\ use\ for\ the\ sensor\ system\ or\ 'auto'\ to\ use\ the\ UUID\ randomly\ generated\ the\ first\ time\ the\ module\ is\ initialized=ID unik (URN lengkap atau akhiran saja) untuk digunakan pada sistem sensor atau ''otomatis'' untuk menggunakan UUID yang dihasilkan secara acak saat pertama kali modul diinisialisasi
Unique\ ID\ of\ a\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=ID unik dari sistem yang menerapkan konfigurasi ini.\nDapat menyertakan karakter pengganti ''*'' untuk mencocokkan beberapa sistem sekaligus.
Unique\ ID\ of\ sensor\ to\ connect\ to\ on\ SOS\ and\ SPS\ servers=ID unik sensor untuk dihubungkan pada server SOS dan SPS
Unique\ ID\ of\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=ID unik sistem tempat konfigurasi ini diterapkan.\nDapat menyertakan karakter pengganti ''*'' untuk mencocokkan beberapa sistem sekaligus.
Use\ WebSockets\ for\ SOS=Gunakan WebSockets untuk SOS
Use\ WebSockets\ for\ SPS=Gunakan WebSockets untuk SPS

