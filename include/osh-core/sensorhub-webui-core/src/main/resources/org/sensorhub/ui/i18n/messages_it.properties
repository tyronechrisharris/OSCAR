Filtered\ view\ to\ select\ systems/datastreams\ to\ register\ with\ remote\ SOS=Visualizzazione filtrata per selezionare sistemi/flussi di dati da registrare con SOS remoto
Fixed\ system\ location\ in\ EPSG\ 4979\ (WGS84)\ coordinate\ system=Posizione fissa del sistema nel sistema di coordinate EPSG 4979 (WGS84).
For\ each\ connection\ or\ reconnection\ attempt,\ the\ client\ will\ wait\ for\ the\ remote\ side\ to\ respond\ until\ this\ timeout\ expires\ (in\ ms)=Per ogni tentativo di connessione o riconnessione, il client attender\u00e0 la risposta del lato remoto fino alla scadenza di questo timeout (in ms)
Heading\ (or\ yaw)\ angle\ about\ Z\ axis\ in\ degrees=Angolo di rotta (o imbardata) attorno all''asse Z in gradi
How\ long\ the\ client\ will\ wait\ after\ connection\ is\ lost\ before\ it\ will\ attempt\ to\ reconnect\ (in\ ms)=Quanto tempo il client attender\u00e0 dopo la perdita della connessione prima di tentare di riconnettersi (in ms)
ID\ Generator=Generatore di identit\u00e0
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.=ID del modulo database utilizzato per rendere persistenti i dati ricevuti da questo servizio. Se non ne viene fornito alcuno, i nuovi sistemi registrati tramite questo servizio saranno disponibili sull''hub, ma senza garanzia di persistenza tra i riavvii.
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID del modulo database utilizzato per rendere persistenti i dati ricevuti da questo servizio. Se non ne viene fornito alcuno, i nuovi sistemi registrati tramite questo servizio saranno disponibili sull''hub, ma senza garanzia di persistenza tra i riavvii. Sar\u00e0 disponibile solo l''ultima osservazione di ciascun flusso di dati e le osservazioni pi\u00f9 vecchie verranno scartate
Individual\ configuration\ of\ sensors\ in\ the\ array\ (will\ override\ common\ configuration)=Configurazione individuale dei sensori nell''array (annuller\u00e0 la configurazione comune)
List\ of\ observed\ properties\ URI\ to\ make\ available\ as\ outputs=Elenco delle propriet\u00e0 osservate URI da rendere disponibili come output
Mapping\ of\ custom\ formats\ mime-types\ to\ custom\ serializer\ classes=Mappatura di formati personalizzati, tipi MIME e classi di serializzatori personalizzati
Mappings\ used\ by\ CURIE\ to\ URI\ resolver=Mappature utilizzate da CURIE al risolutore URI
Max\ Limit=Limite massimo
Max\ Observations\ Returned=Numero massimo di osservazioni restituite
Max\ Records\ Returned=Restituiti i record massimi
Max\ delay\ between\ auto-commit\ execution,\ in\ seconds.\ 0\ to\ disable\ time-based\ auto-commit=Ritardo massimo tra l''esecuzione del commit automatico, in secondi. 0 per disabilitare il commit automatico basato sul tempo
Maximum\ age\ of\ data\ to\ be\ kept\ in\ storage\ (in\ seconds)=Et\u00e0 massima dei dati da conservare in archivio (in secondi)
Maximum\ number\ of\ FoI\ IDs\ listed\ in\ capabilities=Numero massimo di ID FoI elencati nelle funzionalit\u00e0
Maximum\ number\ of\ observations\ returned\ \ by\ a\ historical\ GetObservation\ request\ (for\ each\ selected\ offering)=Numero massimo di osservazioni restituite da una richiesta GetObservation storica (per ciascuna offerta selezionata)
Maximum\ number\ of\ records\ in\ upload\ queue\ (used\ to\ compensate\ for\ variable\ bandwidth)=Numero massimo di record nella coda di caricamento (utilizzato per compensare la larghezza di banda variabile)
Maximum\ number\ of\ resources\ returned\ in\ a\ single\ page=Numero massimo di risorse restituite in una singola pagina
Maximum\ number\ of\ result\ records\ returned\ by\ a\ historical\ GetResult\ request=Numero massimo di record di risultati restituiti da una richiesta GetResult cronologica
Maximum\ number\ of\ stream\ errors\ before\ we\ try\ to\ reconnect\ to\ remote\ server=Numero massimo di errori di flusso prima del tentativo di riconnettersi al server remoto
Memory\ cache\ size\ for\ page\ chunks,\ in\ KB=Dimensioni della cache di memoria per blocchi di pagina, in KB
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ procedures/sensors\ registered\ through\ this\ service.\ Only\ sensors\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadati del gruppo di sistemi che verranno creati per contenere tutte le procedure/sensori registrati tramite questo servizio. Solo i sensori di questo gruppo saranno modificabili da questo servizio
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ systems\ registered\ through\ this\ service.\ Only\ systems\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadati del gruppo di sistemi che verranno creati per contenere tutti i sistemi registrati tramite questo servizio. Solo i sistemi di questo gruppo saranno modificabili da questo servizio
Method\ used\ to\ generate\ new\ resource\ IDs=Metodo utilizzato per generare nuovi ID risorsa
Minimum\ fillrate\ above\ which\ auto\ compact\ operations\ may\ be\ triggered=Tasso di riempimento minimo al di sopra del quale possono essere attivate le operazioni di compattazione automatica
Minimum\ period\ between\ database\ commits\ (in\ ms)=Periodo minimo tra i commit del database (in ms)
Names\ of\ datastreams\ whose\ data\ will\ be\ hidden\ from\ the\ SOS.\ If\ this\ is\ null,\ all\ streams\ produced\ by\ the\ procedure\ are\ exposed=Nomi dei flussi di dati i cui dati verranno nascosti dall''SOS. Se \u00e8 nullo, vengono esposti tutti i flussi prodotti dalla procedura
Observed\ Properties=Propriet\u00e0 osservate
Offering\ URI\ as\ exposed\ in\ capabilities.\ (if\ null,\ the\ procedure\ UID\ is\ used)=Offerta dell''URI come esposto nelle funzionalit\u00e0. (se nullo viene utilizzato l''UID della procedura)
Offering\ description\ (if\ null,\ it\ will\ be\ auto-generated)=Descrizione dell''offerta (se nulla, verr\u00e0 generata automaticamente)
Offering\ name\ (if\ null,\ the\ procedure\ name\ is\ used)=Nome dell''offerta (se nullo, viene utilizzato il nome della procedura)
Orientation\ as\ Euler\ angles\ in\ NED\ coordinate\ reference\ frame.\nOrder\ of\ rotations\ is\ z-y\u2019-x"\ (in\ rotating\ frame)\ or\ x-y-z\ (in\ fixed\ frame)=Orientamento come angoli di Eulero nel sistema di riferimento delle coordinate NED.\nL''ordine delle rotazioni \u00e8 z-y''-x" (nel telaio rotante) o x-y-z (nel telaio fisso)
Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Password per l''archivio chiavi (e per la coppia di chiavi all''interno dell''archivio chiavi). Se questo valore \u00e8 vuoto, verr\u00e0 utilizzato per impostazione predefinita il valore della propriet\u00e0 di sistema "javax.net.ssl.keyStorePassword". Questo valore pu\u00f2 utilizzare espressioni di espansione variabile nel formato "$${nome}" (per variabili di ambiente e propriet\u00e0 di sistema) o "$${file;/percorso/al/file}" (per contenuti di file segreti).
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Password per l''archivio attendibile. Ignorato se non viene utilizzata l''autenticazione del certificato client. Se questo valore \u00e8 vuoto, verr\u00e0 utilizzato per impostazione predefinita il valore della propriet\u00e0 di sistema "javax.net.ssl.trustStorePassword". Questo valore pu\u00f2 utilizzare espressioni di espansione variabile nel formato "$${nome}" (per variabili di ambiente e propriet\u00e0 di sistema) o "$${file;/percorso/al/file}" (per contenuti di file segreti).
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=Percorso dell''endpoint del servizio relativo all''URL del contesto (es. http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Percorso di un archivio chiavi contenente il certificato e la coppia di chiavi che questo server presenter\u00e0 ai client quando si accede tramite HTTPS. Se questo valore \u00e8 vuoto, verr\u00e0 utilizzato per impostazione predefinita il valore della propriet\u00e0 di sistema "javax.net.ssl.keyStore". Questo valore pu\u00f2 utilizzare espressioni di espansione variabile nel formato "$${nome}" (per variabili di ambiente e propriet\u00e0 di sistema) o "$${file;/percorso/al/file}" (per contenuti di file segreti).
Path\ to\ database\ file=Percorso del file di database
Path\ to\ external\ config\ file\ (in\ Jetty\ IOC\ XML\ format)=Percorso del file di configurazione esterno (in formato Jetty IOC XML)
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Percorso dell''archivio attendibilit\u00e0 TLS utilizzato quando \u00e8 richiesta l''autenticazione del client. Ignorato se non viene utilizzata l''autenticazione del certificato client. I certificati in questo file designano le autorit\u00e0 di firma per i certificati client che verranno considerati attendibili. Se questo valore \u00e8 vuoto, verr\u00e0 utilizzato per impostazione predefinita il valore della propriet\u00e0 di sistema "javax.net.ssl.trustStore". Questo valore pu\u00f2 utilizzare espressioni di espansione variabile nel formato "$${nome}" (per variabili di ambiente e propriet\u00e0 di sistema) o "$${file;/percorso/al/file}" (per contenuti di file segreti).
Port\ number\ to\ connect\ to\ on\ remote\ host\ (0\ to\ automatically\ select\ a\ port)=Numero di porta a cui connettersi sull''host remoto (0 per selezionare automaticamente una porta)
SOS\ Endpoint=Punto terminale SOS
SOS\ endpoint\ to\ fetch\ data\ from=Endpoint SOS da cui recuperare i dati
SOS\ endpoint\ where\ the\ requests\ are\ sent=Endpoint SOS a cui vengono inviate le richieste
SPS\ Endpoint=Endpoint SPS
SPS\ endpoint\ to\ send\ commands\ to=Endpoint SPS a cui inviare comandi
Security\ related\ options=Opzioni relative alla sicurezza
Sensor\ UID=UID del sensore
Set\ if\ WebSocket\ protocol\ should\ be\ used\ to\ get\ streaming\ data\ from\ SOS=Imposta se il protocollo WebSocket deve essere utilizzato per ottenere dati in streaming da SOS
Set\ if\ offering\ is\ enabled,\ unset\ if\ disabled=Impostato se l''offerta \u00e8 abilitata, deselezionato se disabilitata
Set\ if\ websockets\ protocol\ should\ be\ used\ to\ send\ commands\ to\ SPS=Imposta se il protocollo websocket deve essere utilizzato per inviare comandi a SPS
Set\ to\ compact\ the\ database\ file\ when\ the\ database\ module\ is\ stopped\ or\ restarted=Impostato per compattare il file di database quando il modulo database viene arrestato o riavviato
Set\ to\ compress\ underlying\ file\ storage=Impostato per comprimere l''archivio file sottostante
Set\ to\ display\ MVStore\ debug\ info\ when\ database\ is\ closed\ (only\ if\ DEBUG\ log\ is\ also\ enabled)=Impostato per visualizzare le informazioni di debug di MVStore quando il database viene chiuso (solo se \u00e8 abilitato anche il registro DEBUG)
Set\ to\ enable\ spatial\ indexing\ of\ individual\ observations\ sampling\ locations\ (when\ provided)=Impostato per abilitare l''indicizzazione spaziale delle posizioni di campionamento delle singole osservazioni (se fornita)
Set\ to\ open\ the\ database\ as\ read-only=Imposta per aprire il database in sola lettura
Set\ to\ true\ to\ enable\ transactional\ operation\ support=Impostato su true per abilitare il supporto delle operazioni transazionali
Size\ of\ the\ auto-commit\ write\ buffer,\ in\ KB=Dimensioni del buffer di scrittura con commit automatico, in KB
TCP\ port\ where\ server\ will\ listen\ for\ secure\ HTTP\ (HTTPS)\ connections\ (use\ 0\ to\ disable\ HTTPS).=Porta TCP dove il server ascolter\u00e0 le connessioni HTTP sicure (HTTPS) (utilizzare 0 per disabilitare HTTPS).
TCP\ port\ where\ server\ will\ listen\ for\ unsecure\ HTTP\ connections\ (use\ 0\ to\ disable\ HTTP).=Porta TCP dove il server ascolter\u00e0 le connessioni HTTP non sicure (utilizzare 0 per disabilitare HTTP).
Time-out\ after\ which\ real-time\ requests\ are\ disabled\ if\ no\ more\ measurements\ are\ received\ (in\ seconds).\ Real-time\ is\ reactivated\ as\ soon\ as\ new\ records\ start\ being\ received\ again=Timeout trascorso il quale le richieste in tempo reale vengono disabilitate se non vengono pi\u00f9 ricevute misurazioni (in secondi). Il tempo reale viene riattivato non appena iniziano a essere ricevuti nuovi record
Time-out\ period\ after\ which\ a\ template\ ID\ reserved\ using\ InsertResultTemplate\ will\ expire\ if\ not\ used\ in\ InsertResult\ requests\ (in\ seconds)=Periodo di timeout dopo il quale un ID modello prenotato utilizzando InsertResultTemplate scadr\u00e0 se non utilizzato nelle richieste InsertResult (in secondi)
Timeout\ after\ which\ data\ is\ released\ to\ the\ caller\ if\ at\ least\ one\ byte\ was\ received\ (in\ ms)=Timeout dopo il quale i dati vengono rilasciati al chiamante se \u00e8 stato ricevuto almeno un byte (in ms)
URI\ Prefix\ Map=Mappa dei prefissi URI
Unique\ ID\ (full\ URN\ or\ only\ suffix)\ to\ use\ for\ the\ sensor\ system\ or\ 'auto'\ to\ use\ the\ UUID\ randomly\ generated\ the\ first\ time\ the\ module\ is\ initialized=ID univoco (URN completo o solo suffisso) da utilizzare per il sistema di sensori o "auto" per utilizzare l''UUID generato in modo casuale la prima volta che il modulo viene inizializzato
Unique\ ID\ of\ a\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=ID univoco di un sistema a cui si applica questa configurazione.\nPu\u00f2 includere un carattere jolly finale "*" per abbinare pi\u00f9 sistemi contemporaneamente.
Unique\ ID\ of\ sensor\ to\ connect\ to\ on\ SOS\ and\ SPS\ servers=ID univoco del sensore a cui connettersi sui server SOS e SPS
Unique\ ID\ of\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=ID univoco del sistema a cui si applica questa configurazione.\nPu\u00f2 includere un carattere jolly finale "*" per abbinare pi\u00f9 sistemi contemporaneamente.
Use\ WebSockets\ for\ SOS=Utilizza WebSocket per SOS
Use\ WebSockets\ for\ SPS=Utilizza WebSocket per SPS

