Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.keyStore\"\ system\ property.\=Percorso di un archivio chiavi contenente il certificato e la coppia di chiavi che questo server presenter\u00e0 ai client quando si accede tramite HTTPS. Se questo valore \u00e8 vuoto, verr\u00e0 utilizzato per impostazione predefinita il valore della propriet\u00e0 di sistema \"javax.net.ssl.keyStore\".
Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=Alias \u200b\u200bper la coppia di chiavi pubblica/privata all''interno dell''archivio chiavi che verr\u00e0 utilizzata per identificare questo server.
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStore\"\ system\ property.\=Percorso dell''archivio attendibilit\u00e0 TLS utilizzato quando \u00e8 richiesta l''autenticazione del client. Ignorato se non viene utilizzata l''autenticazione del certificato client. I certificati in questo file designano le autorit\u00e0 di firma per i certificati client che verranno considerati attendibili. Se questo valore \u00e8 vuoto, verr\u00e0 utilizzato per impostazione predefinita il valore della propriet\u00e0 di sistema \"javax.net.ssl.trustStore\".
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStorePassword\"\ system\ property.\=Password per l''archivio attendibile. Ignorato se non viene utilizzata l''autenticazione del certificato client. Se questo valore \u00e8 vuoto, verr\u00e0 utilizzato per impostazione predefinita il valore della propriet\u00e0 di sistema \"javax.net.ssl.trustStorePassword\".
