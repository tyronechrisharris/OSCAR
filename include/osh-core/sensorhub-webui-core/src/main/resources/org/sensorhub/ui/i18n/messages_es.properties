Orientation\ as\ Euler\ angles\ in\ NED\ coordinate\ reference\ frame.\nOrder\ of\ rotations\ is\ z-y\u2019-x"\ (in\ rotating\ frame)\ or\ x-y-z\ (in\ fixed\ frame)=Orientaci\u00f3n como \u00e1ngulos de Euler en el sistema de referencia de coordenadas NED.\nEl orden de las rotaciones es z-y\u2019-x" (en marco giratorio) o x-y-z (en marco fijo)
Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Contrase\u00f1a para el almac\u00e9n de claves (y para el par de claves dentro del almac\u00e9n de claves). Si este valor est\u00e1 en blanco, se utilizar\u00e1 de forma predeterminada el valor de la propiedad del sistema "javax.net.ssl.keyStorePassword". Este valor puede utilizar expresiones de expansi\u00f3n de variables del formato "$${nombre}" (para variables de entorno y propiedades del sistema) o "$${archivo;/ruta/al/archivo}" (para contenidos de archivos secretos).
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Contrase\u00f1a para el almac\u00e9n de confianza. Se ignora si no se utiliza la autenticaci\u00f3n del certificado del cliente. Si este valor est\u00e1 en blanco, se utilizar\u00e1 de forma predeterminada el valor de la propiedad del sistema "javax.net.ssl.trustStorePassword". Este valor puede utilizar expresiones de expansi\u00f3n de variables del formato "$${nombre}" (para variables de entorno y propiedades del sistema) o "$${archivo;/ruta/al/archivo}" (para contenidos de archivos secretos).
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=Ruta del punto final del servicio relativa a la URL de contexto (por ejemplo, http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Ruta a un almac\u00e9n de claves que contiene el certificado y el par de claves que este servidor presentar\u00e1 a los clientes cuando se acceda a trav\u00e9s de HTTPS. Si este valor est\u00e1 en blanco, se utilizar\u00e1 de forma predeterminada el valor de la propiedad del sistema "javax.net.ssl.keyStore". Este valor puede utilizar expresiones de expansi\u00f3n de variables del formato "$${nombre}" (para variables de entorno y propiedades del sistema) o "$${archivo;/ruta/al/archivo}" (para contenidos de archivos secretos).
Path\ to\ database\ file=Ruta al archivo de base de datos
Path\ to\ external\ config\ file\ (in\ Jetty\ IOC\ XML\ format)=Ruta al archivo de configuraci\u00f3n externo (en formato XML Jetty IOC)
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Ruta al almac\u00e9n de confianza TLS que se utiliza cuando se requiere autenticaci\u00f3n del cliente. Se ignora si no se utiliza la autenticaci\u00f3n del certificado del cliente. Los certificados de este archivo designan las autoridades de firma de los certificados de cliente en los que se confiar\u00e1. Si este valor est\u00e1 en blanco, se utilizar\u00e1 de forma predeterminada el valor de la propiedad del sistema "javax.net.ssl.trustStore". Este valor puede utilizar expresiones de expansi\u00f3n de variables del formato "$${nombre}" (para variables de entorno y propiedades del sistema) o "$${archivo;/ruta/al/archivo}" (para contenidos de archivos secretos).
Port\ number\ to\ connect\ to\ on\ remote\ host\ (0\ to\ automatically\ select\ a\ port)=N\u00famero de puerto al que conectarse en el host remoto (0 para seleccionar autom\u00e1ticamente un puerto)
