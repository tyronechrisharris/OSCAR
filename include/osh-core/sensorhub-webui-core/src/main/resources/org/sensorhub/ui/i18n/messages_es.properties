Set\ to\ enable\ spatial\ indexing\ of\ individual\ observations\ sampling\ locations\ (when\ provided)=Configurado para permitir la indexaci\u00f3n espacial de ubicaciones de muestreo de observaciones individuales (cuando se proporcione)
