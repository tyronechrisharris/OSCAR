Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.keyStore\"\ system\ property.\=Ruta a un almac\u00e9n de claves que contiene el certificado y el par de claves que este servidor presentar\u00e1 a los clientes cuando se acceda a trav\u00e9s de HTTPS. Si este valor est\u00e1 en blanco, se utilizar\u00e1 de forma predeterminada el valor de la propiedad del sistema \"javax.net.ssl.keyStore\".
Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=Alias \u200b\u200bdel par de claves p\u00fablica/privada dentro del almac\u00e9n de claves que se utilizar\u00e1 para identificar este servidor.
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStore\"\ system\ property.\=Ruta al almac\u00e9n de confianza TLS que se utiliza cuando se requiere autenticaci\u00f3n del cliente. Se ignora si no se utiliza la autenticaci\u00f3n del certificado del cliente. Los certificados de este archivo designan las autoridades de firma de los certificados de cliente en los que se confiar\u00e1. Si este valor est\u00e1 en blanco, se utilizar\u00e1 de forma predeterminada el valor de la propiedad del sistema \"javax.net.ssl.trustStore\".
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStorePassword\"\ system\ property.\=Contrase\u00f1a para el almac\u00e9n de confianza. Se ignora si no se utiliza la autenticaci\u00f3n del certificado del cliente. Si este valor est\u00e1 en blanco, se utilizar\u00e1 de forma predeterminada el valor de la propiedad del sistema \"javax.net.ssl.trustStorePassword\".
