TCP\ port\ where\ server\ will\ listen\ for\ secure\ HTTP\ (HTTPS)\ connections\ (use\ 0\ to\ disable\ HTTPS).=Puerto TCP donde el servidor escuchar\u00e1 conexiones HTTP seguras (HTTPS) (use 0 para deshabilitar HTTPS).
TCP\ port\ where\ server\ will\ listen\ for\ unsecure\ HTTP\ connections\ (use\ 0\ to\ disable\ HTTP).=Puerto TCP donde el servidor escuchar\u00e1 conexiones HTTP no seguras (use 0 para deshabilitar HTTP).
Time-out\ after\ which\ real-time\ requests\ are\ disabled\ if\ no\ more\ measurements\ are\ received\ (in\ seconds).\ Real-time\ is\ reactivated\ as\ soon\ as\ new\ records\ start\ being\ received\ again=Tiempo de espera tras el cual las solicitudes en tiempo real se desactivan si no se reciben m\u00e1s mediciones (en segundos). El tiempo real se reactiva tan pronto como se comienzan a recibir nuevos registros nuevamente
Time-out\ period\ after\ which\ a\ template\ ID\ reserved\ using\ InsertResultTemplate\ will\ expire\ if\ not\ used\ in\ InsertResult\ requests\ (in\ seconds)=Per\u00edodo de tiempo de espera despu\u00e9s del cual una ID de plantilla reservada mediante InsertResultTemplate caducar\u00e1 si no se utiliza en solicitudes InsertResult (en segundos)
Timeout\ after\ which\ data\ is\ released\ to\ the\ caller\ if\ at\ least\ one\ byte\ was\ received\ (in\ ms)=Tiempo de espera despu\u00e9s del cual los datos se liberan a la persona que llama si se recibi\u00f3 al menos un byte (en ms)
URI\ Prefix\ Map=Mapa de prefijo URI
Unique\ ID\ (full\ URN\ or\ only\ suffix)\ to\ use\ for\ the\ sensor\ system\ or\ 'auto'\ to\ use\ the\ UUID\ randomly\ generated\ the\ first\ time\ the\ module\ is\ initialized=ID \u00fanico (URN completo o solo sufijo) para usar en el sistema de sensores o "autom\u00e1tico" para usar el UUID generado aleatoriamente la primera vez que se inicializa el m\u00f3dulo
Unique\ ID\ of\ a\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=ID \u00fanico de un sistema al que se aplica esta configuraci\u00f3n.\nPuede incluir un comod\u00edn final ''*'' para hacer coincidir varios sistemas a la vez.
