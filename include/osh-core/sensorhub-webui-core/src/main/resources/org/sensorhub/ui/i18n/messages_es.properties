Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ systems\ registered\ through\ this\ service.\ Only\ systems\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadatos del grupo de sistemas que se crear\u00e1 para contener todos los sistemas registrados a trav\u00e9s de este servicio. S\u00f3lo los sistemas de este grupo ser\u00e1n modificables por este servicio
