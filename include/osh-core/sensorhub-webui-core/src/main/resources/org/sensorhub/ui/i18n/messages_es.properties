ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID del m\u00f3dulo de base de datos utilizado para conservar los datos recibidos por este servicio. Si no se proporciona ninguno, los nuevos sistemas registrados a trav\u00e9s de este servicio estar\u00e1n disponibles en el centro, pero sin garant\u00eda de persistencia entre reinicios. Solo estar\u00e1 disponible la \u00faltima observaci\u00f3n de cada flujo de datos y las observaciones m\u00e1s antiguas se descartar\u00e1n.
