Maximum\ number\ of\ observations\ returned\ \ by\ a\ historical\ GetObservation\ request\ (for\ each\ selected\ offering)=S\u1ed1 l\u01b0\u1ee3ng quan s\u00e1t t\u1ed1i \u0111a \u0111\u01b0\u1ee3c y\u00eau c\u1ea7u GetObservation l\u1ecbch s\u1eed tr\u1ea3 v\u1ec1 (\u0111\u1ed1i v\u1edbi m\u1ed7i \u01b0u \u0111\u00e3i \u0111\u00e3 ch\u1ecdn)
