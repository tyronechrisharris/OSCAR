ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.=ID c\u1ee7a m\u00f4-\u0111un c\u01a1 s\u1edf d\u1eef li\u1ec7u \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng \u0111\u1ec3 l\u01b0u tr\u1eef d\u1eef li\u1ec7u m\u00e0 d\u1ecbch v\u1ee5 n\u00e0y nh\u1eadn \u0111\u01b0\u1ee3c. N\u1ebfu kh\u00f4ng c\u00f3 g\u00ec \u0111\u01b0\u1ee3c cung c\u1ea5p, c\u00e1c h\u1ec7 th\u1ed1ng m\u1edbi \u0111\u01b0\u1ee3c \u0111\u0103ng k\u00fd th\u00f4ng qua d\u1ecbch v\u1ee5 n\u00e0y s\u1ebd c\u00f3 s\u1eb5n tr\u00ean trung t\u00e2m nh\u01b0ng kh\u00f4ng c\u00f3 s\u1ef1 \u0111\u1ea3m b\u1ea3o v\u1ec1 t\u00ednh b\u1ec1n v\u1eefng trong su\u1ed1t qu\u00e1 tr\u00ecnh kh\u1edfi \u0111\u1ed9ng l\u1ea1i.
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID c\u1ee7a m\u00f4-\u0111un c\u01a1 s\u1edf d\u1eef li\u1ec7u \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng \u0111\u1ec3 l\u01b0u tr\u1eef d\u1eef li\u1ec7u m\u00e0 d\u1ecbch v\u1ee5 n\u00e0y nh\u1eadn \u0111\u01b0\u1ee3c. N\u1ebfu kh\u00f4ng c\u00f3 g\u00ec \u0111\u01b0\u1ee3c cung c\u1ea5p, c\u00e1c h\u1ec7 th\u1ed1ng m\u1edbi \u0111\u01b0\u1ee3c \u0111\u0103ng k\u00fd th\u00f4ng qua d\u1ecbch v\u1ee5 n\u00e0y s\u1ebd c\u00f3 s\u1eb5n tr\u00ean trung t\u00e2m nh\u01b0ng kh\u00f4ng c\u00f3 s\u1ef1 \u0111\u1ea3m b\u1ea3o v\u1ec1 t\u00ednh b\u1ec1n v\u1eefng trong su\u1ed1t qu\u00e1 tr\u00ecnh kh\u1edfi \u0111\u1ed9ng l\u1ea1i. Ch\u1ec9 c\u00f3 quan s\u00e1t m\u1edbi nh\u1ea5t t\u1eeb \u200b\u200bm\u1ed7i lu\u1ed3ng d\u1eef li\u1ec7u m\u1edbi c\u00f3 s\u1eb5n v\u00e0 c\u00e1c quan s\u00e1t c\u0169 h\u01a1n s\u1ebd b\u1ecb lo\u1ea1i b\u1ecf
Individual\ configuration\ of\ sensors\ in\ the\ array\ (will\ override\ common\ configuration)=C\u1ea5u h\u00ecnh ri\u00eang l\u1ebb c\u1ee7a c\u00e1c c\u1ea3m bi\u1ebfn trong m\u1ea3ng (s\u1ebd ghi \u0111\u00e8 c\u1ea5u h\u00ecnh chung)
