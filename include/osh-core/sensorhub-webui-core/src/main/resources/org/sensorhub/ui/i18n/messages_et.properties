Method\ used\ to\ authenticate\ users\ on\ this\ server=Selle serveri kasutajate autentimiseks kasutatav meetod
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.keyStore\"\ system\ property.\=Tee v\u00f5tmehoidlasse, mis sisaldab sertifikaati ja v\u00f5tmepaari, mida see server HTTPS-i kaudu klientidele esitab. Kui see v\u00e4\u00e4rtus on t\u00fchi, kasutatakse vaikimisi s\u00fcsteemiatribuudi \"javax.net.ssl.keyStore\" v\u00e4\u00e4rtust.
Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=V\u00f5tmehoidlas oleva avaliku/privaatse v\u00f5tmepaari pseudon\u00fc\u00fcm, mida kasutatakse selle serveri tuvastamiseks.
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStore\"\ system\ property.\=Tee TLS-i usaldussalve juurde, mida kasutatakse siis, kui on vaja kliendi autentimist. Eiratakse, kui kliendi sertifikaadi autentimist ei kasutata. Selles failis olevad sertifikaadid m\u00e4\u00e4ravad usaldusv\u00e4\u00e4rsete kliendisertifikaatide allkirjastamise asutused. Kui see v\u00e4\u00e4rtus on t\u00fchi, kasutatakse vaikimisi s\u00fcsteemiatribuudi \"javax.net.ssl.trustStore\" v\u00e4\u00e4rtust.
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStorePassword\"\ system\ property.\=Usalduspoe parool. Eiratakse, kui kliendi sertifikaadi autentimist ei kasutata. Kui see v\u00e4\u00e4rtus on t\u00fchi, kasutatakse vaikimisi s\u00fcsteemiatribuudi \"javax.net.ssl.trustStorePassword\" v\u00e4\u00e4rtust.
