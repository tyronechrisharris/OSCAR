Time-out\ after\ which\ real-time\ requests\ are\ disabled\ if\ no\ more\ measurements\ are\ received\ (in\ seconds).\ Real-time\ is\ reactivated\ as\ soon\ as\ new\ records\ start\ being\ received\ again=Ajal\u00f5pp, mille j\u00e4rel reaalajas p\u00e4ringud keelatakse, kui rohkem m\u00f5\u00f5tmisi ei v\u00f5eta (sekundites). Reaalajas aktiveeritakse uuesti niipea, kui uusi kirjeid hakatakse uuesti vastu v\u00f5tma
