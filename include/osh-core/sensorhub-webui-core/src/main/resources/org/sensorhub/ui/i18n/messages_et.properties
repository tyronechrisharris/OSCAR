Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=V\u00f5tmehoidlas oleva avaliku/privaatse v\u00f5tmepaari pseudon\u00fc\u00fcm, mida kasutatakse selle serveri tuvastamiseks.
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStore\"\ system\ property.\=Path to the TLS trust store that is used when client authentication is required. Ignored if client certificate authentication is not used. Certificates in this file designate the signing authorities for client certificates that will be trusted. If this value is blank, will default to using the value of the \"javax.net.ssl.trustStore\" system property.
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStorePassword\"\ system\ property.\=Password for the trust store. Ignored if client certificate authentication is not used. If this value is blank, will default to using the value of the \"javax.net.ssl.trustStorePassword\" system property.
