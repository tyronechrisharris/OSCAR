Orientation\ as\ Euler\ angles\ in\ NED\ coordinate\ reference\ frame.\nOrder\ of\ rotations\ is\ z-y\u2019-x"\ (in\ rotating\ frame)\ or\ x-y-z\ (in\ fixed\ frame)=Orientatsioon Euleri nurkadena NED koordinaatide v\u00f5rdlusraamis.\nP\u00f6\u00f6ramiste j\u00e4rjekord on z-y\u2019-x" (p\u00f6\u00f6rlevas raamis) v\u00f5i x-y-z (fikseeritud raamis)
Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=V\u00f5tmehoidla (ja v\u00f5tmehoidlas oleva v\u00f5tmepaari) parool. Kui see v\u00e4\u00e4rtus on t\u00fchi, kasutatakse vaikimisi s\u00fcsteemiatribuudi "javax.net.ssl.keyStorePassword" v\u00e4\u00e4rtust. See v\u00e4\u00e4rtus v\u00f5ib kasutada muutuja laiendusavaldisi kujul "$${name}" (keskkonnamuutujate ja s\u00fcsteemiatribuutide jaoks) v\u00f5i "$${fail;/tee/faili/faili}" (salajase faili sisu jaoks).
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Usalduspoe parool. Eiratakse, kui kliendi sertifikaadi autentimist ei kasutata. Kui see v\u00e4\u00e4rtus on t\u00fchi, kasutatakse vaikimisi s\u00fcsteemiatribuudi "javax.net.ssl.trustStorePassword" v\u00e4\u00e4rtust. See v\u00e4\u00e4rtus v\u00f5ib kasutada muutuja laiendusavaldisi kujul "$${name}" (keskkonnamuutujate ja s\u00fcsteemiatribuutide jaoks) v\u00f5i "$${fail;/tee/faili/faili}" (salajase faili sisu jaoks).
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=Teenuse l\u00f5pp-punkti tee konteksti URL-i suhtes (nt http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Tee v\u00f5tmehoidlasse, mis sisaldab sertifikaati ja v\u00f5tmepaari, mida see server HTTPS-i kaudu klientidele esitab. Kui see v\u00e4\u00e4rtus on t\u00fchi, kasutatakse vaikimisi s\u00fcsteemiatribuudi "javax.net.ssl.keyStore" v\u00e4\u00e4rtust. See v\u00e4\u00e4rtus v\u00f5ib kasutada muutuja laiendusavaldisi kujul "$${name}" (keskkonnamuutujate ja s\u00fcsteemiatribuutide jaoks) v\u00f5i "$${fail;/tee/faili/faili}" (salajase faili sisu jaoks).
Path\ to\ database\ file=Tee andmebaasifaili
Path\ to\ external\ config\ file\ (in\ Jetty\ IOC\ XML\ format)=V\u00e4lise konfiguratsioonifaili tee (Jetty IOC XML-vormingus)
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Tee TLS-i usaldussalve juurde, mida kasutatakse siis, kui on vaja kliendi autentimist. Eiratakse, kui kliendi sertifikaadi autentimist ei kasutata. Selles failis olevad sertifikaadid m\u00e4\u00e4ravad usaldusv\u00e4\u00e4rsete kliendisertifikaatide allkirjastamise asutused. Kui see v\u00e4\u00e4rtus on t\u00fchi, kasutatakse vaikimisi s\u00fcsteemiatribuudi "javax.net.ssl.trustStore" v\u00e4\u00e4rtust. See v\u00e4\u00e4rtus v\u00f5ib kasutada muutuja laiendusavaldisi kujul "$${name}" (keskkonnamuutujate ja s\u00fcsteemiatribuutide jaoks) v\u00f5i "$${fail;/tee/faili/faili}" (salajase faili sisu jaoks).
