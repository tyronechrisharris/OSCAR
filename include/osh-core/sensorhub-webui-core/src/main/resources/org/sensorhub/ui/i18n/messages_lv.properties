Orientation\ as\ Euler\ angles\ in\ NED\ coordinate\ reference\ frame.\nOrder\ of\ rotations\ is\ z-y\u2019-x"\ (in\ rotating\ frame)\ or\ x-y-z\ (in\ fixed\ frame)=Orient\u0101cija k\u0101 Eilera le\u0146\u0137i NED koordin\u0101tu atskaites r\u0101m\u012b.\nRot\u0101ciju sec\u012bba ir z-y''-x" (rot\u0113jo\u0161\u0101 r\u0101m\u012b) vai x-y-z (fiks\u0113t\u0101 r\u0101m\u012b)
Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Parole atsl\u0113gu kr\u0101tuves (un atsl\u0113gu p\u0101ra atsl\u0113gu kr\u0101tuves ietvaros). Ja \u0161\u012b v\u0113rt\u012bba ir tuk\u0161a, p\u0113c noklus\u0113juma tiks izmantota sist\u0113mas rekviz\u012bta "javax.net.ssl.keyStorePassword" v\u0113rt\u012bba. \u0160ai v\u0113rt\u012bbai var izmantot main\u012bgo papla\u0161in\u0101\u0161anas izteiksmes form\u0101 "$${name}" (vides main\u012bgajiem un sist\u0113mas rekviz\u012btiem) vai "$${file;/path/to/file}" (slepenajam faila saturam).
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Trasta veikala parole. Ignor\u0113, ja netiek izmantota klienta sertifik\u0101ta autentifik\u0101cija. Ja \u0161\u012b v\u0113rt\u012bba ir tuk\u0161a, p\u0113c noklus\u0113juma tiks izmantota sist\u0113mas rekviz\u012bta "javax.net.ssl.trustStorePassword" v\u0113rt\u012bba. \u0160ai v\u0113rt\u012bbai var izmantot main\u012bgo papla\u0161in\u0101\u0161anas izteiksmes form\u0101 "$${name}" (vides main\u012bgajiem un sist\u0113mas rekviz\u012btiem) vai "$${file;/path/to/file}" (slepenajam faila saturam).
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=Pakalpojuma galapunkta ce\u013c\u0161 attiec\u012bb\u0101 pret konteksta\u00a0URL (piem\u0113ram, http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Ce\u013c\u0161 uz atsl\u0113gu kr\u0101tuvi, kur\u0101 ir sertifik\u0101ts un atsl\u0113gu p\u0101ris, ko \u0161is serveris par\u0101d\u012bs klientiem, kad tam piek\u013c\u016bst, izmantojot HTTPS. Ja \u0161\u012b v\u0113rt\u012bba ir tuk\u0161a, p\u0113c noklus\u0113juma tiks izmantota sist\u0113mas rekviz\u012bta "javax.net.ssl.keyStore" v\u0113rt\u012bba. \u0160ai v\u0113rt\u012bbai var izmantot main\u012bgo papla\u0161in\u0101\u0161anas izteiksmes form\u0101 "$${name}" (vides main\u012bgajiem un sist\u0113mas rekviz\u012btiem) vai "$${file;/path/to/file}" (slepenajam faila saturam).
Path\ to\ database\ file=Ce\u013c\u0161 uz datu b\u0101zes failu
Path\ to\ external\ config\ file\ (in\ Jetty\ IOC\ XML\ format)=Ce\u013c\u0161 uz \u0101r\u0113jo konfigur\u0101cijas failu (Jetty IOC XML form\u0101t\u0101)
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Ce\u013c\u0161 uz TLS uzticam\u012bbas kr\u0101tuvi, kas tiek izmantots, ja ir nepiecie\u0161ama klienta autentifik\u0101cija. Ignor\u0113, ja netiek izmantota klienta sertifik\u0101ta autentifik\u0101cija. \u0160aj\u0101 fail\u0101 eso\u0161ie sertifik\u0101ti nor\u0101da uzticamo klientu sertifik\u0101tu parakst\u012b\u0161anas iest\u0101des. Ja \u0161\u012b v\u0113rt\u012bba ir tuk\u0161a, p\u0113c noklus\u0113juma tiks izmantota sist\u0113mas rekviz\u012bta "javax.net.ssl.trustStore" v\u0113rt\u012bba. \u0160ai v\u0113rt\u012bbai var izmantot main\u012bgo papla\u0161in\u0101\u0161anas izteiksmes form\u0101 "$${name}" (vides main\u012bgajiem un sist\u0113mas rekviz\u012btiem) vai "$${file;/path/to/file}" (slepenajam faila saturam).
Port\ number\ to\ connect\ to\ on\ remote\ host\ (0\ to\ automatically\ select\ a\ port)=Porta numurs, ar kuru izveidot savienojumu att\u0101laj\u0101 resursdator\u0101 (0, lai autom\u0101tiski atlas\u012btu portu)
SOS\ Endpoint=SOS galapunkts
