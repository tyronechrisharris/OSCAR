Maximum\ number\ of\ records\ in\ upload\ queue\ (used\ to\ compensate\ for\ variable\ bandwidth)=Maksim\u0101lais ierakstu skaits aug\u0161upiel\u0101des rind\u0101 (izmanto, lai kompens\u0113tu main\u012bgo joslas platumu)
Maximum\ number\ of\ resources\ returned\ in\ a\ single\ page=Maksim\u0101lais vien\u0101 lap\u0101 atgriezto resursu skaits
Maximum\ number\ of\ result\ records\ returned\ by\ a\ historical\ GetResult\ request=Maksim\u0101lais rezult\u0101tu ierakstu skaits, kas tiek atgriezti ar v\u0113sturisku GetResult piepras\u012bjumu
Maximum\ number\ of\ stream\ errors\ before\ we\ try\ to\ reconnect\ to\ remote\ server=Maksim\u0101lais straumes k\u013c\u016bdu skaits, pirms m\u0113\u0123in\u0101m atk\u0101rtoti izveidot savienojumu ar att\u0101lo serveri
Memory\ cache\ size\ for\ page\ chunks,\ in\ KB=Atmi\u0146as ke\u0161atmi\u0146as lielums lappu\u0161u da\u013c\u0101m, KB
