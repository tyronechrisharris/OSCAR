ID\ Generator=ID \u0123enerators
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.=Datu b\u0101zes modu\u013ca ID, ko izmanto \u0161\u012b pakalpojuma sa\u0146emtajiem past\u0101v\u012bgajiem datiem. Ja nekas netiek nodro\u0161in\u0101ts, jaunas sist\u0113mas, kas re\u0123istr\u0113tas, izmantojot \u0161o pakalpojumu, b\u016bs pieejamas centrmezgl\u0101, ta\u010du bez notur\u012bbas garantijas restart\u0113\u0161anas laik\u0101.
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=Datu b\u0101zes modu\u013ca ID, ko izmanto \u0161\u012b pakalpojuma sa\u0146emtajiem past\u0101v\u012bgajiem datiem. Ja nekas netiek nodro\u0161in\u0101ts, jaunas sist\u0113mas, kas re\u0123istr\u0113tas, izmantojot \u0161o pakalpojumu, b\u016bs pieejamas centrmezgl\u0101, ta\u010du bez notur\u012bbas garantijas restart\u0113\u0161anas laik\u0101. B\u016bs pieejams tikai jaun\u0101kais nov\u0113rojums no katras datu pl\u016bsmas, un vec\u0101ki nov\u0113rojumi tiks atmesti
