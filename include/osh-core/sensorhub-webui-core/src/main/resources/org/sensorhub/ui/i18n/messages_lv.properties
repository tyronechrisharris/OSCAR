Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.keyStore\"\ system\ property.\=Ce\u013c\u0161 uz atsl\u0113gu kr\u0101tuvi, kur\u0101 ir sertifik\u0101ts un atsl\u0113gu p\u0101ris, ko \u0161is serveris par\u0101d\u012bs klientiem, kad tam piek\u013c\u016bst, izmantojot HTTPS. Ja \u0161\u012b v\u0113rt\u012bba ir tuk\u0161a, p\u0113c noklus\u0113juma tiks izmantota sist\u0113mas rekviz\u012bta \"javax.net.ssl.keyStore\" v\u0113rt\u012bba.
Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=Publisk\u0101/priv\u0101t\u0101 atsl\u0113gu p\u0101ra aizst\u0101jv\u0101rds atsl\u0113gu kr\u0101tuv\u0113, kas tiks izmantots \u0161\u012b servera identific\u0113\u0161anai.
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStore\"\ system\ property.\=Ce\u013c\u0161 uz TLS uzticam\u012bbas kr\u0101tuvi, kas tiek izmantots, ja ir nepiecie\u0161ama klienta autentifik\u0101cija. Ignor\u0113, ja netiek izmantota klienta sertifik\u0101ta autentifik\u0101cija. \u0160aj\u0101 fail\u0101 eso\u0161ie sertifik\u0101ti nor\u0101da uzticamo klientu sertifik\u0101tu parakst\u012b\u0161anas iest\u0101des. Ja \u0161\u012b v\u0113rt\u012bba ir tuk\u0161a, p\u0113c noklus\u0113juma tiks izmantota sist\u0113mas rekviz\u012bta \"javax.net.ssl.trustStore\" v\u0113rt\u012bba.
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStorePassword\"\ system\ property.\=Trasta veikala parole. Ignor\u0113, ja netiek izmantota klienta sertifik\u0101ta autentifik\u0101cija. Ja \u0161\u012b v\u0113rt\u012bba ir tuk\u0161a, p\u0113c noklus\u0113juma tiks izmantota sist\u0113mas rekviz\u012bta \"javax.net.ssl.trustStorePassword\" v\u0113rt\u012bba.
