Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ systems\ registered\ through\ this\ service.\ Only\ systems\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Sist\u0113mu grupas metadati, kas tiks izveidoti, lai ietvertu visas sist\u0113mas, kas re\u0123istr\u0113tas, izmantojot \u0161o pakalpojumu. \u0160is pakalpojums main\u012bs tikai \u0161\u012bs grupas sist\u0113mas
