For\ each\ connection\ or\ reconnection\ attempt,\ the\ client\ will\ wait\ for\ the\ remote\ side\ to\ respond\ until\ this\ timeout\ expires\ (in\ ms)=Katram savienojuma vai atk\u0101rtota savienojuma m\u0113\u0123in\u0101jumam klients gaid\u012bs att\u0101l\u0101s puses atbildi, l\u012bdz beigsies \u0161is taimauts (ms)
