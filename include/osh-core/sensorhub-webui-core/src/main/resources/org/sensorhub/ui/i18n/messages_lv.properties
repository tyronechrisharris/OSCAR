Sensor\ UID=Sensora UID
Set\ if\ WebSocket\ protocol\ should\ be\ used\ to\ get\ streaming\ data\ from\ SOS=Iestatiet, vai WebSocket protokols ir j\u0101izmanto, lai ieg\u016btu straum\u0113\u0161anas datus no SOS
Set\ if\ offering\ is\ enabled,\ unset\ if\ disabled=Iestat\u012bt, ja pied\u0101v\u0101jums ir iesp\u0113jots, atiestat\u012bt, ja tas ir atsp\u0113jots
Set\ if\ websockets\ protocol\ should\ be\ used\ to\ send\ commands\ to\ SPS=Iestatiet, vai komandu nos\u016bt\u012b\u0161anai uz SPS ir j\u0101izmanto Websockets protokols
Set\ to\ compact\ the\ database\ file\ when\ the\ database\ module\ is\ stopped\ or\ restarted=Iestatiet datu b\u0101zes faila bl\u012bv\u0113\u0161anu, kad datu b\u0101zes modulis tiek aptur\u0113ts vai restart\u0113ts
Set\ to\ compress\ underlying\ file\ storage=Iestatiet, lai saspiestu pamat\u0101 eso\u0161o failu kr\u0101tuvi
Set\ to\ display\ MVStore\ debug\ info\ when\ database\ is\ closed\ (only\ if\ DEBUG\ log\ is\ also\ enabled)=Iestat\u012bt, lai tiktu r\u0101d\u012bta MVStore atk\u013c\u016bdo\u0161anas inform\u0101cija, kad datu b\u0101ze ir aizv\u0113rta (tikai tad, ja ir iesp\u0113jots ar\u012b DEBUG \u017eurn\u0101ls)
Set\ to\ enable\ spatial\ indexing\ of\ individual\ observations\ sampling\ locations\ (when\ provided)=Iestat\u012bt, lai iesp\u0113jotu atsevi\u0161\u0137u nov\u0113rojumu paraugu \u0146em\u0161anas vietu telpisko indeks\u0113\u0161anu (ja tas ir paredz\u0113ts)
Set\ to\ open\ the\ database\ as\ read-only=Iestatiet, lai datub\u0101ze tiktu atv\u0113rta tikai las\u0101mai
Set\ to\ true\ to\ enable\ transactional\ operation\ support=Iestatiet v\u0113rt\u012bbu True, lai iesp\u0113jotu dar\u012bjumu oper\u0101ciju atbalstu
Size\ of\ the\ auto-commit\ write\ buffer,\ in\ KB=Autom\u0101tisk\u0101s izpildes rakst\u012b\u0161anas bufera lielums KB
TCP\ port\ where\ server\ will\ listen\ for\ secure\ HTTP\ (HTTPS)\ connections\ (use\ 0\ to\ disable\ HTTPS).=TCP ports, kur\u0101 serveris uzklaus\u012bs dro\u0161us HTTP (HTTPS) savienojumus (izmantojiet 0, lai atsp\u0113jotu HTTPS).
TCP\ port\ where\ server\ will\ listen\ for\ unsecure\ HTTP\ connections\ (use\ 0\ to\ disable\ HTTP).=TCP ports, kur\u0101 serveris uzklaus\u012bs nedro\u0161us HTTP savienojumus (izmantojiet 0, lai atsp\u0113jotu HTTP).
Time-out\ after\ which\ real-time\ requests\ are\ disabled\ if\ no\ more\ measurements\ are\ received\ (in\ seconds).\ Real-time\ is\ reactivated\ as\ soon\ as\ new\ records\ start\ being\ received\ again=Taimauts, p\u0113c kura re\u0101llaika piepras\u012bjumi tiek atsp\u0113joti, ja vairs netiek sa\u0146emti m\u0113r\u012bjumi (sekund\u0113s). Re\u0101llaika re\u017e\u012bms tiek atk\u0101rtoti aktiviz\u0113ts, tikl\u012bdz tiek atkal sa\u0146emti jauni ieraksti
Time-out\ period\ after\ which\ a\ template\ ID\ reserved\ using\ InsertResultTemplate\ will\ expire\ if\ not\ used\ in\ InsertResult\ requests\ (in\ seconds)=Taimauta periods, p\u0113c kura veidnes\u00a0ID, kas rezerv\u0113ts, izmantojot InsertResultTemplate, beigsies, ja tas netiks izmantots InsertResult piepras\u012bjumos (sekund\u0113s)
Timeout\ after\ which\ data\ is\ released\ to\ the\ caller\ if\ at\ least\ one\ byte\ was\ received\ (in\ ms)=Taimauts, p\u0113c kura dati tiek nodoti zvan\u012bt\u0101jam, ja ir sa\u0146emts vismaz viens baits (ms)
URI\ Prefix\ Map=URI prefiksa karte
Unique\ ID\ (full\ URN\ or\ only\ suffix)\ to\ use\ for\ the\ sensor\ system\ or\ 'auto'\ to\ use\ the\ UUID\ randomly\ generated\ the\ first\ time\ the\ module\ is\ initialized=Unik\u0101ls ID (pilns URN vai tikai sufikss), ko izmantot sensoru sist\u0113mai, vai \u201cautom\u0101tiski\u201d, lai izmantotu UUID, kas nejau\u0161i \u0123ener\u0113ts, pirmo reizi inicializ\u0113jot moduli.
Unique\ ID\ of\ a\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=Unik\u0101ls sist\u0113mas ID, uz kuru attiecas \u0161\u012b konfigur\u0101cija.\nVar ietvert beigu aizst\u0101j\u0113jz\u012bmi \u201c*\u201d, lai vienlaikus atbilstu vair\u0101k\u0101m sist\u0113m\u0101m.
Unique\ ID\ of\ sensor\ to\ connect\ to\ on\ SOS\ and\ SPS\ servers=Unik\u0101ls sensora ID, lai izveidotu savienojumu ar SOS un SPS serveriem
Unique\ ID\ of\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=Unik\u0101ls sist\u0113mas ID, uz kuru attiecas \u0161\u012b konfigur\u0101cija.\nVar ietvert beigu aizst\u0101j\u0113jz\u012bmi \u201c*\u201d, lai vienlaikus atbilstu vair\u0101k\u0101m sist\u0113m\u0101m.
Use\ WebSockets\ for\ SOS=Izmantojiet WebSockets SOS
Use\ WebSockets\ for\ SPS=Izmantojiet WebSockets SPS

