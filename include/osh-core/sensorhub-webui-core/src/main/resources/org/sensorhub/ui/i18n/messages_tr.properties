Sensor\ UID=Sens\u00f6r UID''si
Set\ if\ WebSocket\ protocol\ should\ be\ used\ to\ get\ streaming\ data\ from\ SOS=SOS''tan ak\u0131\u015f verilerini almak i\u00e7in WebSocket protokol\u00fcn\u00fcn kullan\u0131lmas\u0131 gerekip gerekmedi\u011fini ayarlay\u0131n
Set\ if\ offering\ is\ enabled,\ unset\ if\ disabled=Teklif etkinse ayarlay\u0131n, devre d\u0131\u015f\u0131ysa ayar\u0131 kald\u0131r\u0131n
Set\ if\ websockets\ protocol\ should\ be\ used\ to\ send\ commands\ to\ SPS=SPS''ye komut g\u00f6ndermek i\u00e7in websockets protokol\u00fcn\u00fcn kullan\u0131lmas\u0131 gerekip gerekmedi\u011fini ayarlay\u0131n
Set\ to\ compact\ the\ database\ file\ when\ the\ database\ module\ is\ stopped\ or\ restarted=Veritaban\u0131 mod\u00fcl\u00fc durduruldu\u011funda veya yeniden ba\u015flat\u0131ld\u0131\u011f\u0131nda veritaban\u0131 dosyas\u0131n\u0131 s\u0131k\u0131\u015ft\u0131racak \u015fekilde ayarlay\u0131n
Set\ to\ compress\ underlying\ file\ storage=Temel dosya depolama alan\u0131n\u0131 s\u0131k\u0131\u015ft\u0131rmak i\u00e7in ayarla
Set\ to\ display\ MVStore\ debug\ info\ when\ database\ is\ closed\ (only\ if\ DEBUG\ log\ is\ also\ enabled)=Veritaban\u0131 kapat\u0131ld\u0131\u011f\u0131nda MVStore hata ay\u0131klama bilgilerini g\u00f6r\u00fcnt\u00fcleyecek \u015fekilde ayarlay\u0131n (yaln\u0131zca DEBUG g\u00fcnl\u00fc\u011f\u00fc de etkinse)
Set\ to\ enable\ spatial\ indexing\ of\ individual\ observations\ sampling\ locations\ (when\ provided)=Bireysel g\u00f6zlem \u00f6rnekleme konumlar\u0131n\u0131n (sa\u011fland\u0131\u011f\u0131nda) mekansal indekslenmesini sa\u011flayacak \u015fekilde ayarlay\u0131n
Set\ to\ open\ the\ database\ as\ read-only=Veritaban\u0131n\u0131 salt okunur olarak a\u00e7acak \u015fekilde ayarlay\u0131n
Set\ to\ true\ to\ enable\ transactional\ operation\ support=\u0130\u015flemsel i\u015flem deste\u011fini etkinle\u015ftirmek i\u00e7in true olarak ayarlay\u0131n
Size\ of\ the\ auto-commit\ write\ buffer,\ in\ KB=Otomatik kesinle\u015ftirme yazma arabelle\u011finin boyutu, KB cinsinden
TCP\ port\ where\ server\ will\ listen\ for\ secure\ HTTP\ (HTTPS)\ connections\ (use\ 0\ to\ disable\ HTTPS).=Sunucunun g\u00fcvenli HTTP (HTTPS) ba\u011flant\u0131lar\u0131n\u0131 dinleyece\u011fi TCP ba\u011flant\u0131 noktas\u0131 (HTTPS''yi devre d\u0131\u015f\u0131 b\u0131rakmak i\u00e7in 0 kullan\u0131n).
TCP\ port\ where\ server\ will\ listen\ for\ unsecure\ HTTP\ connections\ (use\ 0\ to\ disable\ HTTP).=Sunucunun g\u00fcvenli olmayan HTTP ba\u011flant\u0131lar\u0131n\u0131 dinleyece\u011fi TCP ba\u011flant\u0131 noktas\u0131 (HTTP''yi devre d\u0131\u015f\u0131 b\u0131rakmak i\u00e7in 0 kullan\u0131n).
Time-out\ after\ which\ real-time\ requests\ are\ disabled\ if\ no\ more\ measurements\ are\ received\ (in\ seconds).\ Real-time\ is\ reactivated\ as\ soon\ as\ new\ records\ start\ being\ received\ again=Daha fazla \u00f6l\u00e7\u00fcm al\u0131nmamas\u0131 durumunda ger\u00e7ek zamanl\u0131 isteklerin devre d\u0131\u015f\u0131 b\u0131rak\u0131laca\u011f\u0131 zaman a\u015f\u0131m\u0131 (saniye cinsinden). Yeni kay\u0131tlar yeniden al\u0131nmaya ba\u015fland\u0131\u011f\u0131nda ger\u00e7ek zamanl\u0131 yeniden etkinle\u015ftirilir
Time-out\ period\ after\ which\ a\ template\ ID\ reserved\ using\ InsertResultTemplate\ will\ expire\ if\ not\ used\ in\ InsertResult\ requests\ (in\ seconds)=InsertResultTemplate kullan\u0131larak ayr\u0131lan \u015fablon kimli\u011finin, InsertResult isteklerinde kullan\u0131lmamas\u0131 durumunda s\u00fcresinin dolaca\u011f\u0131 zaman a\u015f\u0131m\u0131 s\u00fcresi (saniye olarak)
Timeout\ after\ which\ data\ is\ released\ to\ the\ caller\ if\ at\ least\ one\ byte\ was\ received\ (in\ ms)=En az bir bayt al\u0131nm\u0131\u015fsa, verinin arayan ki\u015fiye yay\u0131nlanmas\u0131ndan sonra zaman a\u015f\u0131m\u0131 (ms cinsinden)
URI\ Prefix\ Map=URI \u00d6nek Haritas\u0131
Unique\ ID\ (full\ URN\ or\ only\ suffix)\ to\ use\ for\ the\ sensor\ system\ or\ 'auto'\ to\ use\ the\ UUID\ randomly\ generated\ the\ first\ time\ the\ module\ is\ initialized=Sens\u00f6r sistemi i\u00e7in kullan\u0131lacak benzersiz kimlik (tam URN veya yaln\u0131zca son ek) veya mod\u00fcl ilk ba\u015flat\u0131ld\u0131\u011f\u0131nda rastgele olu\u015fturulan UUID''yi kullanmak i\u00e7in ''otomatik''
Unique\ ID\ of\ a\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=Bu yap\u0131land\u0131rman\u0131n ge\u00e7erli oldu\u011fu sistemin benzersiz kimli\u011fi.\nAyn\u0131 anda birden fazla sistemi e\u015fle\u015ftirmek i\u00e7in sonuna ''*'' joker karakteri eklenebilir.
Unique\ ID\ of\ sensor\ to\ connect\ to\ on\ SOS\ and\ SPS\ servers=SOS ve SPS sunucular\u0131na ba\u011flan\u0131lacak sens\u00f6r\u00fcn benzersiz kimli\u011fi
Unique\ ID\ of\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=Bu yap\u0131land\u0131rman\u0131n ge\u00e7erli oldu\u011fu sistemin benzersiz kimli\u011fi.\nAyn\u0131 anda birden fazla sistemi e\u015fle\u015ftirmek i\u00e7in sonuna ''*'' joker karakteri eklenebilir.
Use\ WebSockets\ for\ SOS=SOS i\u00e7in WebSockets''\u0131 kullan\u0131n
