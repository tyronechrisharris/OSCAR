Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.keyStore\"\ system\ property.\=Path to a key store containing the certificate and keypair that this server will present to clients when accessed over HTTPS. If this value is blank, will default to using the value of the \"javax.net.ssl.keyStore\" system property.
Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=Bu sunucuyu tan\u0131mlamak i\u00e7in kullan\u0131lacak anahtar deposundaki genel/\u00f6zel anahtar \u00e7iftinin takma ad\u0131.
