How\ long\ the\ client\ will\ wait\ after\ connection\ is\ lost\ before\ it\ will\ attempt\ to\ reconnect\ (in\ ms)=\u0130stemcinin ba\u011flant\u0131 kesildikten sonra yeniden ba\u011flanmay\u0131 denemeden \u00f6nce ne kadar s\u00fcre bekleyece\u011fi (ms cinsinden)
ID\ Generator=Kimlik Olu\u015fturucu
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.=Bu hizmet taraf\u0131ndan al\u0131nan kal\u0131c\u0131 veriler i\u00e7in kullan\u0131lan veritaban\u0131 mod\u00fcl\u00fcn\u00fcn kimli\u011fi. Hi\u00e7biri sa\u011flanmazsa, bu hizmet arac\u0131l\u0131\u011f\u0131yla kaydedilen yeni sistemler hub''da kullan\u0131labilir olacak, ancak yeniden ba\u015flatmalarda kal\u0131c\u0131l\u0131k garantisi olmayacak.
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=Bu hizmet taraf\u0131ndan al\u0131nan kal\u0131c\u0131 veriler i\u00e7in kullan\u0131lan veritaban\u0131 mod\u00fcl\u00fcn\u00fcn kimli\u011fi. Hi\u00e7biri sa\u011flanmazsa, bu hizmet arac\u0131l\u0131\u011f\u0131yla kaydedilen yeni sistemler hub''da kullan\u0131labilir olacak, ancak yeniden ba\u015flatmalarda kal\u0131c\u0131l\u0131k garantisi olmayacak. Her veri ak\u0131\u015f\u0131ndan yaln\u0131zca en son g\u00f6zlem mevcut olacak ve daha eski g\u00f6zlemler at\u0131lacak
