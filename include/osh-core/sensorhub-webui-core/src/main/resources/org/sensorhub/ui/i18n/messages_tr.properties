Maximum\ number\ of\ records\ in\ upload\ queue\ (used\ to\ compensate\ for\ variable\ bandwidth)=Y\u00fckleme kuyru\u011fundaki maksimum kay\u0131t say\u0131s\u0131 (de\u011fi\u015fken bant geni\u015fli\u011fini dengelemek i\u00e7in kullan\u0131l\u0131r)
Maximum\ number\ of\ resources\ returned\ in\ a\ single\ page=Tek bir sayfada d\u00f6nd\u00fcr\u00fclen maksimum kaynak say\u0131s\u0131
Maximum\ number\ of\ result\ records\ returned\ by\ a\ historical\ GetResult\ request=Ge\u00e7mi\u015f bir GetResult iste\u011finin d\u00f6nd\u00fcrd\u00fc\u011f\u00fc maksimum sonu\u00e7 kayd\u0131 say\u0131s\u0131
Maximum\ number\ of\ stream\ errors\ before\ we\ try\ to\ reconnect\ to\ remote\ server=Uzak sunucuya yeniden ba\u011flanmay\u0131 denemeden \u00f6nce olu\u015fabilecek maksimum ak\u0131\u015f hatas\u0131 say\u0131s\u0131
Memory\ cache\ size\ for\ page\ chunks,\ in\ KB=KB cinsinden sayfa par\u00e7alar\u0131 i\u00e7in bellek \u00f6nbellek boyutu
