Minimum\ period\ between\ database\ commits\ (in\ ms)=Veritaban\u0131 taahh\u00fctleri aras\u0131ndaki minimum s\u00fcre (ms cinsinden)
Names\ of\ datastreams\ whose\ data\ will\ be\ hidden\ from\ the\ SOS.\ If\ this\ is\ null,\ all\ streams\ produced\ by\ the\ procedure\ are\ exposed=Verileri SOS''tan gizlenecek veri ak\u0131\u015flar\u0131n\u0131n adlar\u0131. Bu null ise prosed\u00fcr taraf\u0131ndan \u00fcretilen t\u00fcm ak\u0131\u015flar a\u00e7\u0131\u011fa \u00e7\u0131kar
Observed\ Properties=G\u00f6zlemlenen \u00d6zellikler
Offering\ URI\ as\ exposed\ in\ capabilities.\ (if\ null,\ the\ procedure\ UID\ is\ used)=URI''yi yeteneklerde a\u00e7\u0131k olarak sunma. (e\u011fer bo\u015fsa, UID prosed\u00fcr\u00fc kullan\u0131l\u0131r)
Offering\ description\ (if\ null,\ it\ will\ be\ auto-generated)=Teklif a\u00e7\u0131klamas\u0131 (e\u011fer bo\u015fsa otomatik olarak olu\u015fturulur)
Offering\ name\ (if\ null,\ the\ procedure\ name\ is\ used)=Teklif ad\u0131 (bo\u015f ise prosed\u00fcr ad\u0131 kullan\u0131l\u0131r)
Orientation\ as\ Euler\ angles\ in\ NED\ coordinate\ reference\ frame.\nOrder\ of\ rotations\ is\ z-y\u2019-x"\ (in\ rotating\ frame)\ or\ x-y-z\ (in\ fixed\ frame)=NED koordinat referans \u00e7er\u00e7evesinde Euler a\u00e7\u0131lar\u0131 olarak y\u00f6nlendirme.\nD\u00f6n\u00fc\u015f s\u0131ras\u0131 z-y''-x" (d\u00f6ner \u00e7er\u00e7evede) veya x-y-z''dir (sabit \u00e7er\u00e7evede)
Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Anahtar deposunun \u015fifresi (ve anahtar deposundaki anahtar \u00e7iftinin \u015fifresi). Bu de\u011fer bo\u015fsa, varsay\u0131lan olarak "javax.net.ssl.keyStorePassword" sistem \u00f6zelli\u011finin de\u011feri kullan\u0131lacakt\u0131r. Bu de\u011fer, "$${name}" (ortam de\u011fi\u015fkenleri ve sistem \u00f6zellikleri i\u00e7in) veya "$${file;/path/to/file}" (gizli dosya i\u00e7erikleri i\u00e7in) bi\u00e7imindeki de\u011fi\u015fken geni\u015fletme ifadelerini kullanabilir.
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=G\u00fcven ma\u011fazas\u0131n\u0131n \u015fifresi. \u0130stemci sertifikas\u0131 kimlik do\u011frulamas\u0131 kullan\u0131lmazsa yok say\u0131l\u0131r. Bu de\u011fer bo\u015fsa, varsay\u0131lan olarak "javax.net.ssl.trustStorePassword" sistem \u00f6zelli\u011finin de\u011feri kullan\u0131l\u0131r. Bu de\u011fer, "$${name}" (ortam de\u011fi\u015fkenleri ve sistem \u00f6zellikleri i\u00e7in) veya "$${file;/path/to/file}" (gizli dosya i\u00e7erikleri i\u00e7in) bi\u00e7imindeki de\u011fi\u015fken geni\u015fletme ifadelerini kullanabilir.
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=\u0130\u00e7erik URL''sine g\u00f6re hizmet u\u00e7 noktas\u0131 yolu (\u00f6r. http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Bu sunucunun HTTPS \u00fczerinden eri\u015fildi\u011finde istemcilere sunaca\u011f\u0131 sertifikay\u0131 ve anahtar \u00e7iftini i\u00e7eren anahtar deposunun yolu. Bu de\u011fer bo\u015fsa, varsay\u0131lan olarak "javax.net.ssl.keyStore" sistem \u00f6zelli\u011finin de\u011feri kullan\u0131lacakt\u0131r. Bu de\u011fer, "$${name}" (ortam de\u011fi\u015fkenleri ve sistem \u00f6zellikleri i\u00e7in) veya "$${file;/path/to/file}" (gizli dosya i\u00e7erikleri i\u00e7in) bi\u00e7imindeki de\u011fi\u015fken geni\u015fletme ifadelerini kullanabilir.
Path\ to\ database\ file=Veritaban\u0131 dosyas\u0131n\u0131n yolu
Path\ to\ external\ config\ file\ (in\ Jetty\ IOC\ XML\ format)=Harici yap\u0131land\u0131rma dosyas\u0131n\u0131n yolu (Jetty IOC XML format\u0131nda)
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=\u0130stemci kimlik do\u011frulamas\u0131 gerekti\u011finde kullan\u0131lan TLS g\u00fcven deposunun yolu. \u0130stemci sertifikas\u0131 kimlik do\u011frulamas\u0131 kullan\u0131lmazsa yok say\u0131l\u0131r. Bu dosyadaki sertifikalar, g\u00fcvenilecek istemci sertifikalar\u0131n\u0131n imzalama yetkililerini belirler. Bu de\u011fer bo\u015fsa, varsay\u0131lan olarak "javax.net.ssl.trustStore" sistem \u00f6zelli\u011finin de\u011feri kullan\u0131l\u0131r. Bu de\u011fer, "$${name}" (ortam de\u011fi\u015fkenleri ve sistem \u00f6zellikleri i\u00e7in) veya "$${file;/path/to/file}" (gizli dosya i\u00e7erikleri i\u00e7in) bi\u00e7imindeki de\u011fi\u015fken geni\u015fletme ifadelerini kullanabilir.
Port\ number\ to\ connect\ to\ on\ remote\ host\ (0\ to\ automatically\ select\ a\ port)=Uzak ana makinede ba\u011flan\u0131lacak ba\u011flant\u0131 noktas\u0131 numaras\u0131 (bir ba\u011flant\u0131 noktas\u0131n\u0131 otomatik olarak se\u00e7mek i\u00e7in 0)
SOS\ Endpoint=SOS U\u00e7 Noktas\u0131
SOS\ endpoint\ to\ fetch\ data\ from=Verilerin al\u0131naca\u011f\u0131 SOS u\u00e7 noktas\u0131
