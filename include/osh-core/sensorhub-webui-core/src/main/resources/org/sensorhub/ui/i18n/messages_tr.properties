Max\ delay\ between\ auto-commit\ execution,\ in\ seconds.\ 0\ to\ disable\ time-based\ auto-commit=Otomatik kesinle\u015ftirmenin y\u00fcr\u00fct\u00fclmesi aras\u0131ndaki saniye cinsinden maksimum gecikme. Zamana dayal\u0131 otomatik tamamlamay\u0131 devre d\u0131\u015f\u0131 b\u0131rakmak i\u00e7in 0
