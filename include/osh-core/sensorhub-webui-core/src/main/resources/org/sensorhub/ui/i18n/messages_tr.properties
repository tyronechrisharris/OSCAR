For\ each\ connection\ or\ reconnection\ attempt,\ the\ client\ will\ wait\ for\ the\ remote\ side\ to\ respond\ until\ this\ timeout\ expires\ (in\ ms)=Her ba\u011flant\u0131 veya yeniden ba\u011flanma giri\u015fiminde istemci, bu zaman a\u015f\u0131m\u0131 s\u00fcresi dolana kadar (ms cinsinden) uzak taraf\u0131n yan\u0131t vermesini bekleyecektir.
