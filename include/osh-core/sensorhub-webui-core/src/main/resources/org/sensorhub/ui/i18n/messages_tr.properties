List\ of\ observed\ properties\ URI\ to\ make\ available\ as\ outputs=\u00c7\u0131k\u0131\u015f olarak kullan\u0131ma sunulacak g\u00f6zlemlenen \u00f6zellikler URI''sinin listesi
