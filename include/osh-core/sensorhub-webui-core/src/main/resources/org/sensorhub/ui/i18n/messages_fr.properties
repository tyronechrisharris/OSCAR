Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ procedures/sensors\ registered\ through\ this\ service.\ Only\ sensors\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=M\u00e9tadonn\u00e9es du groupe syst\u00e8me qui sera cr\u00e9\u00e9 pour contenir toutes les proc\u00e9dures/capteurs enregistr\u00e9s via ce service. Seuls les capteurs de ce groupe seront modifiables par ce service
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ systems\ registered\ through\ this\ service.\ Only\ systems\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=M\u00e9tadonn\u00e9es du groupe de syst\u00e8mes qui sera cr\u00e9\u00e9 pour contenir tous les syst\u00e8mes enregistr\u00e9s via ce service. Seuls les syst\u00e8mes de ce groupe seront modifiables par ce service
