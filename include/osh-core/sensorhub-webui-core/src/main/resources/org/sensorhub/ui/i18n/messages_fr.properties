SPS\ Endpoint=Point final SPS
SPS\ endpoint\ to\ send\ commands\ to=Point de terminaison SPS auquel envoyer des commandes
Security\ related\ options=Options li\u00e9es \u00e0 la s\u00e9curit\u00e9
Sensor\ UID=UID du capteur
Set\ if\ WebSocket\ protocol\ should\ be\ used\ to\ get\ streaming\ data\ from\ SOS=D\u00e9finir si le protocole WebSocket doit \u00eatre utilis\u00e9 pour obtenir des donn\u00e9es en streaming \u00e0 partir de SOS
Set\ if\ offering\ is\ enabled,\ unset\ if\ disabled=D\u00e9finir si l''offre est activ\u00e9e, d\u00e9sactiver si elle est d\u00e9sactiv\u00e9e
Set\ if\ websockets\ protocol\ should\ be\ used\ to\ send\ commands\ to\ SPS=D\u00e9finir si le protocole Websockets doit \u00eatre utilis\u00e9 pour envoyer des commandes au SPS
Set\ to\ compact\ the\ database\ file\ when\ the\ database\ module\ is\ stopped\ or\ restarted=D\u00e9finir pour compacter le fichier de base de donn\u00e9es lorsque le module de base de donn\u00e9es est arr\u00eat\u00e9 ou red\u00e9marr\u00e9
Set\ to\ compress\ underlying\ file\ storage=Configurer pour compresser le stockage de fichiers sous-jacent
Set\ to\ display\ MVStore\ debug\ info\ when\ database\ is\ closed\ (only\ if\ DEBUG\ log\ is\ also\ enabled)=D\u00e9finir pour afficher les informations de d\u00e9bogage MVStore lorsque la base de donn\u00e9es est ferm\u00e9e (uniquement si le journal DEBUG est \u00e9galement activ\u00e9)
Set\ to\ enable\ spatial\ indexing\ of\ individual\ observations\ sampling\ locations\ (when\ provided)=Configur\u00e9 pour permettre l''indexation spatiale des emplacements d''\u00e9chantillonnage d''observations individuelles (le cas \u00e9ch\u00e9ant)
Set\ to\ open\ the\ database\ as\ read-only=D\u00e9finir pour ouvrir la base de donn\u00e9es en lecture seule
Set\ to\ true\ to\ enable\ transactional\ operation\ support=D\u00e9finir sur true pour activer la prise en charge des op\u00e9rations transactionnelles
Size\ of\ the\ auto-commit\ write\ buffer,\ in\ KB=Taille du tampon d''\u00e9criture de validation automatique, en Ko
TCP\ port\ where\ server\ will\ listen\ for\ secure\ HTTP\ (HTTPS)\ connections\ (use\ 0\ to\ disable\ HTTPS).=Port TCP sur lequel le serveur \u00e9coutera les connexions HTTP s\u00e9curis\u00e9es (HTTPS) (utilisez 0 pour d\u00e9sactiver HTTPS).
TCP\ port\ where\ server\ will\ listen\ for\ unsecure\ HTTP\ connections\ (use\ 0\ to\ disable\ HTTP).=Port TCP sur lequel le serveur \u00e9coutera les connexions HTTP non s\u00e9curis\u00e9es (utilisez 0 pour d\u00e9sactiver HTTP).
Time-out\ after\ which\ real-time\ requests\ are\ disabled\ if\ no\ more\ measurements\ are\ received\ (in\ seconds).\ Real-time\ is\ reactivated\ as\ soon\ as\ new\ records\ start\ being\ received\ again=Time-out apr\u00e8s lequel les requ\u00eates en temps r\u00e9el sont d\u00e9sactiv\u00e9es si plus aucune mesure n''est re\u00e7ue (en secondes). Le temps r\u00e9el est r\u00e9activ\u00e9 d\u00e8s que de nouveaux enregistrements recommencent \u00e0 \u00eatre re\u00e7us
Time-out\ period\ after\ which\ a\ template\ ID\ reserved\ using\ InsertResultTemplate\ will\ expire\ if\ not\ used\ in\ InsertResult\ requests\ (in\ seconds)=D\u00e9lai d''expiration apr\u00e8s lequel un ID de mod\u00e8le r\u00e9serv\u00e9 \u00e0 l''aide de InsertResultTemplate expirera s''il n''est pas utilis\u00e9 dans les requ\u00eates InsertResult (en secondes)
Timeout\ after\ which\ data\ is\ released\ to\ the\ caller\ if\ at\ least\ one\ byte\ was\ received\ (in\ ms)=D\u00e9lai d''attente apr\u00e8s lequel les donn\u00e9es sont transmises \u00e0 l''appelant si au moins un octet a \u00e9t\u00e9 re\u00e7u (en ms)
URI\ Prefix\ Map=Carte des pr\u00e9fixes URI
Unique\ ID\ (full\ URN\ or\ only\ suffix)\ to\ use\ for\ the\ sensor\ system\ or\ 'auto'\ to\ use\ the\ UUID\ randomly\ generated\ the\ first\ time\ the\ module\ is\ initialized=ID unique (URN complet ou suffixe uniquement) \u00e0 utiliser pour le syst\u00e8me de capteurs ou \u00ab\u00a0auto\u00a0\u00bb pour utiliser l''UUID g\u00e9n\u00e9r\u00e9 al\u00e9atoirement lors de la premi\u00e8re initialisation du module.
