Offering\ name\ (if\ null,\ the\ procedure\ name\ is\ used)=Nom de l''offre (si nul, le nom de la proc\u00e9dure est utilis\u00e9)
Orientation\ as\ Euler\ angles\ in\ NED\ coordinate\ reference\ frame.\nOrder\ of\ rotations\ is\ z-y\u2019-x"\ (in\ rotating\ frame)\ or\ x-y-z\ (in\ fixed\ frame)=Orientation sous forme d''angles d''Euler dans le r\u00e9f\u00e9rentiel de coordonn\u00e9es NED.\nL''ordre des rotations est z-y''-x" (dans un cadre rotatif) ou x-y-z (dans un cadre fixe)
Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Mot de passe pour le magasin de cl\u00e9s (et pour la paire de cl\u00e9s dans le magasin de cl\u00e9s). Si cette valeur est vide, utilisera par d\u00e9faut la valeur de la propri\u00e9t\u00e9 syst\u00e8me \u00ab javax.net.ssl.keyStorePassword \u00bb. Cette valeur peut utiliser des expressions d''expansion de variable de la forme "$${name}" (pour les variables d''environnement et les propri\u00e9t\u00e9s syst\u00e8me) ou "$${file;/path/to/file}" (pour le contenu du fichier secret).
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Mot de passe du magasin de confiance. Ignor\u00e9 si l''authentification par certificat client n''est pas utilis\u00e9e. Si cette valeur est vide, utilisera par d\u00e9faut la valeur de la propri\u00e9t\u00e9 syst\u00e8me \u00ab javax.net.ssl.trustStorePassword \u00bb. Cette valeur peut utiliser des expressions d''expansion de variable de la forme "$${name}" (pour les variables d''environnement et les propri\u00e9t\u00e9s syst\u00e8me) ou "$${file;/path/to/file}" (pour le contenu du fichier secret).
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=Chemin du point de terminaison du service par rapport \u00e0 l''URL du contexte (par exemple http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Chemin d''acc\u00e8s \u00e0 un magasin de cl\u00e9s contenant le certificat et la paire de cl\u00e9s que ce serveur pr\u00e9sentera aux clients lors d''un acc\u00e8s via HTTPS. Si cette valeur est vide, utilisera par d\u00e9faut la valeur de la propri\u00e9t\u00e9 syst\u00e8me \u00ab javax.net.ssl.keyStore \u00bb. Cette valeur peut utiliser des expressions d''expansion de variable de la forme "$${name}" (pour les variables d''environnement et les propri\u00e9t\u00e9s syst\u00e8me) ou "$${file;/path/to/file}" (pour le contenu du fichier secret).
Path\ to\ database\ file=Chemin d''acc\u00e8s au fichier de base de donn\u00e9es
Path\ to\ external\ config\ file\ (in\ Jetty\ IOC\ XML\ format)=Chemin d''acc\u00e8s au fichier de configuration externe (au format XML Jetty IOC)
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Chemin d''acc\u00e8s au magasin de cl\u00e9s certifi\u00e9es TLS utilis\u00e9 lorsque l''authentification du client est requise. Ignor\u00e9 si l''authentification par certificat client n''est pas utilis\u00e9e. Les certificats de ce fichier d\u00e9signent les autorit\u00e9s de signature des certificats clients qui seront approuv\u00e9s. Si cette valeur est vide, utilisera par d\u00e9faut la valeur de la propri\u00e9t\u00e9 syst\u00e8me \u00ab javax.net.ssl.trustStore \u00bb. Cette valeur peut utiliser des expressions d''expansion de variable de la forme "$${name}" (pour les variables d''environnement et les propri\u00e9t\u00e9s syst\u00e8me) ou "$${file;/path/to/file}" (pour le contenu du fichier secret).
Port\ number\ to\ connect\ to\ on\ remote\ host\ (0\ to\ automatically\ select\ a\ port)=Num\u00e9ro de port auquel se connecter sur l''h\u00f4te distant (0 pour s\u00e9lectionner automatiquement un port)
SOS\ Endpoint=Point de terminaison SOS
SOS\ endpoint\ to\ fetch\ data\ from=Point de terminaison SOS \u00e0 partir duquel r\u00e9cup\u00e9rer les donn\u00e9es
