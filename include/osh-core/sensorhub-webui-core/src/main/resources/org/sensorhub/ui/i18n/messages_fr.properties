Filtered\ view\ to\ select\ systems/datastreams\ to\ register\ with\ Connected\ Systems=Vue filtr\u00e9e pour s\u00e9lectionner les syst\u00e8mes/flux de donn\u00e9es \u00e0 enregistrer aupr\u00e8s des syst\u00e8mes connect\u00e9s
