Authentication\ Method=M\u00e9thode d''authentification
Method\ used\ to\ authenticate\ users\ on\ this\ server=M\u00e9thode utilis\u00e9e pour authentifier les utilisateurs sur ce serveur
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.keyStore\"\ system\ property.\=Chemin d''acc\u00e8s \u00e0 un magasin de cl\u00e9s contenant le certificat et la paire de cl\u00e9s que ce serveur pr\u00e9sentera aux clients lors d''un acc\u00e8s via HTTPS. Si cette valeur est vide, utilisera par d\u00e9faut la valeur de la propri\u00e9t\u00e9 syst\u00e8me \"javax.net.ssl.keyStore\".
Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=Alias \u200b\u200bpour la paire de cl\u00e9s publique/priv\u00e9e dans le magasin de cl\u00e9s qui sera utilis\u00e9e pour identifier ce serveur.
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStore\"\ system\ property.\=Chemin d''acc\u00e8s au magasin de cl\u00e9s certifi\u00e9es TLS utilis\u00e9 lorsque l''authentification du client est requise. Ignor\u00e9 si l''authentification par certificat client n''est pas utilis\u00e9e. Les certificats de ce fichier d\u00e9signent les autorit\u00e9s de signature des certificats clients qui seront approuv\u00e9s. Si cette valeur est vide, utilisera par d\u00e9faut la valeur de la propri\u00e9t\u00e9 syst\u00e8me \"javax.net.ssl.trustStore\".
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStorePassword\"\ system\ property.\=Mot de passe du magasin de confiance. Ignor\u00e9 si l''authentification par certificat client n''est pas utilis\u00e9e. Si cette valeur est vide, utilisera par d\u00e9faut la valeur de la propri\u00e9t\u00e9 syst\u00e8me \"javax.net.ssl.trustStorePassword\".
