Names\ of\ datastreams\ whose\ data\ will\ be\ hidden\ from\ the\ SOS.\ If\ this\ is\ null,\ all\ streams\ produced\ by\ the\ procedure\ are\ exposed=Noms des flux de donn\u00e9es dont les donn\u00e9es seront masqu\u00e9es du SOS. Si celui-ci est nul, tous les flux produits par la proc\u00e9dure sont expos\u00e9s
