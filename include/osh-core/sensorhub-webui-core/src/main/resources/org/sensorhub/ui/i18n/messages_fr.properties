Fixed\ system\ location\ in\ EPSG\ 4979\ (WGS84)\ coordinate\ system=Emplacement du syst\u00e8me fixe dans le syst\u00e8me de coordonn\u00e9es EPSG 4979 (WGS84)
For\ each\ connection\ or\ reconnection\ attempt,\ the\ client\ will\ wait\ for\ the\ remote\ side\ to\ respond\ until\ this\ timeout\ expires\ (in\ ms)=Pour chaque tentative de connexion ou de reconnexion, le client attendra que le c\u00f4t\u00e9 distant r\u00e9ponde jusqu''\u00e0 l''expiration de ce d\u00e9lai (en ms)
Heading\ (or\ yaw)\ angle\ about\ Z\ axis\ in\ degrees=Angle de cap (ou de lacet) autour de l''axe Z en degr\u00e9s
How\ long\ the\ client\ will\ wait\ after\ connection\ is\ lost\ before\ it\ will\ attempt\ to\ reconnect\ (in\ ms)=Combien de temps le client attendra apr\u00e8s la perte de la connexion avant de tenter de se reconnecter (en ms)
ID\ Generator=G\u00e9n\u00e9rateur d''identifiants
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.=ID du module de base de donn\u00e9es utilis\u00e9 pour conserver les donn\u00e9es re\u00e7ues par ce service. Si aucun n''est fourni, les nouveaux syst\u00e8mes enregistr\u00e9s via ce service seront disponibles sur le hub, mais sans garantie de persistance lors des red\u00e9marrages.
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID du module de base de donn\u00e9es utilis\u00e9 pour conserver les donn\u00e9es re\u00e7ues par ce service. Si aucun n''est fourni, les nouveaux syst\u00e8mes enregistr\u00e9s via ce service seront disponibles sur le hub, mais sans garantie de persistance lors des red\u00e9marrages. Seules les derni\u00e8res observations de chaque flux de donn\u00e9es seront disponibles et les observations plus anciennes seront supprim\u00e9es.
Individual\ configuration\ of\ sensors\ in\ the\ array\ (will\ override\ common\ configuration)=Configuration individuelle des capteurs dans le r\u00e9seau (ignorera la configuration commune)
List\ of\ observed\ properties\ URI\ to\ make\ available\ as\ outputs=Liste des propri\u00e9t\u00e9s observ\u00e9es URI \u00e0 rendre disponible en sortie
Mapping\ of\ custom\ formats\ mime-types\ to\ custom\ serializer\ classes=Mappage des types MIME de formats personnalis\u00e9s avec des classes de s\u00e9rialiseur personnalis\u00e9es
Mappings\ used\ by\ CURIE\ to\ URI\ resolver=Mappages utilis\u00e9s par CURIE vers le r\u00e9solveur d''URI
Max\ Limit=Limite maximale
Max\ Observations\ Returned=Nombre maximal d''observations renvoy\u00e9es
Max\ Records\ Returned=Nombre maximal d''enregistrements renvoy\u00e9s
Max\ delay\ between\ auto-commit\ execution,\ in\ seconds.\ 0\ to\ disable\ time-based\ auto-commit=D\u00e9lai maximum entre l''ex\u00e9cution de la validation automatique, en secondes. 0 pour d\u00e9sactiver la validation automatique bas\u00e9e sur le temps
Maximum\ age\ of\ data\ to\ be\ kept\ in\ storage\ (in\ seconds)=\u00c2ge maximum des donn\u00e9es \u00e0 conserver en stockage (en secondes)
Maximum\ number\ of\ FoI\ IDs\ listed\ in\ capabilities=Nombre maximum d''ID FoI r\u00e9pertori\u00e9s dans les capacit\u00e9s
Maximum\ number\ of\ observations\ returned\ \ by\ a\ historical\ GetObservation\ request\ (for\ each\ selected\ offering)=Nombre maximum d''observations renvoy\u00e9es par une requ\u00eate historique GetObservation (pour chaque offre s\u00e9lectionn\u00e9e)
Maximum\ number\ of\ records\ in\ upload\ queue\ (used\ to\ compensate\ for\ variable\ bandwidth)=Nombre maximum d''enregistrements dans la file d''attente de t\u00e9l\u00e9chargement (utilis\u00e9 pour compenser la bande passante variable)
Maximum\ number\ of\ resources\ returned\ in\ a\ single\ page=Nombre maximum de ressources renvoy\u00e9es sur une seule page
Maximum\ number\ of\ result\ records\ returned\ by\ a\ historical\ GetResult\ request=Nombre maximum d''enregistrements de r\u00e9sultats renvoy\u00e9s par une requ\u00eate historique GetResult
Maximum\ number\ of\ stream\ errors\ before\ we\ try\ to\ reconnect\ to\ remote\ server=Nombre maximum d''erreurs de flux avant d''essayer de nous reconnecter au serveur distant
Memory\ cache\ size\ for\ page\ chunks,\ in\ KB=Taille du cache m\u00e9moire pour les fragments de page, en Ko
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ procedures/sensors\ registered\ through\ this\ service.\ Only\ sensors\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=M\u00e9tadonn\u00e9es du groupe syst\u00e8me qui sera cr\u00e9\u00e9 pour contenir toutes les proc\u00e9dures/capteurs enregistr\u00e9s via ce service. Seuls les capteurs de ce groupe seront modifiables par ce service
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ systems\ registered\ through\ this\ service.\ Only\ systems\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=M\u00e9tadonn\u00e9es du groupe de syst\u00e8mes qui sera cr\u00e9\u00e9 pour contenir tous les syst\u00e8mes enregistr\u00e9s via ce service. Seuls les syst\u00e8mes de ce groupe seront modifiables par ce service
Method\ used\ to\ generate\ new\ resource\ IDs=M\u00e9thode utilis\u00e9e pour g\u00e9n\u00e9rer de nouveaux ID de ressources
Minimum\ fillrate\ above\ which\ auto\ compact\ operations\ may\ be\ triggered=Taux de remplissage minimum au-dessus duquel les op\u00e9rations de compactage automatique peuvent \u00eatre d\u00e9clench\u00e9es
Minimum\ period\ between\ database\ commits\ (in\ ms)=P\u00e9riode minimale entre les validations de la base de donn\u00e9es (en ms)
Names\ of\ datastreams\ whose\ data\ will\ be\ hidden\ from\ the\ SOS.\ If\ this\ is\ null,\ all\ streams\ produced\ by\ the\ procedure\ are\ exposed=Noms des flux de donn\u00e9es dont les donn\u00e9es seront masqu\u00e9es du SOS. Si celui-ci est nul, tous les flux produits par la proc\u00e9dure sont expos\u00e9s
Observed\ Properties=Propri\u00e9t\u00e9s observ\u00e9es
Offering\ URI\ as\ exposed\ in\ capabilities.\ (if\ null,\ the\ procedure\ UID\ is\ used)=Offrir l\u2019URI tel qu\u2019expos\u00e9 dans les capacit\u00e9s. (si nul, l''UID de la proc\u00e9dure est utilis\u00e9)
Offering\ description\ (if\ null,\ it\ will\ be\ auto-generated)=Description de l''offre (si nulle, elle sera g\u00e9n\u00e9r\u00e9e automatiquement)
Offering\ name\ (if\ null,\ the\ procedure\ name\ is\ used)=Nom de l''offre (si nul, le nom de la proc\u00e9dure est utilis\u00e9)
