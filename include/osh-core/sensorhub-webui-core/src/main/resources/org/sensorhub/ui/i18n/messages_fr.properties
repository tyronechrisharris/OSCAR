Minimum\ fillrate\ above\ which\ auto\ compact\ operations\ may\ be\ triggered=Taux de remplissage minimum au-dessus duquel les op\u00e9rations de compactage automatique peuvent \u00eatre d\u00e9clench\u00e9es
