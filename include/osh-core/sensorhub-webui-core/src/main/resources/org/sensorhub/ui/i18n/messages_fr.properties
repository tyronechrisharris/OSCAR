Maximum\ number\ of\ times\ the\ client\ will\ attempt\ to\ reconnect\ when\ the\ connection\ is\ not\ available\ or\ lost.\ A\ negative\ value\ means\ that\ there\ is\ no\ limit\ to\ the\ number\ of\ reconnection\ attempts.\ Zero\ means\ not\ to\ attempt\ reconnection.=Nombre maximum de fois o\u00f9 le client tentera de se reconnecter lorsque la connexion n''est pas disponible ou perdue. Une valeur n\u00e9gative signifie qu''il n''y a pas de limite au nombre de tentatives de reconnexion. Z\u00e9ro signifie ne pas tenter de se reconnecter.
