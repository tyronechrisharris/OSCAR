ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID du module de base de donn\u00e9es utilis\u00e9 pour conserver les donn\u00e9es re\u00e7ues par ce service. Si aucun n''est fourni, les nouveaux syst\u00e8mes enregistr\u00e9s via ce service seront disponibles sur le hub, mais sans garantie de persistance lors des red\u00e9marrages. Seules les derni\u00e8res observations de chaque flux de donn\u00e9es seront disponibles et les observations plus anciennes seront supprim\u00e9es.
