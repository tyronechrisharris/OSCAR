Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Pfad zum TLS-Truststore, der verwendet wird, wenn eine Clientauthentifizierung erforderlich ist. Wird ignoriert, wenn die Clientzertifikatauthentifizierung nicht verwendet wird. Die Zertifikate in dieser Datei geben die Signierungsstellen f\u00fcr vertrauensw\u00fcrdige Client-Zertifikate an. Wenn dieser Wert leer ist, wird standardm\u00e4\u00dfig der Wert der Systemeigenschaft \u201ejavax.net.ssl.trustStore\u201c verwendet. Dieser Wert kann Variablenerweiterungsausdr\u00fccke der Form \u201e$${name}\u201c (f\u00fcr Umgebungsvariablen und Systemeigenschaften) oder \u201e$${file;/path/to/file}\u201c (f\u00fcr geheime Dateiinhalte) verwenden.
