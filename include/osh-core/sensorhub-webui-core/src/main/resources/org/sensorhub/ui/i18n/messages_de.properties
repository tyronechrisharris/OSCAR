Public\ URL\ as\ viewed\ from\ the\ outside\ when\ requests\ transit\ through\ a\ proxy\ server.=\u00d6ffentliche URL, wie sie von au\u00dfen angezeigt wird, wenn Anfragen \u00fcber einen Proxyserver \u00fcbertragen werden.
Authentication\ Method=Authentifizierungsmethode
Method\ used\ to\ authenticate\ users\ on\ this\ server=Methode zur Authentifizierung von Benutzern auf diesem Server
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.keyStore\"\ system\ property.\=Pfad zu einem Schl\u00fcsselspeicher, der das Zertifikat und das Schl\u00fcsselpaar enth\u00e4lt, die dieser Server den Clients pr\u00e4sentiert, wenn \u00fcber HTTPS darauf zugegriffen wird. Wenn dieser Wert leer ist, wird standardm\u00e4\u00dfig der Wert der Systemeigenschaft \u201ejavax.net.ssl.keyStore\u201c verwendet.
Alias\ for\ the\ public/private\ keypair\ within\ the\ key\ store\ that\ will\ be\ used\ to\ identify\ this\ server.=Alias \u200b\u200bf\u00fcr das \u00f6ffentliche/private Schl\u00fcsselpaar im Schl\u00fcsselspeicher, das zur Identifizierung dieses Servers verwendet wird.
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStore\"\ system\ property.\=Pfad zum TLS-Truststore, der verwendet wird, wenn eine Clientauthentifizierung erforderlich ist. Wird ignoriert, wenn die Clientzertifikatauthentifizierung nicht verwendet wird. Die Zertifikate in dieser Datei geben die Signierungsstellen f\u00fcr vertrauensw\u00fcrdige Client-Zertifikate an. Wenn dieser Wert leer ist, wird standardm\u00e4\u00dfig der Wert der Systemeigenschaft \u201ejavax.net.ssl.trustStore\u201c verwendet.
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ \"javax.net.ssl.trustStorePassword\"\ system\ property.\=Passwort f\u00fcr den Truststore. Wird ignoriert, wenn die Clientzertifikatauthentifizierung nicht verwendet wird. Wenn dieser Wert leer ist, wird standardm\u00e4\u00dfig der Wert der Systemeigenschaft \u201ejavax.net.ssl.trustStorePassword\u201c verwendet.
