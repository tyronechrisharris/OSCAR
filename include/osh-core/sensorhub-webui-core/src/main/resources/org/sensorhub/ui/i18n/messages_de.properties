Maximum\ number\ of\ times\ the\ client\ will\ attempt\ to\ reconnect\ when\ the\ connection\ is\ not\ available\ or\ lost.\ A\ negative\ value\ means\ that\ there\ is\ no\ limit\ to\ the\ number\ of\ reconnection\ attempts.\ Zero\ means\ not\ to\ attempt\ reconnection.=Maximale Anzahl der Versuche des Clients, die Verbindung wiederherzustellen, wenn die Verbindung nicht verf\u00fcgbar ist oder verloren geht. Ein negativer Wert bedeutet, dass die Anzahl der Wiederverbindungsversuche unbegrenzt ist. Null bedeutet, dass keine erneute Verbindung versucht wird.
