Max\ Records\ Returned=Maximale Anzahl zur\u00fcckgegebener Datens\u00e4tze
Max\ delay\ between\ auto-commit\ execution,\ in\ seconds.\ 0\ to\ disable\ time-based\ auto-commit=Maximale Verz\u00f6gerung zwischen der Auto-Commit-Ausf\u00fchrung in Sekunden. 0, um die zeitbasierte automatische Festschreibung zu deaktivieren
Maximum\ age\ of\ data\ to\ be\ kept\ in\ storage\ (in\ seconds)=Maximales Alter der im Speicher aufzubewahrenden Daten (in Sekunden)
Maximum\ number\ of\ FoI\ IDs\ listed\ in\ capabilities=Maximale Anzahl der in den Funktionen aufgef\u00fchrten FoI-IDs
Maximum\ number\ of\ observations\ returned\ \ by\ a\ historical\ GetObservation\ request\ (for\ each\ selected\ offering)=Maximale Anzahl von Beobachtungen, die von einer historischen GetObservation-Anfrage zur\u00fcckgegeben werden (f\u00fcr jedes ausgew\u00e4hlte Angebot)
Maximum\ number\ of\ records\ in\ upload\ queue\ (used\ to\ compensate\ for\ variable\ bandwidth)=Maximale Anzahl von Datens\u00e4tzen in der Upload-Warteschlange (wird zum Ausgleich variabler Bandbreite verwendet)
Maximum\ number\ of\ resources\ returned\ in\ a\ single\ page=Maximale Anzahl von Ressourcen, die auf einer einzelnen Seite zur\u00fcckgegeben werden
Maximum\ number\ of\ result\ records\ returned\ by\ a\ historical\ GetResult\ request=Maximale Anzahl von Ergebnisdatens\u00e4tzen, die von einer historischen GetResult-Anfrage zur\u00fcckgegeben werden
Maximum\ number\ of\ stream\ errors\ before\ we\ try\ to\ reconnect\ to\ remote\ server=Maximale Anzahl an Stream-Fehlern, bevor wir versuchen, die Verbindung zum Remote-Server wiederherzustellen
Memory\ cache\ size\ for\ page\ chunks,\ in\ KB=Speichercachegr\u00f6\u00dfe f\u00fcr Seitenbl\u00f6cke, in KB
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ procedures/sensors\ registered\ through\ this\ service.\ Only\ sensors\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadaten der Systemgruppe, die erstellt wird, um alle \u00fcber diesen Dienst registrierten Prozeduren/Sensoren zu enthalten. Nur Sensoren in dieser Gruppe k\u00f6nnen von diesem Dienst ge\u00e4ndert werden
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ systems\ registered\ through\ this\ service.\ Only\ systems\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadaten der Systemgruppe, die erstellt wird, um alle \u00fcber diesen Dienst registrierten Systeme zu enthalten. Nur Systeme in dieser Gruppe k\u00f6nnen von diesem Dienst ge\u00e4ndert werden
Method\ used\ to\ generate\ new\ resource\ IDs=Methode zum Generieren neuer Ressourcen-IDs
Minimum\ fillrate\ above\ which\ auto\ compact\ operations\ may\ be\ triggered=Mindestf\u00fcllrate, oberhalb derer automatische Komprimierungsvorg\u00e4nge ausgel\u00f6st werden k\u00f6nnen
Minimum\ period\ between\ database\ commits\ (in\ ms)=Mindestzeitraum zwischen Datenbank-Commits (in ms)
Names\ of\ datastreams\ whose\ data\ will\ be\ hidden\ from\ the\ SOS.\ If\ this\ is\ null,\ all\ streams\ produced\ by\ the\ procedure\ are\ exposed=Namen von Datenstr\u00f6men, deren Daten vor dem SOS verborgen werden. Wenn dieser Wert null ist, werden alle von der Prozedur erzeugten Streams verf\u00fcgbar gemacht
Observed\ Properties=Beobachtete Eigenschaften
Offering\ URI\ as\ exposed\ in\ capabilities.\ (if\ null,\ the\ procedure\ UID\ is\ used)=Bietet URI wie in den Funktionen verf\u00fcgbar gemacht. (Wenn null, wird die Prozedur-UID verwendet)
