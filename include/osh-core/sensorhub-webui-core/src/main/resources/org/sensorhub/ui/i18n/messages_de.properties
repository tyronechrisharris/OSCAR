ID\ Generator=ID-Generator
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.=ID des Datenbankmoduls, das zum Beibehalten der von diesem Dienst empfangenen Daten verwendet wird. Wenn keine Angabe erfolgt, sind \u00fcber diesen Dienst registrierte neue Systeme auf dem Hub verf\u00fcgbar, jedoch ohne Persistenzgarantie bei Neustarts.
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID des Datenbankmoduls, das zum Beibehalten der von diesem Dienst empfangenen Daten verwendet wird. Wenn keine Angabe erfolgt, sind \u00fcber diesen Dienst registrierte neue Systeme auf dem Hub verf\u00fcgbar, jedoch ohne Persistenzgarantie bei Neustarts. Von jedem Datenstrom ist nur die neueste Beobachtung verf\u00fcgbar und \u00e4ltere Beobachtungen werden verworfen
Individual\ configuration\ of\ sensors\ in\ the\ array\ (will\ override\ common\ configuration)=Individuelle Konfiguration der Sensoren im Array (\u00fcberschreibt die allgemeine Konfiguration)
