Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Passwort f\u00fcr den Schl\u00fcsselspeicher (und f\u00fcr das Schl\u00fcsselpaar innerhalb des Schl\u00fcsselspeichers). Wenn dieser Wert leer ist, wird standardm\u00e4\u00dfig der Wert der Systemeigenschaft \u201ejavax.net.ssl.keyStorePassword\u201c verwendet. Dieser Wert kann Variablenerweiterungsausdr\u00fccke der Form \u201e$${name}\u201c (f\u00fcr Umgebungsvariablen und Systemeigenschaften) oder \u201e$${file;/path/to/file}\u201c (f\u00fcr geheime Dateiinhalte) verwenden.
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Passwort f\u00fcr den Truststore. Wird ignoriert, wenn die Clientzertifikatauthentifizierung nicht verwendet wird. Wenn dieser Wert leer ist, wird standardm\u00e4\u00dfig der Wert der Systemeigenschaft \u201ejavax.net.ssl.trustStorePassword\u201c verwendet. Dieser Wert kann Variablenerweiterungsausdr\u00fccke der Form \u201e$${name}\u201c (f\u00fcr Umgebungsvariablen und Systemeigenschaften) oder \u201e$${file;/path/to/file}\u201c (f\u00fcr geheime Dateiinhalte) verwenden.
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=Pfad des Dienstendpunkts relativ zur Kontext-URL (z. B. http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Pfad zu einem Schl\u00fcsselspeicher, der das Zertifikat und das Schl\u00fcsselpaar enth\u00e4lt, die dieser Server den Clients pr\u00e4sentiert, wenn \u00fcber HTTPS darauf zugegriffen wird. Wenn dieser Wert leer ist, wird standardm\u00e4\u00dfig der Wert der Systemeigenschaft \u201ejavax.net.ssl.keyStore\u201c verwendet. Dieser Wert kann Variablenerweiterungsausdr\u00fccke der Form \u201e$${name}\u201c (f\u00fcr Umgebungsvariablen und Systemeigenschaften) oder \u201e$${file;/path/to/file}\u201c (f\u00fcr geheime Dateiinhalte) verwenden.
