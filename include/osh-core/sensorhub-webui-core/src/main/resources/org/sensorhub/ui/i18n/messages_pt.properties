Orientation\ as\ Euler\ angles\ in\ NED\ coordinate\ reference\ frame.\nOrder\ of\ rotations\ is\ z-y\u2019-x"\ (in\ rotating\ frame)\ or\ x-y-z\ (in\ fixed\ frame)=Orienta\u00e7\u00e3o como \u00e2ngulos de Euler no referencial de coordenadas NED.\nA ordem das rota\u00e7\u00f5es \u00e9 z-y\u2019-x" (no quadro girat\u00f3rio) ou x-y-z (no quadro fixo)
Password\ for\ the\ key\ store\ (and\ for\ the\ keypair\ within\ the\ keystore).\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Senha para o armazenamento de chaves (e para o par de chaves dentro do armazenamento de chaves). Se esse valor estiver em branco, o padr\u00e3o ser\u00e1 usar o valor da propriedade do sistema "javax.net.ssl.keyStorePassword". Este valor pode usar express\u00f5es de expans\u00e3o de vari\u00e1veis \u200b\u200bno formato "$${name}" (para vari\u00e1veis \u200b\u200bde ambiente e propriedades do sistema) ou "$${file;/path/to/file}" (para conte\u00fado de arquivo secreto).
Password\ for\ the\ trust\ store.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStorePassword"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Senha para o armazenamento confi\u00e1vel. Ignorado se a autentica\u00e7\u00e3o de certificado de cliente n\u00e3o for usada. Se esse valor estiver em branco, o padr\u00e3o ser\u00e1 usar o valor da propriedade do sistema "javax.net.ssl.trustStorePassword". Este valor pode usar express\u00f5es de expans\u00e3o de vari\u00e1veis \u200b\u200bno formato "$${name}" (para vari\u00e1veis \u200b\u200bde ambiente e propriedades do sistema) ou "$${file;/path/to/file}" (para conte\u00fado de arquivo secreto).
Path\ of\ service\ endpoint\ relative\ to\ the\ context\ URL\ (e.g.\ http\://server.net/sensorhub)=Caminho do endpoint de servi\u00e7o relativo ao URL de contexto (por exemplo, http://server.net/sensorhub)
Path\ to\ a\ key\ store\ containing\ the\ certificate\ and\ keypair\ that\ this\ server\ will\ present\ to\ clients\ when\ accessed\ over\ HTTPS.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.keyStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Caminho para um armazenamento de chaves que cont\u00e9m o certificado e o par de chaves que este servidor apresentar\u00e1 aos clientes quando acessado por HTTPS. Se esse valor estiver em branco, o padr\u00e3o ser\u00e1 usar o valor da propriedade do sistema "javax.net.ssl.keyStore". Este valor pode usar express\u00f5es de expans\u00e3o de vari\u00e1veis \u200b\u200bno formato "$${name}" (para vari\u00e1veis \u200b\u200bde ambiente e propriedades do sistema) ou "$${file;/path/to/file}" (para conte\u00fado de arquivo secreto).
Path\ to\ database\ file=Caminho para o arquivo do banco de dados
Path\ to\ external\ config\ file\ (in\ Jetty\ IOC\ XML\ format)=Caminho para o arquivo de configura\u00e7\u00e3o externo (no formato Jetty IOC XML)
Path\ to\ the\ TLS\ trust\ store\ that\ is\ used\ when\ client\ authentication\ is\ required.\ Ignored\ if\ client\ certificate\ authentication\ is\ not\ used.\ Certificates\ in\ this\ file\ designate\ the\ signing\ authorities\ for\ client\ certificates\ that\ will\ be\ trusted.\ If\ this\ value\ is\ blank,\ will\ default\ to\ using\ the\ value\ of\ the\ "javax.net.ssl.trustStore"\ system\ property.\ This\ value\ can\ use\ variable\ expansion\ expressions\ of\ the\ form\ "$${name}"\ (for\ environment\ variables\ and\ system\ properties)\ or\ "$${file;/path/to/file}"\ (for\ secret\ file\ contents).=Caminho para o armazenamento confi\u00e1vel TLS usado quando a autentica\u00e7\u00e3o do cliente \u00e9 necess\u00e1ria. Ignorado se a autentica\u00e7\u00e3o de certificado de cliente n\u00e3o for usada. Os certificados neste arquivo designam as autoridades de assinatura dos certificados de cliente que ser\u00e3o confi\u00e1veis. Se esse valor estiver em branco, o padr\u00e3o ser\u00e1 usar o valor da propriedade do sistema "javax.net.ssl.trustStore". Este valor pode usar express\u00f5es de expans\u00e3o de vari\u00e1veis \u200b\u200bno formato "$${name}" (para vari\u00e1veis \u200b\u200bde ambiente e propriedades do sistema) ou "$${file;/path/to/file}" (para conte\u00fado de arquivo secreto).
Port\ number\ to\ connect\ to\ on\ remote\ host\ (0\ to\ automatically\ select\ a\ port)=N\u00famero da porta para conex\u00e3o no host remoto (0 para selecionar automaticamente uma porta)
