Set\ to\ compact\ the\ database\ file\ when\ the\ database\ module\ is\ stopped\ or\ restarted=Definido para compactar o arquivo de banco de dados quando o m\u00f3dulo de banco de dados for interrompido ou reiniciado
Set\ to\ compress\ underlying\ file\ storage=Definido para compactar o armazenamento de arquivos subjacente
Set\ to\ display\ MVStore\ debug\ info\ when\ database\ is\ closed\ (only\ if\ DEBUG\ log\ is\ also\ enabled)=Definido para exibir informa\u00e7\u00f5es de depura\u00e7\u00e3o do MVStore quando o banco de dados estiver fechado (somente se o log DEBUG tamb\u00e9m estiver habilitado)
