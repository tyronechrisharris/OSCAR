For\ each\ connection\ or\ reconnection\ attempt,\ the\ client\ will\ wait\ for\ the\ remote\ side\ to\ respond\ until\ this\ timeout\ expires\ (in\ ms)=Para cada tentativa de conex\u00e3o ou reconex\u00e3o, o cliente aguardar\u00e1 a resposta do lado remoto at\u00e9 que esse tempo limite expire (em ms)
Heading\ (or\ yaw)\ angle\ about\ Z\ axis\ in\ degrees=\u00c2ngulo de rumo (ou guinada) em torno do eixo Z em graus
