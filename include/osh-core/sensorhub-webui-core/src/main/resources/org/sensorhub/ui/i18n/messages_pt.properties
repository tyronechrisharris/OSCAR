ID\ Generator=Gerador de ID
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.=ID do m\u00f3dulo de banco de dados usado para persistir dados recebidos por este servi\u00e7o. Se nada for fornecido, novos sistemas registrados por meio deste servi\u00e7o estar\u00e3o dispon\u00edveis no hub, mas sem garantia de persist\u00eancia nas reinicializa\u00e7\u00f5es.
ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID do m\u00f3dulo de banco de dados usado para persistir dados recebidos por este servi\u00e7o. Se nada for fornecido, novos sistemas registrados por meio deste servi\u00e7o estar\u00e3o dispon\u00edveis no hub, mas sem garantia de persist\u00eancia nas reinicializa\u00e7\u00f5es. Somente a observa\u00e7\u00e3o mais recente de cada fluxo de dados estar\u00e1 dispon\u00edvel e as observa\u00e7\u00f5es mais antigas ser\u00e3o descartadas
Individual\ configuration\ of\ sensors\ in\ the\ array\ (will\ override\ common\ configuration)=Configura\u00e7\u00e3o individual de sensores na matriz (substituir\u00e1 a configura\u00e7\u00e3o comum)
List\ of\ observed\ properties\ URI\ to\ make\ available\ as\ outputs=Lista de URI de propriedades observadas para disponibilizar como sa\u00eddas
Mapping\ of\ custom\ formats\ mime-types\ to\ custom\ serializer\ classes=Mapeamento de tipos MIME de formatos personalizados para classes serializadoras personalizadas
Mappings\ used\ by\ CURIE\ to\ URI\ resolver=Mapeamentos usados \u200b\u200bpelo CURIE para o resolvedor de URI
Max\ Limit=Limite m\u00e1ximo
Max\ Observations\ Returned=M\u00e1ximo de observa\u00e7\u00f5es retornadas
Max\ Records\ Returned=M\u00e1ximo de registros retornados
Max\ delay\ between\ auto-commit\ execution,\ in\ seconds.\ 0\ to\ disable\ time-based\ auto-commit=Atraso m\u00e1ximo entre a execu\u00e7\u00e3o da confirma\u00e7\u00e3o autom\u00e1tica, em segundos. 0 para desativar a confirma\u00e7\u00e3o autom\u00e1tica baseada em tempo
Maximum\ age\ of\ data\ to\ be\ kept\ in\ storage\ (in\ seconds)=Idade m\u00e1xima dos dados a serem mantidos em armazenamento (em segundos)
Maximum\ number\ of\ FoI\ IDs\ listed\ in\ capabilities=N\u00famero m\u00e1ximo de IDs FoI listados em recursos
Maximum\ number\ of\ observations\ returned\ \ by\ a\ historical\ GetObservation\ request\ (for\ each\ selected\ offering)=N\u00famero m\u00e1ximo de observa\u00e7\u00f5es retornadas por uma solicita\u00e7\u00e3o GetObservation hist\u00f3rica (para cada oferta selecionada)
Maximum\ number\ of\ records\ in\ upload\ queue\ (used\ to\ compensate\ for\ variable\ bandwidth)=N\u00famero m\u00e1ximo de registros na fila de upload (usado para compensar a largura de banda vari\u00e1vel)
Maximum\ number\ of\ resources\ returned\ in\ a\ single\ page=N\u00famero m\u00e1ximo de recursos retornados em uma \u00fanica p\u00e1gina
Maximum\ number\ of\ result\ records\ returned\ by\ a\ historical\ GetResult\ request=N\u00famero m\u00e1ximo de registros de resultados retornados por uma solicita\u00e7\u00e3o GetResult hist\u00f3rica
Maximum\ number\ of\ stream\ errors\ before\ we\ try\ to\ reconnect\ to\ remote\ server=N\u00famero m\u00e1ximo de erros de stream antes de tentarmos reconectar ao servidor remoto
Memory\ cache\ size\ for\ page\ chunks,\ in\ KB=Tamanho do cache de mem\u00f3ria para blocos de p\u00e1ginas, em KB
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ procedures/sensors\ registered\ through\ this\ service.\ Only\ sensors\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadados do grupo de sistemas que ser\u00e3o criados para conter todos os procedimentos/sensores cadastrados atrav\u00e9s deste servi\u00e7o. Apenas os sensores deste grupo poder\u00e3o ser modificados por este servi\u00e7o
Metadata\ of\ system\ group\ that\ will\ be\ created\ to\ contain\ all\ systems\ registered\ through\ this\ service.\ Only\ systems\ in\ this\ group\ will\ be\ modifiable\ by\ this\ service=Metadados do grupo de sistemas que ser\u00e3o criados para conter todos os sistemas cadastrados atrav\u00e9s deste servi\u00e7o. Somente os sistemas deste grupo poder\u00e3o ser modificados por este servi\u00e7o
Method\ used\ to\ generate\ new\ resource\ IDs=M\u00e9todo usado para gerar novos IDs de recursos
Minimum\ fillrate\ above\ which\ auto\ compact\ operations\ may\ be\ triggered=Taxa de preenchimento m\u00ednima acima da qual as opera\u00e7\u00f5es de compacta\u00e7\u00e3o autom\u00e1tica podem ser acionadas
Minimum\ period\ between\ database\ commits\ (in\ ms)=Per\u00edodo m\u00ednimo entre commits do banco de dados (em ms)
Names\ of\ datastreams\ whose\ data\ will\ be\ hidden\ from\ the\ SOS.\ If\ this\ is\ null,\ all\ streams\ produced\ by\ the\ procedure\ are\ exposed=Nomes de fluxos de dados cujos dados ser\u00e3o ocultados do SOS. Se for nulo, todos os fluxos produzidos pelo procedimento ser\u00e3o expostos
Observed\ Properties=Propriedades observadas
Offering\ URI\ as\ exposed\ in\ capabilities.\ (if\ null,\ the\ procedure\ UID\ is\ used)=Oferecendo URI conforme exposto em recursos. (se nulo, o procedimento UID \u00e9 usado)
Offering\ description\ (if\ null,\ it\ will\ be\ auto-generated)=Descri\u00e7\u00e3o da oferta (se nula, ser\u00e1 gerada automaticamente)
Offering\ name\ (if\ null,\ the\ procedure\ name\ is\ used)=Nome da oferta (se nulo, o nome do procedimento ser\u00e1 usado)
