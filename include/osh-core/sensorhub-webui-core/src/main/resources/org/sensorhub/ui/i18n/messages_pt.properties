ID\ of\ database\ module\ used\ for\ persisting\ data\ received\ by\ this\ service.\ If\ none\ is\ provided,\ new\ systems\ registered\ through\ this\ service\ will\ be\ available\ on\ the\ hub,\ but\ with\ no\ persistence\ guarantee\ across\ restarts.\ Only\ the\ latest\ observation\ from\ each\ datastream\ will\ be\ available\ and\ older\ observations\ will\ be\ discarded=ID do m\u00f3dulo de banco de dados usado para persistir dados recebidos por este servi\u00e7o. Se nada for fornecido, novos sistemas registrados por meio deste servi\u00e7o estar\u00e3o dispon\u00edveis no hub, mas sem garantia de persist\u00eancia nas reinicializa\u00e7\u00f5es. Somente a observa\u00e7\u00e3o mais recente de cada fluxo de dados estar\u00e1 dispon\u00edvel e as observa\u00e7\u00f5es mais antigas ser\u00e3o descartadas
