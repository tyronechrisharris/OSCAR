Set\ to\ true\ to\ enable\ transactional\ operation\ support=Defina como verdadeiro para ativar o suporte \u00e0 opera\u00e7\u00e3o transacional
Size\ of\ the\ auto-commit\ write\ buffer,\ in\ KB=Tamanho do buffer de grava\u00e7\u00e3o de confirma\u00e7\u00e3o autom\u00e1tica, em KB
TCP\ port\ where\ server\ will\ listen\ for\ secure\ HTTP\ (HTTPS)\ connections\ (use\ 0\ to\ disable\ HTTPS).=Porta TCP onde o servidor escutar\u00e1 conex\u00f5es HTTP seguras (HTTPS) (use 0 para desabilitar HTTPS).
TCP\ port\ where\ server\ will\ listen\ for\ unsecure\ HTTP\ connections\ (use\ 0\ to\ disable\ HTTP).=Porta TCP onde o servidor escutar\u00e1 conex\u00f5es HTTP n\u00e3o seguras (use 0 para desativar o HTTP).
Time-out\ after\ which\ real-time\ requests\ are\ disabled\ if\ no\ more\ measurements\ are\ received\ (in\ seconds).\ Real-time\ is\ reactivated\ as\ soon\ as\ new\ records\ start\ being\ received\ again=Tempo limite ap\u00f3s o qual as solicita\u00e7\u00f5es em tempo real ser\u00e3o desativadas se n\u00e3o forem recebidas mais medi\u00e7\u00f5es (em segundos). O tempo real \u00e9 reativado assim que novos registros voltam a ser recebidos
Time-out\ period\ after\ which\ a\ template\ ID\ reserved\ using\ InsertResultTemplate\ will\ expire\ if\ not\ used\ in\ InsertResult\ requests\ (in\ seconds)=Per\u00edodo de tempo limite ap\u00f3s o qual um ID de modelo reservado usando InsertResultTemplate expirar\u00e1 se n\u00e3o for usado em solicita\u00e7\u00f5es InsertResult (em segundos)
Timeout\ after\ which\ data\ is\ released\ to\ the\ caller\ if\ at\ least\ one\ byte\ was\ received\ (in\ ms)=Tempo limite ap\u00f3s o qual os dados ser\u00e3o liberados para o chamador se pelo menos um byte for recebido (em ms)
URI\ Prefix\ Map=Mapa de prefixo URI
Unique\ ID\ (full\ URN\ or\ only\ suffix)\ to\ use\ for\ the\ sensor\ system\ or\ 'auto'\ to\ use\ the\ UUID\ randomly\ generated\ the\ first\ time\ the\ module\ is\ initialized=ID exclusivo (URN completo ou apenas sufixo) para usar no sistema de sensor ou ''autom\u00e1tico'' para usar o UUID gerado aleatoriamente na primeira vez que o m\u00f3dulo for inicializado
Unique\ ID\ of\ a\ system\ that\ this\ configuration\ applies\ to.\nCan\ include\ a\ trailing\ wildcard\ '*'\ to\ match\ several\ systems\ at\ once.=ID exclusivo de um sistema ao qual esta configura\u00e7\u00e3o se aplica.\nPode incluir um curinga final ''*'' para corresponder a v\u00e1rios sistemas ao mesmo tempo.
Unique\ ID\ of\ sensor\ to\ connect\ to\ on\ SOS\ and\ SPS\ servers=ID exclusivo do sensor para conex\u00e3o em servidores SOS e SPS
