worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # ==========================================================
    # Global Security Headers
    # ==========================================================
    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin;
    # Require HTTPS globally
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ==========================================================
    # Logging Configuration
    # ==========================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ==========================================================
    # Redirect HTTP to HTTPS
    # ==========================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ==========================================================
    # Secure HTTPS Server
    # Target Topology: Wireless & Internet-Connected Networks
    # Objective: Enforce strong TLS, secure ciphers, and robust
    #            reverse-proxy configurations to protect the
    #            OSCAR application.
    # ==========================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name oscar.local; # Update to match your domain

        # TLS Certificates (Use Let's Encrypt or Internal CA)
        ssl_certificate /etc/ssl/certs/oscar.crt;
        ssl_certificate_key /etc/ssl/private/oscar.key;

        # TLS Protocol and Cipher Suite Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # ==========================================================
        # Reverse Proxy to OSCAR Application (Backend)
        # ==========================================================
        location / {
            proxy_pass http://127.0.0.1:8282; # Point to the internal API port
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Support (Required for real-time sensor streams/MQTT over WS)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout Settings
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;

            # Buffering
            proxy_buffering off;
        }

        # ==========================================================
        # Static Asset Caching (Optional but Recommended)
        # ==========================================================
        # If serving a frontend (e.g., Next.js dashboard), define rules for static files.
        # location /_next/static/ {
        #     proxy_pass http://127.0.0.1:3000;
        #     proxy_cache_valid 200 1h;
        # }
    }
}
